<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book Coach · 20FIT</title>
<style>
  :root{--red:#C41101;--bg:#F3F2F0;--card:#FFFFFF;--line:#E8E2DB;--txt:#1A1714;--ink:#16170F;--muted:#8A7C68;--inp:#F0EDE5;--dark:#000;--pagetx:#16170F;--shadow:0 2px 12px rgba(0,0,0,.10)}
  html:not(.theme-light){ --bg:#0C0D10;--card:#17191F;--line:#25272E;--txt:#F4F5F7;--ink:#F4F5F7;--muted:#8E9198;--inp:#23262E;--pagetx:#F4F5F7 }
  *{box-sizing:border-box} a{text-decoration:none;color:inherit}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--pagetx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 18px 96px}
  .wrap{max-width:620px;margin:0 auto}
  .logobar{background:var(--dark);border-radius:16px;padding:13px 18px;margin-bottom:16px;display:flex;align-items:center}
  .logobar img{height:34px}
  h1{font-size:24px;font-weight:900;margin:0 0 6px;text-transform:uppercase}
  .lead{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media(min-width:560px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .cc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .cc .av{width:100%;aspect-ratio:1;position:relative;background:var(--inp)}
  .cc .av img{width:100%;height:100%;object-fit:cover;display:block}
  .cc .ini{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:30px;letter-spacing:.02em}
  .cc .tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.42);border-radius:6px;padding:3px 7px}
  .cc .bd{padding:11px 12px 13px}
  .cc .nm{font-weight:800;font-size:14px;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
  .cc .sp{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .foot{margin-top:18px;text-align:center}
  .foot a{display:inline-block;border:1.5px solid var(--ink);border-radius:10px;padding:11px 18px;font-weight:800;font-size:13px;color:var(--ink)}
  .foot p{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.5}
  .state{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);font-size:13px}
  .retry{margin-top:12px;border:1px solid var(--red);color:var(--red);background:transparent;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .skg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:560px){ .skg{grid-template-columns:repeat(3,1fr)} }
  .skel{aspect-ratio:.8;border-radius:16px;background:linear-gradient(90deg,var(--inp),color-mix(in srgb,var(--inp) 55%,#fff),var(--inp));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logobar"><img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT" /></div>
    <h1 id="pgTitle">Book Coach</h1>
    <p class="lead" id="pgLead"></p>
    <div id="root"></div>
  </div>

  <script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
  <script src="js/vendor-supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script>
  (function(){
    "use strict";
    var TXT={
      title:{en:"Book Coach",id:"Book Coach"},
      lead:{en:"Our Arena & Gym coaches. Pick your class and schedule in Book Class.",
            id:"Coach Arena & Gym kami. Pilih kelas & jadwalnya di Book Class."},
      loadErr:{en:"Couldn't load coaches.",id:"Gagal memuat coach."},
      retry:{en:"Try again",id:"Coba lagi"},
      empty:{en:"No coaches available right now.",id:"Belum ada coach saat ini."},
      footNote:{en:"Class schedules & booking are managed in Book Class.",id:"Jadwal kelas & booking dikelola di Book Class."},
      footCta:{en:"Go to Book Class",id:"Ke Book Class"}
    };
    function LL(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
    var $=function(id){return document.getElementById(id);};
    async function apiFetch(path){ var o={headers:{"Content-Type":"application/json"}}; try{var tk=await Auth.token(); if(tk)o.headers["Authorization"]="Bearer "+tk;}catch(e){} return fetch(path,o); }
    // Inisial + warna stabil dari nama (fallback foto). Blok warna, bukan ikon abu seragam.
    var PAL=["#C41101","#2A7A4F","#2F6BFF","#7c5cff","#C87000","#0EA5A5","#B0308A","#4A5568"];
    function initials(n){ var p=String(n||"").trim().split(/\s+/); var a=(p[0]||"")[0]||"", b=(p.length>1?(p[p.length-1][0]||""):""); return (a+b).toUpperCase()||"?"; }
    function colorFor(n){ var s=String(n||""),h=0; for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return PAL[h%PAL.length]; }

    var COACHES=null, STATE="loading";
    function applyStatic(){ $("pgTitle").textContent=LL(TXT.title); $("pgLead").textContent=LL(TXT.lead); document.title=LL(TXT.title)+" · 20FIT"; }
    function card(c){
      var av = c.photo_url
        ? '<div class="av"><img src="'+esc(c.photo_url)+'" alt="'+esc(c.name)+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><span class="ini" style="display:none;background:'+colorFor(c.name)+'">'+esc(initials(c.name))+'</span>'
        : '<div class="av"><span class="ini" style="background:'+colorFor(c.name)+'">'+esc(initials(c.name))+'</span>';
      var tag = c.source==="gym" ? "Gym" : "Arena";
      av += '<span class="tag">'+tag+'</span></div>';
      return '<div class="cc">'+av+'<div class="bd"><div class="nm">'+esc(c.name)+'</div>'+(c.speciality?'<div class="sp">'+esc(c.speciality)+'</div>':'')+'</div></div>';
    }
    function render(){
      var root=$("root"); if(!root) return;
      if(STATE==="loading"){ root.innerHTML='<div class="skg"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>'; return; }
      if(STATE==="error"){ root.innerHTML='<div class="state">'+LL(TXT.loadErr)+'<br><button class="retry" id="rt">'+LL(TXT.retry)+'</button></div>'; var b=$("rt"); if(b)b.onclick=load; return; }
      if(!COACHES||!COACHES.length){ root.innerHTML='<div class="state">'+LL(TXT.empty)+'</div>'; return; }
      root.innerHTML='<div class="grid">'+COACHES.map(card).join("")+'</div>'
        +'<div class="foot"><p>'+LL(TXT.footNote)+'</p><a href="/classes">'+LL(TXT.footCta)+' →</a></div>';
    }
    async function load(){
      STATE="loading"; render();
      try{
        var r=await apiFetch("/api/coaches");
        var j=await r.json().catch(function(){return null;});
        if(!r.ok||!j||!j.ok){ STATE="error"; render(); return; }
        COACHES=j.coaches||[]; STATE="ready"; render();
      }catch(e){ STATE="error"; render(); }
    }
    (async function(){
      try{ if(window.Auth&&Auth.requireAuth) await Auth.requireAuth(); }catch(e){}
      applyStatic();
      if(window.I18N&&I18N.onChange) I18N.onChange(function(){ applyStatic(); render(); });
      load();
    })();
  })();
  </script>
</body>
</html>
