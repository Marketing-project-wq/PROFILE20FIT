<!DOCTYPE html>
<html lang="en">
<head>
<base href="/">
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rekap Mingguan · 20FIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --a-bg:var(--bg,#F1F1F4); --a-surface:var(--card,#FFFFFF); --a-line:var(--glass-hair,var(--line,#EBEBEF));
    --a-txt:var(--txt,#15171C); --a-mut:var(--muted,#8A8D94); --accent:var(--blue,#2F6BFF);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--a-txt);padding:20px 16px 60px;-webkit-font-smoothing:antialiased;
    background:radial-gradient(70% 30% at 100% 0%,color-mix(in srgb,var(--fit-red,#E4002B) 8%,transparent),transparent 70%),radial-gradient(70% 30% at 0% 100%,color-mix(in srgb,var(--accent) 6%,transparent),transparent 70%),var(--a-bg)}
  .wrap{max-width:680px;margin:0 auto}
  .ahead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .ahead .bk{width:38px;height:38px;border-radius:99px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none;font-size:18px}
  .ahead h1{font-size:20px;font-weight:800;margin:2px 0 0;letter-spacing:-.3px}
  .ahead .date{font-size:12px;color:var(--a-mut)}
  .astack{display:flex;flex-direction:column;gap:12px}
  .skel{background:color-mix(in srgb,var(--a-txt) 7%,transparent);border-radius:12px;animation:pul 1.3s ease-in-out infinite}
  @keyframes pul{0%,100%{opacity:1}50%{opacity:.45}}
  .v3{display:flex;flex-direction:column;gap:12px;
     background:linear-gradient(160deg,color-mix(in srgb,var(--a-surface) 90%,transparent),color-mix(in srgb,var(--a-surface) 62%,transparent));
     -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
     border:1px solid var(--a-line);border-radius:22px;padding:16px;box-shadow:0 10px 28px color-mix(in srgb,var(--a-txt) 7%,transparent)}
  .v3-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fit-red,#E4002B);font-weight:800}
  .v3-h{font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.3}
  .v3-s{font-size:13px;color:var(--a-mut);line-height:1.5}
  .v3-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:999px;border:0;cursor:pointer;
     font-family:inherit;font-weight:800;font-size:14px;color:#fff;text-decoration:none;
     background:var(--fit-red,#E4002B);box-shadow:0 6px 16px color-mix(in srgb,var(--fit-red,#E4002B) 30%,transparent)}
  .v3-btn.sec{background:color-mix(in srgb,var(--a-surface) 70%,transparent);color:var(--a-txt);border:1px solid var(--a-line);box-shadow:none}
  .rc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .rc-stat .n{font-size:24px;font-weight:900;line-height:1}
  .rc-stat .l{font-size:11px;color:var(--a-mut);margin-top:3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--a-txt) 6%,transparent);color:var(--a-txt)}
  .bodymap svg{width:100%;height:auto;display:block;max-width:300px;margin:0 auto}
  .err{color:var(--red,#E4002B);font-size:12.5px}
</style>
<link rel="stylesheet" href="css/20fit-design-system.css">
<link rel="stylesheet" href="css/glass-app.css">
<script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
</head>
<body>
<div class="wrap">
  <div class="ahead">
    <a class="bk" href="/activity" aria-label="Kembali" title="Kembali">‹</a>
    <div><div class="date" id="hdRange">—</div><h1 data-en="Weekly recap" data-id="Rekap minggu ini">Rekap minggu ini</h1></div>
  </div>
  <div id="errBox"></div>
  <div class="astack">
    <div class="v3" id="recapCard"><div class="skel" style="height:220px"></div></div>
    <div class="v3" id="focusCard"><div class="skel" style="height:90px"></div></div>
    <a class="v3-btn sec" id="storyBtn" href="/activity/story"></a>
  </div>
</div>

<script src="js/fiticons.js"></script>
<script src="js/vendor-supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/bodymap.js?v=20261008b"></script>
<script src="js/sport-muscles.js?v=20261008a"></script>
<script>
  // ---- Rekap Mingguan (Activity v3 · 1h) — ringkasan sepekan dari /api/activity/history (jujur: hanya
  // angka nyata; tanpa target/level yang tidak kita simpan). BodyMap pakai fondasi sport-muscles. ----
  function Lx(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function el(id){ return document.getElementById(id); }
  function ymdOf(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function weekStart(){ var d=new Date(); var g=(d.getDay()+6)%7; d.setDate(d.getDate()-g); d.setHours(0,0,0,0); return d; } // Senin
  async function apiFetch(path){ var o={headers:{}}; try{ var tk=await Auth.token(); if(tk) o.headers.Authorization="Bearer "+tk; }catch(e){} return fetch(path,o); }
  var TYPE_LBL={ run:{en:"Run",id:"Lari"}, walk:{en:"Walk",id:"Jalan"}, cycling:{en:"Cycling",id:"Sepeda"}, swimming:{en:"Swim",id:"Renang"},
    gym:{en:"Gym",id:"Gym"}, hyrox:{en:"HYROX",id:"HYROX"}, hiit:{en:"HIIT",id:"HIIT"}, padel:{en:"Padel",id:"Padel"}, tennis:{en:"Tennis",id:"Tennis"}, other:{en:"Other",id:"Lainnya"} };

  function fmtRange(ws){
    var we=new Date(ws.getTime()+6*86400000);
    var opt={day:"numeric",month:"short"}, loc=(window.I18N&&I18N.lang==="en")?"en-GB":"id-ID";
    try{ return ws.toLocaleDateString(loc,opt)+" – "+we.toLocaleDateString(loc,opt); }catch(e){ return ""; }
  }
  function renderRange(){ var h=el("hdRange"); if(h) h.textContent=fmtRange(weekStart()); }

  async function load(){
    renderRange();
    var sessions=0, minutes=0, days={}, byType={}, weekItems=[];
    try{
      var r=await apiFetch("/api/activity/history?limit=80&lang="+encodeURIComponent((window.I18N&&I18N.lang)||"id"));
      var j=await r.json().catch(function(){return {};});
      if(r.status===401){ location.href="/login"; return; }
      var ws=ymdOf(weekStart());
      ((j&&j.items)||[]).forEach(function(it){
        if(it.kind!=="workout"||!it.date||it.date<ws) return;
        sessions++; if(it.duration_min) minutes+=(+it.duration_min||0);
        days[it.date]=1; byType[it.type||"other"]=(byType[it.type||"other"]||0)+1;
        weekItems.push({type:it.type,muscle_keys:it.muscle_keys});
      });
    }catch(e){ el("errBox").innerHTML='<div class="v3"><div class="err">'+esc(Lx({en:"Couldn't load your week.",id:"Gagal memuat rekap."}))+'</div></div>'; }
    var mus=(window.SportMuscles)?SportMuscles.week(weekItems):{active:[],secondary:[]};
    renderRecap(sessions,minutes,Object.keys(days).length,byType,mus);
    renderFocus(sessions,Object.keys(days).length);
    wireStory();
  }

  function renderRecap(sessions,minutes,activeDays,byType,mus){
    var host=el("recapCard"); if(!host) return;
    var dark=!document.documentElement.classList.contains("theme-light");
    var en=(window.I18N&&I18N.lang==="en");
    var bm=(window.BodyMap&&sessions)?BodyMap.svg(mus.active,{secondary:mus.secondary,w:300,h:375,labels:true,lang:en?"en":"id",
      sil:(dark?"#2b313d":"#e4e5ea"),on:"#E4002B",mid:(dark?"#7a2030":"#f0b3bc"),off:(dark?"#394150":"#d7dae0"),label:(dark?"#9aa3b2":"#9a9ca6")}):"";
    if(!sessions){
      host.innerHTML='<span class="v3-k">'+esc(Lx({en:"This week",id:"Minggu ini"}))+'</span>'+
        '<div class="v3-h">'+esc(Lx({en:"No sessions logged this week",id:"Belum ada sesi minggu ini"}))+'</div>'+
        '<div class="v3-s">'+esc(Lx({en:"Upload a workout and your weekly recap fills in here.",id:"Upload latihan, rekap mingguanmu muncul di sini."}))+'</div>'+
        '<a class="v3-btn" href="/activity">'+esc(Lx({en:"Go to Activity",id:"Ke Activity"}))+'</a>';
      return;
    }
    var tags=Object.keys(byType).sort(function(a,b){return byType[b]-byType[a];}).map(function(t){
      return '<span class="tag">'+esc(Lx(TYPE_LBL[t]||{en:t,id:t}))+' '+byType[t]+'×</span>';
    }).join("");
    var focus=(window.BodyMap&&mus.active.length)?BodyMap.focus(mus.active,en?"en":"id"):"";
    host.innerHTML='<span class="v3-k">'+esc(Lx({en:"This week",id:"Minggu ini"}))+'</span>'+
      '<div class="rc-stats">'+
        '<div class="rc-stat"><div class="n">'+sessions+'</div><div class="l">'+esc(Lx({en:"sessions",id:"sesi"}))+'</div></div>'+
        '<div class="rc-stat"><div class="n">'+minutes+'</div><div class="l">'+esc(Lx({en:"minutes",id:"menit"}))+'</div></div>'+
        '<div class="rc-stat"><div class="n">'+activeDays+'</div><div class="l">'+esc(Lx({en:"active days",id:"hari aktif"}))+'</div></div>'+
      '</div>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      (bm?'<div class="bodymap">'+bm+'</div>':'')+
      (focus?'<div class="v3-s" style="text-align:center"><b style="color:var(--a-txt)">'+esc(Lx({en:"Focus: ",id:"Fokus: "})+focus)+'</b></div>':'');
  }

  // Fokus minggu depan — panduan UMUM dari ritme (bukan resep medis). Jujur: tanpa angka karangan.
  function renderFocus(sessions,activeDays){
    var host=el("focusCard"); if(!host) return;
    var msg;
    if(sessions===0) msg={en:"Start with one session this week — small is fine.",id:"Mulai satu sesi minggu ini — kecil tak apa."};
    else if(activeDays>=6) msg={en:"You trained almost every day. Keep 1–2 easy/rest days so your body recovers.",id:"Kamu latihan hampir tiap hari. Sisakan 1–2 hari ringan/jeda biar tubuh pulih."};
    else if(sessions>=3) msg={en:"Nice, steady week. Keep the rhythm and add variety where you can.",id:"Minggu yang konsisten. Pertahankan ritme & tambah variasi kalau bisa."};
    else msg={en:"Good start. Aim for one more session next week.",id:"Awal yang baik. Coba tambah satu sesi minggu depan."};
    host.innerHTML='<span class="v3-k">'+esc(Lx({en:"Focus for next week",id:"Fokus minggu depan"}))+'</span>'+
      '<div class="v3-h" style="font-size:16px">'+esc(Lx(msg))+'</div>'+
      '<div class="v3-s">'+esc(Lx({en:"A general guide from your rhythm — not medical advice.",id:"Panduan umum dari ritmemu — bukan nasihat medis."}))+'</div>'+
      '<a class="v3-btn" href="/activity/chat">'+(window.FIC?FIC("chat",16):"")+' '+esc(Lx({en:"Discuss with the Coach",id:"Bahas dengan Coach"}))+'</a>';
  }
  function wireStory(){
    var b=el("storyBtn"); if(!b) return;
    b.innerHTML=(window.FIC?FIC("upload",16):"")+' '+esc(Lx({en:"Share as a story",id:"Bagikan sebagai story"}));
  }

  (async function(){ try{ await Auth.requireAuth(); }catch(e){ location.href="/login"; return; } load(); })();
  if(window.I18N&&I18N.onChange) I18N.onChange(function(){ load(); });
</script>
</body>
</html>
