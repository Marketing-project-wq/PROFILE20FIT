<!DOCTYPE html>
<html lang="id">
<head>
<base href="/">
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consultation · 20FIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Token halaman AI Coach — menumpang token repo (css/*.css) supaya ikut dark/light app,
     nilai setelah koma = cadangan kalau stylesheet gagal dimuat. Pola sama activity.html. */
  :root{
    --a-bg:var(--bg,#F1F1F4); --a-surface:var(--card,#FFFFFF);
    --a-line:var(--glass-hair,var(--line,#EBEBEF)); --a-txt:var(--txt,#15171C); --a-mut:var(--muted,#8A8D94);
    --accent:var(--blue,#2F6BFF); --purple:#A855F7;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--a-bg);color:var(--a-txt);font-family:var(--sans);padding:20px 16px 100px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--a-mut)}
  .card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--radius,16px);padding:16px}
  .card+.card{margin-top:12px}
  .sechd{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--a-mut);font-weight:800;margin:20px 2px 8px}
  .err{color:var(--red);font-size:12.5px}
  .skel{background:color-mix(in srgb,var(--a-txt) 7%,transparent);border-radius:8px;animation:pul 1.3s ease-in-out infinite}
  @keyframes pul{0%,100%{opacity:1}50%{opacity:.45}}

  /* header */
  .chead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .chead .bk{width:38px;height:38px;border-radius:99px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);
    display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none;font-size:18px}
  .chead h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px}
  .chead .sub{font-size:13px;color:var(--a-mut);margin-top:2px}

  /* buttons */
  .btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;border:1px solid var(--a-line);color:var(--a-txt)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn+.btn{margin-top:8px}


  /* pilihan (sesi: hari & tidur) */
  .qsec{margin-top:14px}
  .qlabel{font-size:14px;font-weight:700;margin-bottom:3px}
  .qhint{font-size:12px;color:var(--a-mut);margin-bottom:9px}
  .qopts{display:flex;flex-wrap:wrap;gap:8px}
  .qopt{border:1px solid var(--a-line);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;
    background:linear-gradient(155deg,var(--glass,transparent),var(--glass-2,transparent));color:var(--a-txt);font-family:inherit}
  .qopt.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* plan */
  .planhead .pn{font-size:18px;font-weight:800;letter-spacing:-.2px}
  .planhead .wn{font-size:13px;color:var(--a-mut);margin-top:3px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;margin-top:8px}
  .badge.src{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .needspec{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.55;
    background:color-mix(in srgb,var(--amber) 14%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);color:var(--a-txt)}
  .day{border:1px solid var(--a-line);border-radius:14px;margin-top:10px;overflow:hidden}
  .day-h{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;background:color-mix(in srgb,var(--a-txt) 3%,transparent)}
  .day-h .dl{font-weight:800;font-size:14px}
  .day-h .df{font-size:11.5px;color:var(--a-mut);margin-left:auto;text-transform:capitalize}
  .day-b{padding:4px 14px 12px}
  .ex{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--a-line)}
  .ex:first-child{border-top:0}
  .ex .en{font-size:14px;font-weight:600;flex:1;min-width:0}
  .ex .em{font-family:var(--mono);font-size:12.5px;color:var(--a-mut);max-width:48%;text-align:right;overflow-wrap:anywhere}
  .ex .sw{background:none;border:0;color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;padding:2px 4px;flex:none}
  .ex .prog{font-size:11.5px;color:var(--a-mut);margin-top:2px}
  .ex .logd{font-size:11.5px;color:var(--green);font-weight:700;margin-top:3px;display:flex;align-items:center;gap:4px}
  .logrep{margin-top:10px}
  .wkprog{font-size:12.5px;color:var(--a-mut);margin:12px 2px 2px}
  .wkprog b{color:var(--a-txt)}
  .adjrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none}
  .dchk{border:0;background:transparent;line-height:0;padding:0;cursor:pointer;flex:none;color:var(--accent)}
  .day.done .dl{text-decoration:line-through;opacity:.7}
  .plist{display:flex;flex-direction:column;gap:8px}
  .pli{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border:1px solid var(--a-line);border-radius:12px;text-decoration:none;color:var(--a-txt)}
  .pli.on{border-color:color-mix(in srgb,var(--accent) 50%,var(--a-line))}
  .pli .pln{font-weight:800;font-size:13.5px}
  .pli .pls{font-size:11.5px;color:var(--a-mut)}
  .adjrow .btn{width:auto;flex:1;min-width:130px;padding:11px;margin-top:0}

  /* cta — JANGAN pakai class "cta" utk kontainer: glass-app.css memakai .cta sbg tombol
     PRIMER merah (!important), warnanya bakal nembus sela tombol. Pakai .ctawrap. */
  .ctawrap{display:flex;flex-direction:column;gap:10px}
  .cta-b{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--a-line);cursor:pointer;
    background:var(--a-surface);color:var(--a-txt);font-family:inherit;text-align:left;width:100%}
  .cta-b .ic{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
  .cta-b .ct{display:block;font-size:14.5px;font-weight:700}
  .cta-b .cs{display:block;font-size:12px;color:var(--a-mut);margin-top:2px}
  .cta-b.primary{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--a-surface))}
  .disc{font-size:11.5px;color:var(--a-mut);line-height:1.55;margin-top:14px}

  /* sesi harian (Fase 2) */
  .today{display:flex;align-items:center;gap:12px;margin-bottom:12px;border-color:color-mix(in srgb,var(--accent) 30%,var(--a-line));background:color-mix(in srgb,var(--accent) 6%,var(--a-surface))}
  .today .ic{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .today .tt{font-size:14.5px;font-weight:800}
  .today .ts{font-size:12px;color:var(--a-mut);margin-top:2px}
  .today .go{margin-left:auto;flex:none;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .sleepgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .sleepgrid .qopt{flex:1;min-width:74px;text-align:center}
  .adjbanner{margin-top:12px;padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.5}
  .adjbanner.none{background:color-mix(in srgb,var(--green) 13%,transparent);border:1px solid color-mix(in srgb,var(--green) 34%,transparent)}
  .adjbanner.lighter{background:color-mix(in srgb,var(--amber) 14%,transparent);border:1px solid color-mix(in srgb,var(--amber) 38%,transparent)}
  .adjbanner.rest{background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 34%,transparent)}
  .adjbanner.unknown{background:color-mix(in srgb,var(--a-txt) 5%,transparent);border:1px solid var(--a-line)}
  .pbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--a-txt) 10%,transparent);overflow:hidden;margin:10px 0 2px}
  .pbar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
  .exblk{border:1px solid var(--a-line);border-radius:14px;margin-top:10px;overflow:hidden}
  .exblk .eh{padding:11px 14px;background:color-mix(in srgb,var(--a-txt) 3%,transparent)}
  .exblk .eh .n{font-weight:800;font-size:14px}
  .exblk .eh .s{font-size:11.5px;color:var(--a-mut);margin-top:2px}
  .setrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--a-line)}
  .setrow .sx{font-family:var(--mono);font-size:12px;color:var(--a-mut);width:44px;flex:none}
  .setrow .rin{width:56px;flex:none;padding:7px;border-radius:8px;border:1px solid var(--a-line);background:var(--a-bg);color:var(--a-txt);font-family:inherit;font-size:13px;text-align:center}
  .setrow .un{font-size:11.5px;color:var(--a-mut);flex:1;min-width:0}
  .setrow .ck{width:30px;height:30px;flex:none;border-radius:9px;border:1.5px solid var(--a-line);background:transparent;color:var(--a-mut);font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
  .setrow .ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .setrow.done .un{text-decoration:line-through;opacity:.6}
  .hist{margin-top:6px}
  .hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--a-line);font-size:13px}
  .hrow:first-child{border-top:0}
  .hrow .hd{font-weight:700;min-width:64px}
  .hrow .hf{color:var(--a-mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow .hs{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;flex:none}
  .hrow .hs.done{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
  .hrow .hs.active{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .hrow .hs.skipped{background:color-mix(in srgb,var(--a-txt) 8%,transparent);color:var(--a-mut)}

  /* progress + achievement (Fase 3) */
  .pstat{display:flex;gap:8px}
  .pstat .s{flex:1;text-align:center;border:1px solid var(--a-line);border-radius:12px;padding:10px 6px}
  .pstat .s b{display:block;font-size:20px;font-weight:800;font-family:var(--mono)}
  .pstat .s span{font-size:10.5px;color:var(--a-mut)}
  .exchart{margin-top:14px}
  .exchart .h{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;margin-bottom:6px}
  .exchart .h .v{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--a-mut);font-weight:600}
  .bars2{display:flex;align-items:flex-end;gap:5px;height:56px}
  .bars2 .b{flex:1;background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px 4px 0 0;min-height:3px}
  .bars2 .b.last{background:var(--accent)}
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .badge2{display:flex;align-items:center;gap:10px;border:1px solid var(--a-line);border-radius:12px;padding:11px}
  .badge2 .bic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--a-txt) 6%,transparent);color:var(--a-mut)}
  .badge2.on .bic{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .badge2 .bt{font-size:12.5px;font-weight:700}
  .badge2 .bd{font-size:11px;color:var(--a-mut);margin-top:1px}
  .badge2.off{opacity:.55}
  @media(max-width:400px){ .badges{grid-template-columns:1fr} }

  /* ---- AI Coach chatbot (persona) — premium, token 20FIT (aksen merah brand) ---- */
  :root{ --ai:var(--fit-red,#E4002B); --ai2:var(--fit-blue,#0068C9); }

  /* Hero picker + orb AI */
  .cq-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 12px 4px}
  .cq-orb{position:relative;width:96px;height:96px;border-radius:99px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;flex:none;
    background:conic-gradient(from 210deg,var(--ai),var(--ai2),var(--ai));
    box-shadow:0 0 0 1px color-mix(in srgb,var(--ai) 30%,transparent),0 14px 46px color-mix(in srgb,var(--ai) 32%,transparent);
    animation:orbpulse 3.8s ease-in-out infinite}
  .cq-orb::after{content:"";position:absolute;inset:5px;border-radius:99px;background:var(--a-surface)}
  .cq-orb svg{position:relative;z-index:1;color:var(--ai)}
  @keyframes orbpulse{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--ai) 28%,transparent),0 14px 44px color-mix(in srgb,var(--ai) 26%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--ai) 46%,transparent),0 18px 60px color-mix(in srgb,var(--ai) 44%,transparent)}}
  .cq-h{font-family:var(--fit-font-display,inherit);font-weight:800;font-size:27px;letter-spacing:.6px;text-transform:uppercase;margin:0;line-height:1}
  .cq-s{font-size:13px;color:var(--a-mut);margin:8px 0 0;line-height:1.55;max-width:330px}

  @media(max-width:560px){ .cq-orb{width:60px;height:60px;margin-bottom:8px} .cq-orb svg{width:24px;height:24px} .cq-h{font-size:21px} }

  /* Avatar + cincin glow (warna per-persona via --cc) */
  .cav{position:relative;display:block;border-radius:99px;flex:none;line-height:1}
  .cav.ring{padding:3px;background:conic-gradient(from 140deg,var(--cc,var(--ai)),color-mix(in srgb,var(--cc,var(--ai)) 25%,transparent),var(--cc,var(--ai)));
    box-shadow:0 0 16px color-mix(in srgb,var(--cc,var(--ai)) 45%,transparent)}
  .cav .cav-in{position:relative;display:block;width:100%;height:100%;border-radius:99px;overflow:hidden;background:var(--a-surface)}
  .cav img{width:100%;height:100%;object-fit:cover;display:block}
  .cav-i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}

  /* Chat room */
  .croom{display:flex;flex-direction:column;height:calc(100dvh - 188px);min-height:440px;border:1px solid var(--a-line);border-radius:22px;background:var(--a-surface);overflow:hidden;box-shadow:var(--fit-shadow,0 8px 30px rgba(0,0,0,.08))}
  .cmsgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}

  /* ---- Stage ala game Episodes: potret coach sebagai "karakter" di atas chat ---- */
  .cstage{position:relative;display:flex;align-items:flex-end;gap:13px;padding:16px 15px 14px;overflow:hidden;border-bottom:1px solid var(--a-line);
    background:
      radial-gradient(120% 90% at 86% -12%,color-mix(in srgb,var(--cc,var(--ai)) 42%,transparent),transparent 60%),
      linear-gradient(135deg,color-mix(in srgb,var(--cc,var(--ai)) 22%,var(--a-surface)),var(--a-surface) 72%)}
  .cstage-portrait{position:relative;width:80px;height:98px;border-radius:16px;overflow:hidden;flex:none;border:2px solid #fff;
    background:linear-gradient(160deg,color-mix(in srgb,var(--cc,var(--ai)) 60%,#000 0%),color-mix(in srgb,var(--cc,var(--ai)) 28%,transparent));
    box-shadow:0 10px 28px color-mix(in srgb,var(--cc,var(--ai)) 40%,transparent)}
  :root[data-theme="dark"] .cstage-portrait{border-color:color-mix(in srgb,#fff 20%,transparent)}
  .cstage-portrait img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .cstage-portrait .cstage-ini{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:34px}
  .cstage-info{flex:1;min-width:0;padding-bottom:3px}
  .cstage-name{display:inline-block;max-width:100%;background:var(--cc,var(--ai));color:#fff;font-weight:800;font-size:15px;letter-spacing:.3px;
    text-transform:uppercase;padding:4px 11px;border-radius:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    box-shadow:0 4px 12px color-mix(in srgb,var(--cc,var(--ai)) 42%,transparent)}
  .cstage-spec{display:flex;align-items:center;gap:5px;margin-top:7px;font-size:12px;font-weight:700;color:var(--a-txt)}
  .cstage-spec svg{color:var(--cc,var(--ai));flex:none}
  .cstage-game{font-size:11px;color:var(--a-mut);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .cstage-switch{position:absolute;top:11px;right:11px;border:1px solid var(--a-line);color:var(--a-txt);font-size:11.5px;font-weight:700;
    border-radius:99px;padding:6px 12px;cursor:pointer;font-family:inherit;background:color-mix(in srgb,var(--a-surface) 82%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  /* Baris pesan + avatar coach (dua "karakter" ngobrol) — avatar nempel di awal pesan */
  .crow{display:flex;align-items:flex-start;gap:8px;max-width:90%}
  .crow.ai{align-self:flex-start}
  .crow.ai .cav{position:sticky;top:0}
  .crow.me{align-self:flex-end;flex-direction:row-reverse;max-width:84%}
  .crow .cav{flex:none}
  .crow .cmsg{max-width:100%}

  /* Empty state: sapaan + chip data asli + kartu prompt */
  .cintro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;margin:auto 0;padding:6px 2px}
  .cintro-h{font-size:18px;font-weight:800;margin-top:2px}
  .cintro-spec{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ai);
    background:color-mix(in srgb,var(--ai) 10%,transparent);border:1px solid color-mix(in srgb,var(--ai) 26%,transparent);border-radius:99px;padding:5px 11px}
  .cintro-s{font-size:12.5px;color:var(--a-mut);line-height:1.55;max-width:300px}
  .cchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
  .cact{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:800;text-decoration:none;
    color:var(--ai);background:color-mix(in srgb,var(--ai) 10%,transparent);border:1px solid color-mix(in srgb,var(--ai) 30%,transparent)}
  /* Workout plan dari chat = tabel */
  .cwp{display:flex;flex-direction:column;gap:8px;margin:6px 0;padding:11px 12px;border-radius:12px;background:var(--a-surface);border:1px solid color-mix(in srgb,var(--ai) 30%,var(--a-line))}
  .cwp-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
  .cwp-h b{display:flex;align-items:center;gap:6px}
  .cwp-ok{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;color:var(--fit-green,#16A34A)}
  .cwp-no{font-size:11.5px;font-weight:800;color:var(--fit-amber,#D97706)}
  .cwp-t{overflow-x:auto;margin:0 -2px}
  .cmsg.ai:has(.cwp){max-width:100%}
  .cwp table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:1.35}
  .cwp thead th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--a-mut);font-weight:800;text-align:left;padding:4px 6px;border-bottom:1px solid var(--a-line)}
  .cwp tbody th,.cwp tbody td{padding:7px 6px;border-bottom:1px solid var(--a-line);vertical-align:top;text-align:left}
  .cwp tbody tr:last-child th,.cwp tbody tr:last-child td{border-bottom:0}
  .cwp tbody th{font-weight:800;white-space:nowrap}
  .cwp tbody th small{display:block;font-weight:600;color:var(--a-mut);font-size:11px;white-space:normal;max-width:110px}
  .cwp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .cwp li span{color:var(--a-mut);font-family:var(--mono,monospace);font-size:11.5px;white-space:nowrap}
  .cwp-m{white-space:nowrap;font-family:var(--mono,monospace);color:var(--a-mut)}
  .cwp-x{font-size:12px;color:var(--a-mut)}
  .cwp-a{display:flex;flex-wrap:wrap;gap:8px 14px}

  /* Kartu meal plan dari coach (+ tombol "Terapkan meal plan") */
  .cmeal{display:flex;flex-direction:column;gap:7px;margin:6px 0;padding:11px 12px;border-radius:12px;background:var(--a-surface);border:1px solid color-mix(in srgb,var(--fit-green,#16A34A) 35%,var(--a-line))}

  .cmeal-k{font-size:12px;font-weight:800;color:var(--fit-green,#16A34A)}

  .cmeal-s{grid-row:span 2;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--a-mut);padding-top:2px}
  .cmeal-n{font-size:11.5px;color:var(--a-mut)}
  .cmeal-x{font-size:12px;color:var(--a-mut)}
  .cmeal-a{display:flex;flex-wrap:wrap;align-items:center}
  .cmeal-go{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;padding:8px 13px;border:0;border-radius:99px;font-size:12.5px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;background:var(--fit-green,#16A34A)}
  .cmeal-go:disabled{opacity:.6;cursor:default}
  .cchip-data{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ai);background:color-mix(in srgb,var(--ai) 12%,transparent);border:1px solid color-mix(in srgb,var(--ai) 26%,transparent);border-radius:99px;padding:5px 11px}
  .qcards{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;margin-top:8px}
  .qcard{display:flex;flex-direction:column;gap:9px;text-align:left;padding:13px;border:1px solid var(--a-line);border-radius:16px;background:var(--a-bg);cursor:pointer;font-family:inherit;color:var(--a-txt);transition:border-color .15s,transform .15s}
  .qcard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--ai) 45%,var(--a-line))}
  .qcard .qi{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ai) 13%,transparent);color:var(--ai);flex:none}
  .qcard .ql{font-size:12.5px;font-weight:700;line-height:1.3}

  /* Bubble */
  .cmsg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:anywhere}
  .cmsg.ai{align-self:flex-start;background:color-mix(in srgb,var(--a-txt) 6%,transparent);border-bottom-left-radius:5px}
  .cmsg.me{align-self:flex-end;color:#fff;border-bottom-right-radius:5px;background:linear-gradient(135deg,var(--ai),color-mix(in srgb,var(--ai) 68%,var(--ai2)))}
  .cmsg.err{align-self:flex-start;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:13px;color:var(--a-txt);
    background:color-mix(in srgb,var(--fit-amber,#D97706) 12%,transparent);border:1px solid color-mix(in srgb,var(--fit-amber,#D97706) 35%,transparent)}
  .cmsg.err svg{color:var(--fit-amber,#D97706);flex:none}
  .cretry{margin-left:auto;padding:5px 11px;border-radius:99px;border:0;background:var(--ai);color:#fff;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
  .cmsg.typing{display:flex;gap:4px;align-items:center}
  .cmsg.typing span{width:6px;height:6px;border-radius:99px;background:var(--a-mut);display:inline-block;animation:ctyp 1s infinite}
  .cmsg.typing span:nth-child(2){animation-delay:.15s} .cmsg.typing span:nth-child(3){animation-delay:.3s}
  @keyframes ctyp{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* Chip cepat (saat sudah ada percakapan) */
  .cquick{display:flex;gap:7px;overflow-x:auto;padding:9px 12px;border-top:1px solid var(--a-line)}
  .cquick::-webkit-scrollbar{height:0}
  .cqbtn{flex:none;border:1px solid var(--a-line);background:var(--a-bg);color:var(--a-txt);font-size:12px;font-weight:700;border-radius:99px;padding:7px 13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .cqbtn:hover{border-color:color-mix(in srgb,var(--ai) 45%,var(--a-line))}

  /* Composer */
  .cinput{display:flex;gap:9px;padding:11px 12px;border-top:1px solid var(--a-line);align-items:flex-end;background:var(--a-surface)}

  .cinput textarea{flex:1;resize:none;max-height:120px;padding:11px 14px;border-radius:14px;border:1px solid var(--a-line);background:var(--a-bg);color:var(--a-txt);font-family:inherit;font-size:14px;line-height:1.4}
  .cinput .csend{width:44px;height:44px;flex:none;border:0;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,var(--ai),color-mix(in srgb,var(--ai) 65%,var(--ai2)));box-shadow:0 6px 18px color-mix(in srgb,var(--ai) 40%,transparent)}
  .cinput .csend:active{transform:scale(.95)}
