<!DOCTYPE html>
<html lang="id">
<head>
<base href="/">
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signing in… · 20FIT</title>
<style>
  :root{--bg:#F1F1F4;--txt:#15171C;--muted:#8A8D94;--red:#E4002B;--card:#fff;--line:#EBEBEF}
  html:not(.theme-light){--bg:#0C0D10;--txt:#F4F5F7;--muted:#8E9198;--card:#17191F;--line:#25272E}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .box{text-align:center;padding:24px}
  .spin{width:38px;height:38px;margin:0 auto 16px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .t{font-size:15px;font-weight:700}
  .s{font-size:12.5px;color:var(--muted);margin-top:5px}
</style>
<script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
</head>
<body>
  <div class="box">
    <div class="spin" aria-hidden="true"></div>
    <div class="t" id="t">Signing you in…</div>
    <div class="s" id="s">Menghubungkan akun Google kamu…</div>
  </div>

  <!-- Halaman callback OAuth (mengikuti LOGIN_GOOGLE_my20fit_untuk_web.md).
       Supabase (flowType pkce + detectSessionInUrl:true di js/auth.js) menukar ?code= di URL
       jadi sesi otomatis. Di sini kita tunggu sesinya siap lalu routeAfterAuth (ke dashboard/
       onboarding). Kalau gagal (mis. redirect URL belum di-allowlist di Supabase, atau error
       dari Google), kembali ke /login sambil membawa pesan errornya. -->
  <script src="js/vendor-supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
  (function(){
    var done=false;
    function go(url){ if(done) return; done=true; location.replace(url); }
    function errFromUrl(){
      try{
        var qs=new URLSearchParams(location.search);
        var hs=new URLSearchParams(String(location.hash||"").replace(/^#/,""));
        return qs.get("error_description")||qs.get("error")||hs.get("error_description")||hs.get("error")||"";
      }catch(e){ return ""; }
    }
    async function finish(){
      // Kalau URL sudah membawa error dari provider (mis. redirect_uri / access_denied), langsung balik.
      var e0=errFromUrl();
      if(e0){ go("/login?authError="+encodeURIComponent(e0)); return; }
      try{
        var r=await Auth.supabase.auth.getSession();
        if(r&&r.data&&r.data.session){
          try{ await Auth.routeAfterAuth(); return; }catch(e){}
          go("/dashboard"); return;
        }
      }catch(e){}
      // Belum ada sesi & tak ada error jelas -> kembali ke login (jangan menggantung).
      go("/login?err=oauth");
    }
    (async function(){
      try{ await Auth.ready; }catch(e){}
      // detectSessionInUrl menyeat sesi begitu client siap; tangkap juga event-nya.
      try{ Auth.supabase.auth.onAuthStateChange(function(evt,sess){
        if(evt==="SIGNED_IN" && sess && sess.user){ try{ Auth.routeAfterAuth(); done=true; }catch(e){ go("/dashboard"); } }
      }); }catch(e){}
      // Beri waktu penukaran ?code= -> sesi, lalu putuskan.
      setTimeout(finish, 700);
    })();
  })();
  </script>
</body>
</html>
