<!DOCTYPE html>
<html lang="id">
<head>
<base href="/">
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Body Scan · 20FIT</title>
<script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
<link rel="stylesheet" href="css/20fit-design-system.css">
<link rel="stylesheet" href="css/glass-app.css">
<style>
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 90px}
  .hero{margin:8px 0 18px}
  .hero .kick{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--red,#E4002B)}
  .hero h1{margin:4px 0 6px;font-size:26px;letter-spacing:-.02em}
  .sec{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--red,#E4002B);margin:22px 2px 9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  .muted{color:var(--muted)}
  /* angka utama */
  .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px}
  .kv{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
  .kv .k{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .kv .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:5px}
  .kv .v s{text-decoration:none;font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
  .kv .d{font-size:11.5px;font-weight:700;margin-top:3px}
  .kv .d.up{color:#C87000}.kv .d.dn{color:#1d6b41}
  /* Status dari Visbody: Normal / Over / Under. Warna ikut ARTI, dan tidak pernah
     jadi satu-satunya penanda — teksnya selalu ditulis. */
  .st{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
      padding:2px 7px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .st.ok{color:#1d6b41;background:rgba(29,107,65,.10);border-color:rgba(29,107,65,.25)}
  .st.hi,.st.lo{color:#C87000;background:rgba(200,112,0,.10);border-color:rgba(200,112,0,.25)}
  .kv .st{margin-top:6px}
  .ref{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:4px;white-space:nowrap}
  .row .rt{display:flex;align-items:center;gap:7px}
  /* detail */
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media(max-width:560px){ .rows{grid-template-columns:1fr} }
  .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .row b{font-weight:700;white-space:nowrap}
  /* tren */
  .trend svg{display:block;width:100%;height:70px}
  .trend .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;margin-top:5px}
  /* riwayat */
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;background:none;border:0;
    padding:11px 0;color:var(--txt);font:inherit;text-align:left;cursor:pointer}
  .hrow+.hrow{border-top:1px solid var(--line)}
  .hrow .d{font-weight:700;font-size:13.5px}
  .hrow .n{font-size:12.5px;white-space:nowrap;color:var(--muted);font-weight:700}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border:0;border-radius:999px;padding:11px 18px;
    font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 6px 16px color-mix(in srgb,var(--red,#E4002B) 28%,transparent)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line);box-shadow:none}
  .pdf{margin-top:13px}
  /* penjelasan awam per parameter */
  .expl details{border-bottom:1px solid var(--line);padding:10px 0}
  .expl details:last-child{border-bottom:0}
  .expl summary{cursor:pointer;font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:10px}
  .expl p{margin:7px 0 0;font-size:13px;line-height:1.55;color:var(--muted)}
  /* belum pernah scan (ajakan) */
  .acq h2{font-size:18px;margin:0 0 6px}
  .acq ul{margin:8px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6}
  .sample{position:relative;opacity:.92}
  .sample .tag{position:absolute;top:-9px;right:12px;background:var(--amber,#C87000);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:99px}
  .loc-cta{margin-top:14px;padding:13px;border-radius:14px;border:1px solid color-mix(in srgb,var(--red) 35%,var(--line));background:color-mix(in srgb,var(--red) 6%,var(--card))}
  .loc-t{font-weight:800;font-size:14.5px}
  .loc-a{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .loc-a .btn.ghost{color:var(--txt);border-style:solid}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logobar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT" style="height:26px">
      <a href="dashboard.html" style="text-decoration:none;color:var(--muted);font-weight:700;font-size:13px">← <span data-i18n="nav_home">Home</span></a>
    </div>

    <header class="hero">
      <div class="kick" data-i18n="bs_kick">Body scan</div>
      <h1 data-i18n="bs_title">Body Scan</h1>
      <div class="muted" data-i18n="bs_sub">Hasil timbangan komposisi tubuh di lokasi 20FIT.</div>
    </header>

    <div id="latestBox"></div>
    <div id="explBox"></div>
    <div id="trendBox"></div>
    <div id="histBox"></div>
    <div id="howBox"></div>
  </div>

<script src="js/vendor-supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/body-scan.js"></script>
<script>
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function num(v,d){ return (v===null||v===undefined||v==="")?null:(+v).toFixed(d===undefined?1:d).replace(/\.0$/,""); }

  // Rentang acuan + status per metrik untuk scan terakhir. Kosong sampai detail()
  // selesai — halaman TIDAK menunggunya; angkanya tampil dulu, chip menyusul.
  var REF={};
  function stLabel(st){
    var k=String(st||"").toLowerCase();
    if(k==="normal") return {cls:"ok", t:{en:"Normal",id:"Normal"}};
    if(k==="over"||k==="high") return {cls:"hi", t:{en:"Above normal",id:"Di atas normal"}};
    if(k==="under"||k==="low") return {cls:"lo", t:{en:"Below normal",id:"Di bawah normal"}};
    return null;   // status yang tidak dikenali TIDAK ditebak-tebak
  }
  function stChip(field){
    var r=REF[field]; if(!r) return "";
    var m=stLabel(r.status); if(!m) return "";
    return '<span class="st '+m.cls+'">'+esc(L(m.t))+'</span>';
  }
  function refText(field,d){
    var r=REF[field]; if(!r||r.low==null||r.high==null) return "";
    return '<div class="ref">'+esc(L({en:"Normal",id:"Normal"}))+' '+
      esc(num(r.low,d))+'–'+esc(num(r.high,d))+'</div>';
  }
  // ---------- Data ----------
  var SCANS=null, ERR=false;
  async function loadScans(){
    ERR=false; REF={}; REF_FOR=null;
    try{
      // Querynya ada di js/body-scan.js — satu pembaca dipakai bareng /activity
      // (CLAUDE.md §2). RLS tabelnya select-own-row, jadi user tidak bisa melihat
      // scan orang lain walau mencoba.
      BodyScan.reset();
      var st=await BodyScan.state();
      if(st.unavailable) throw new Error("unavailable");
      SCANS=st.list||[];
    }catch(e){ SCANS=null; ERR=true; }
    render();
  }

  function errCard(){
    return '<div class="card"><div class="muted" style="font-size:13px">'+
      esc(L({en:"Couldn't load your scans.",id:"Gagal memuat hasil scan."}))+
      ' <button type="button" class="btn ghost" style="margin-top:9px" onclick="loadScans()">'+
      esc(L({en:"Retry",id:"Coba lagi"}))+'</button></div></div>';
  }

  function render(){
    var lb=$("latestBox"), tb=$("trendBox"), hb=$("histBox");
    if(ERR){ lb.innerHTML=errCard(); tb.innerHTML=""; hb.innerHTML=""; return; }
    if(!SCANS){ lb.innerHTML='<div class="card muted" style="font-size:13px">'+esc(L({en:"Loading…",id:"Memuat…"}))+'</div>'; return; }
    if(!SCANS.length){
      lb.innerHTML=acquisitionHtml();
      tb.innerHTML=""; hb.innerHTML=""; $("explBox").innerHTML=""; renderHow(false); return;
    }
    renderLatest(SCANS[0], SCANS[1]); renderExpl(SCANS[0]); renderTrend(); renderHist(); renderHow(true);
    loadRefs(SCANS[0]);
    markViewed(SCANS[0]);
  }

  // Rentang acuan menyusul setelah angkanya tampil. Kalau gagal diambil, halaman
  // tetap seperti sebelumnya — chip-nya saja yang tidak muncul.
  var REF_FOR=null;
  function loadRefs(s0){
    if(!s0||!s0.scan_id||!window.BodyScan||!BodyScan.detail) return;
    if(REF_FOR===s0.scan_id) return;
    REF_FOR=s0.scan_id;
    BodyScan.detail(s0.scan_id).then(function(r){
      if(REF_FOR!==s0.scan_id) return;
      if(!r||!Object.keys(r).length) return;
      REF=r; renderLatest(SCANS[0], SCANS[1]);
    }, function(){});
  }
  function delta(now,prev,inv){
    if(now==null||prev==null) return "";
    var d=+(now-prev); if(Math.abs(d)<0.05) return "";
    // inv=true -> turun itu bagus (lemak). Warna mengikuti arti, bukan tanda aritmetika.
    var good = inv ? d<0 : d>0;
    return '<div class="d '+(good?"dn":"up")+'">'+(d>0?"+":"−")+Math.abs(d).toFixed(1)+'</div>';
  }
  function kv(label,val,unit,d,field,rd){
    return '<div class="kv"><div class="k">'+esc(label)+'</div>'+
      '<div class="v">'+(val==null?"—":esc(val))+(val!=null&&unit?'<s>'+esc(unit)+'</s>':'')+'</div>'+(d||"")+
      (field?stChip(field):"")+(field?refText(field,rd):"")+'</div>';
  }
  function renderLatest(s,prev){
    var dt=new Date(s.scanned_at).toLocaleDateString(I18N.lang==="en"?"en-GB":"id-ID",
      {weekday:"long",day:"numeric",month:"long",year:"numeric"});
    var rows=[
      ["fat_free_mass",{en:"Fat-free mass",id:"Massa tanpa lemak"},"kg"],
      ["skeletal_muscle",{en:"Skeletal muscle",id:"Otot rangka"},"kg"],
      ["body_fat_mass",{en:"Fat mass",id:"Massa lemak"},"kg"],
      ["protein",{en:"Protein",id:"Protein"},"kg"],
      ["total_body_water",{en:"Total body water",id:"Total air tubuh"},"L"],
      ["intracellular_water",{en:"Intracellular water",id:"Air intraseluler"},"L"],
      ["extracellular_water",{en:"Extracellular water",id:"Air ekstraseluler"},"L"],
      ["extracellular_water_ratio",{en:"ECW ratio",id:"Rasio air ekstraseluler"},""],
      ["total_minerals",{en:"Minerals",id:"Mineral"},"kg"],
      ["basal_metabolic_rate",{en:"BMR",id:"BMR"},"kcal"],
      ["metabolic_age",{en:"Metabolic age",id:"Usia metabolik"},L({en:"yr",id:"th"})],
      ["visceral_fat_grade",{en:"Visceral fat grade",id:"Grade lemak viseral"},""],
      ["waist_hip_ratio",{en:"Waist-hip ratio",id:"Rasio pinggang-pinggul"},""],
      ["body_composition_score",{en:"Composition score",id:"Skor komposisi"},""]
    ].filter(function(r){ return s[r[0]]!=null; });

    $("latestBox").innerHTML=
      '<div class="sec">'+esc(L({en:"Latest scan",id:"Scan terakhir"}))+' · '+esc(dt)+'</div>'+
      '<div class="big">'+
        kv(L({en:"Weight",id:"Berat"}), num(s.body_weight), "kg", delta(s.body_weight, prev&&prev.body_weight, true), "body_weight", 1)+
        kv(L({en:"Body fat",id:"Lemak tubuh"}), num(s.body_fat_percentage), "%", delta(s.body_fat_percentage, prev&&prev.body_fat_percentage, true), "body_fat_percentage", 1)+
        kv(L({en:"Muscle mass",id:"Massa otot"}), num(s.muscle_mass), "kg", delta(s.muscle_mass, prev&&prev.muscle_mass, false), "muscle_mass", 1)+
        kv("BMI", num(s.body_mass_index), "", delta(s.body_mass_index, prev&&prev.body_mass_index, true), "body_mass_index", 1)+
      '</div>'+
      (rows.length?'<div class="card" style="margin-top:12px"><div class="rows">'+rows.map(function(r){
        var u=r[2]?(" "+r[2]):"";
        var dg=(r[0]==="extracellular_water_ratio"||r[0]==="waist_hip_ratio")?3:1;
        return '<div class="row"><span>'+esc(L(r[1]))+'</span>'+
          '<span class="rt">'+stChip(r[0])+'<b>'+esc(num(s[r[0]], dg))+esc(u)+'</b></span></div>';
      }).join("")+'</div></div>':'')+
      (JS&&JS.latest_scan&&JS.latest_scan.pdf_url&&JS.latest_scan.scan_id===s.scan_id?'<div class="pdf"><a class="btn ghost" href="'+esc(JS.latest_scan.pdf_url)+'">'+esc(L({en:"Download PDF report",id:"Unduh laporan PDF"}))+'</a></div>':'')+
      '<div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.5">'+
        esc(L({en:"Measured by the Visbody scale at a 20FIT location. Guidance only — not a medical diagnosis.",
               id:"Diukur timbangan Visbody di lokasi 20FIT. Panduan saja — bukan diagnosis medis."}))+'</div>';
  }

  // Tren berat & lemak — SVG inline (konvensi repo: tanpa library chart).
  function spark(vals,color){
    var pts=vals.filter(function(v){return v.v!=null;});
    if(pts.length<2) return "";
    var mn=Math.min.apply(null,pts.map(function(p){return p.v;}));
    var mx=Math.max.apply(null,pts.map(function(p){return p.v;}));
    var rng=(mx-mn)||1, W=300, H=70, pad=6;
    var d=pts.map(function(p,i){
      var x=pad+(i/(pts.length-1))*(W-pad*2);
      var y=H-pad-((p.v-mn)/rng)*(H-pad*2);
      return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
    }).join(" ");
    var last=pts[pts.length-1];
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+esc(L({en:"Trend",id:"Tren"}))+'">'+
      '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+(pad+(W-pad*2)).toFixed(1)+'" cy="'+(H-pad-((last.v-mn)/rng)*(H-pad*2)).toFixed(1)+'" r="3.5" fill="'+color+'"/>'+
      '</svg>';
  }
  function trendCard(title,field,color,unit){
    var asc=SCANS.slice().reverse().map(function(s){ return {t:s.scanned_at, v:s[field]}; });
    var sv=spark(asc,color); if(!sv) return "";
    var f=asc.filter(function(p){return p.v!=null;});
    var lo=f[0], hi=f[f.length-1];
    return '<div class="card trend" style="margin-bottom:11px"><div style="font-weight:800;font-size:13.5px;margin-bottom:8px">'+esc(title)+'</div>'+sv+
      '<div class="lbl"><span>'+esc(num(lo.v))+esc(unit)+'</span><span>'+esc(num(hi.v))+esc(unit)+'</span></div></div>';
  }
  function renderTrend(){
    var h=trendCard(L({en:"Weight trend",id:"Tren berat"}),"body_weight","var(--red)"," kg")+
          trendCard(L({en:"Body fat trend",id:"Tren lemak tubuh"}),"body_fat_percentage","#C87000","%")+
          trendCard(L({en:"Muscle mass trend",id:"Tren massa otot"}),"muscle_mass","#1d6b41"," kg");
    $("trendBox").innerHTML = h ? ('<div class="sec">'+esc(L({en:"Trend",id:"Tren"}))+'</div>'+h) : "";
  }

  var HOPEN={};
  function toggleH(id){ HOPEN[id]=!HOPEN[id]; renderHist(); }
  function renderHist(){
    if(SCANS.length<2){ $("histBox").innerHTML=""; return; }
    $("histBox").innerHTML='<div class="sec">'+esc(L({en:"History",id:"Riwayat"}))+'</div><div class="card">'+
      SCANS.map(function(s){
        var dt=new Date(s.scanned_at).toLocaleDateString(I18N.lang==="en"?"en-GB":"id-ID",{day:"numeric",month:"short",year:"numeric"});
        var open=!!HOPEN[s.scan_id];
        return '<button type="button" class="hrow" onclick="toggleH(\''+esc(s.scan_id)+'\')" aria-expanded="'+(open?"true":"false")+'">'+
            '<span class="d">'+esc(dt)+'</span>'+
            '<span class="n">'+esc(num(s.body_weight))+' kg · '+esc(num(s.body_fat_percentage))+'%</span></button>'+
          (open?'<div class="rows" style="padding:4px 0 12px">'+
            [["body_weight",{en:"Weight",id:"Berat"},"kg"],["body_fat_percentage",{en:"Body fat",id:"Lemak tubuh"},"%"],
             ["muscle_mass",{en:"Muscle mass",id:"Massa otot"},"kg"],["body_mass_index",{en:"BMI",id:"BMI"},""],
             ["basal_metabolic_rate",{en:"BMR",id:"BMR"},"kcal"],["visceral_fat_grade",{en:"Visceral fat",id:"Lemak viseral"},""]
            ].filter(function(r){return s[r[0]]!=null;}).map(function(r){
              return '<div class="row"><span>'+esc(L(r[1]))+'</span><b>'+esc(num(s[r[0]]))+(r[2]?" "+esc(r[2]):"")+'</b></div>';
            }).join("")+'</div>':'');
      }).join("")+'</div>';
  }

  // ---------- Status perjalanan (PDF, info alat, tanda "dilihat") dari server ----------
  var JS=null;
  async function authFetch(path,opts){
    opts=opts||{}; opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
    var tk=await Auth.token(); if(tk) opts.headers.Authorization="Bearer "+tk;
    return fetch(path,opts);
  }
  async function loadJourneyState(){
    try{ var r=await authFetch("/api/journey/state"); var j=await r.json().catch(function(){return null;}); JS=(r.ok&&j&&j.ok)?j:null; }catch(e){ JS=null; }
    if(SCANS) render();
  }
  // Hasil lengkap DIBUKA -> tandai dilihat di server (sekali per scan; banner /activity berhenti muncul).
  var VIEWED={};
  function markViewed(s){
    if(!s||VIEWED[s.scan_id]) return; VIEWED[s.scan_id]=1;
    authFetch("/api/visbody/viewed",{method:"POST",body:JSON.stringify({scan_id:s.scan_id})}).catch(function(){});
  }
  // Penjelasan awam per parameter — UMUM, bukan diagnosis. Rentang "normal" TIDAK ditulis di sini;
  // yang tampil hanya rentang/status yang dikirim Visbody sendiri (lihat refText/stChip).
  var EXPL=[
    ["body_weight",{en:"Weight",id:"Berat badan"},{en:"Your total body mass. On its own it doesn't tell muscle from fat — that's what the numbers below are for.",id:"Total massa tubuhmu. Sendirian, angka ini tidak membedakan otot dan lemak — itu gunanya angka-angka di bawah."}],
    ["body_fat_percentage",{en:"Body fat %",id:"Lemak tubuh (%)"},{en:"How much of your weight is fat. Your body needs some fat; the trend over several scans matters more than one number.",id:"Seberapa besar bagian berat badanmu berupa lemak. Tubuh tetap butuh lemak; tren dari beberapa scan lebih berarti daripada satu angka."}],
    ["muscle_mass",{en:"Muscle mass",id:"Massa otot"},{en:"An estimate of the muscle tissue in your body. Strength training and enough protein help build it.",id:"Perkiraan jaringan otot di tubuhmu. Latihan kekuatan dan protein yang cukup membantu menambahnya."}],
    ["skeletal_muscle",{en:"Skeletal muscle",id:"Otot rangka"},{en:"The muscles attached to your bones that you use to move — the part you can train.",id:"Otot yang menempel di tulang dan kamu pakai untuk bergerak — bagian yang bisa dilatih."}],
    ["body_mass_index",{en:"BMI",id:"BMI"},{en:"Weight compared to height. It's a rough screen: it can't tell muscle from fat, so read it together with body fat %.",id:"Perbandingan berat dan tinggi badan. Ini penyaring kasar: tidak bisa membedakan otot dan lemak, jadi baca bersama persentase lemak."}],
    ["basal_metabolic_rate",{en:"BMR",id:"BMR"},{en:"The energy your body burns at complete rest. It's the base for your daily calorie needs; activity adds on top.",id:"Energi yang dibakar tubuhmu saat istirahat total. Ini dasar kebutuhan kalori harian; aktivitas menambah di atasnya."}],
    ["visceral_fat_grade",{en:"Visceral fat grade",id:"Grade lemak viseral"},{en:"A grade for fat stored around the organs in your belly, as measured by Visbody. If it's flagged, talk to a doctor — this page doesn't diagnose.",id:"Grade untuk lemak di sekitar organ dalam perut, menurut pengukuran Visbody. Kalau ditandai, bicarakan dengan dokter — halaman ini tidak mendiagnosis."}],
    ["metabolic_age",{en:"Metabolic age",id:"Usia metabolik"},{en:"Visbody's comparison of your BMR with typical values for different ages. It's an indicator, not your real age.",id:"Perbandingan BMR-mu dengan nilai umum di berbagai usia menurut Visbody. Ini indikator, bukan usia sebenarnya."}],
    ["total_body_water",{en:"Total body water",id:"Total air tubuh"},{en:"How much water your body holds. Hydration and the time of day can shift it between scans.",id:"Jumlah air di tubuhmu. Hidrasi dan waktu scan bisa membuatnya berubah antar-scan."}],
    ["body_composition_score",{en:"Composition score",id:"Skor komposisi"},{en:"Visbody's own overall score for your body composition.",id:"Skor keseluruhan komposisi tubuh versi Visbody."}]
  ];
  function renderExpl(s){
    var rows=EXPL.filter(function(e){ return s[e[0]]!=null; });
    $("explBox").innerHTML=rows.length?'<div class="sec">'+esc(L({en:"What do these numbers mean?",id:"Apa arti angka-angka ini?"}))+'</div><div class="card expl">'+
      rows.map(function(e){ return '<details><summary><span>'+esc(L(e[1]))+'</span>'+stChip(e[0])+'</summary><p>'+esc(L(e[2]))+'</p></details>'; }).join("")+
      '<p class="muted" style="font-size:11.5px;margin:10px 0 0">'+esc(L({en:"General explanations, not a diagnosis. \"Normal\" ranges only appear when Visbody provides them.",id:"Penjelasan umum, bukan diagnosis. Rentang \"normal\" hanya muncul kalau diberikan Visbody."}))+'</p></div>':"";
  }
  // Info alat dari lib/journey-config.js (visbody_info). Yang null TIDAK ditampilkan — tidak dikarang.
  function vi(){ return (JS&&JS.visbody_info)||{}; }
  function scheduleHtml(){
    var v=vi(), href=v.booking_url||(v.whatsapp?"https://api.whatsapp.com/send?phone="+encodeURIComponent(String(v.whatsapp).replace(/[^\d]/g,""))+"&text="+encodeURIComponent(L({en:"Hi 20FIT, I'd like to book a Visbody scan.",id:"Halo 20FIT, saya mau jadwalkan scan Visbody."})):null);
    var loc=locations()[0];
    return href?'<a class="btn" id="schedBtn" href="'+esc(href)+'">'+esc(L({en:"Schedule a scan",id:"Jadwalkan scan"}))+'</a>':
      '<p class="muted" style="font-size:13px;margin:0">'+esc(loc?L({en:"Come to "+loc.name+" and ask the team for a Visbody scan.",id:"Datang ke "+loc.name+" dan minta scan Visbody ke tim di lokasi."}):L({en:"Ask the 20FIT team at the location to schedule your scan.",id:"Tanyakan ke tim 20FIT di lokasi untuk jadwal scan."}))+'</p>';
  }
  // Ajakan scan di unit yang punya alat (config visbody_info.locations) + CTA lokasi & halaman unit.
  function locations(){ var v=vi(); return Array.isArray(v.locations)?v.locations:[]; }
  function locHtml(){
    return locations().map(function(l){
      return '<div class="loc-cta"><div class="loc-t">'+esc(L({en:"Try the Visbody scan at ",id:"Coba scan Visbody di "})+l.name)+'</div>'+
        (l.address?'<div class="muted" style="font-size:12.5px;margin-top:2px">'+esc(l.address)+'</div>':'')+
        '<div class="loc-a">'+(l.maps_url?'<a class="btn" data-vbev="location_maps" href="'+esc(l.maps_url)+'">'+esc(L({en:"Open location (Maps)",id:"Lihat lokasi (Maps)"}))+'</a>':'')+
        (l.info_url?'<a class="btn ghost" data-vbev="location_site" href="'+esc(l.info_url)+'">'+esc(L({en:"Visit ",id:"Kunjungi "})+l.name)+' →</a>':'')+'</div></div>';
    }).join("");
  }
  function infoBlocks(){
    var v=vi(), h="";
    if(v.price_note) h+='<div class="sec">'+esc(L({en:"Cost",id:"Biaya"}))+'</div><div class="card" style="font-size:13.5px">'+esc(L(v.price_note))+'</div>';
    if(Array.isArray(v.prep)&&v.prep.length) h+='<div class="sec">'+esc(L({en:"Before your scan",id:"Sebelum scan"}))+'</div><div class="card"><ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.6">'+v.prep.map(function(p){ return '<li>'+esc(L(p))+'</li>'; }).join("")+'</ul></div>';
    return h;
  }
  function acquisitionHtml(){
    var sample=[["72.4 kg",{en:"Weight",id:"Berat"}],["21.8%",{en:"Body fat",id:"Lemak tubuh"}],["31.2 kg",{en:"Muscle",id:"Massa otot"}],["1,610 kcal",{en:"BMR",id:"BMR"}]];
    return '<div class="card acq"><h2>'+esc(L({en:"You haven't done a Visbody scan yet",id:"Kamu belum pernah scan Visbody"}))+'</h2>'+
      '<p class="muted" style="margin:0;font-size:13.5px;line-height:1.55">'+esc(L({en:"A ±5-minute scan on the Visbody scale at 20FIT measures your body composition.",id:"Scan ±5 menit di timbangan Visbody di 20FIT mengukur komposisi tubuhmu."}))+'</p>'+
      '<ul><li>'+esc(L({en:"Body fat, muscle mass, skeletal muscle, BMR, BMI, visceral fat and more",id:"Lemak tubuh, massa otot, otot rangka, BMR, BMI, lemak viseral, dan lainnya"}))+'</li>'+
      '<li>'+esc(L({en:"Unlocks your Health Score",id:"Membuka Health Score kamu"}))+'</li>'+
      '<li>'+esc(L({en:"Makes your coach's plan and your calorie target more accurate",id:"Membuat plan dari coach & target kalorimu lebih tepat"}))+'</li></ul>'+
      locHtml()+
      '<div style="margin-top:12px">'+scheduleHtml()+'</div>'+
      '<p class="muted" style="font-size:12px;margin:10px 0 0">'+esc(L({en:"After the scan, scan the QR on the scale's screen to save the result to your account.",id:"Setelah scan, pindai QR di layar timbangan untuk menyimpan hasilnya ke akunmu."}))+'</p></div>'+
      '<div class="sec">'+esc(L({en:"What your result looks like",id:"Contoh tampilan hasil"}))+'</div>'+
      '<div class="big sample"><span class="tag">'+esc(L({en:"Example",id:"Contoh"}))+'</span>'+sample.map(function(x){ return '<div class="kv"><div class="k">'+esc(L(x[1]))+'</div><div class="v">'+esc(x[0])+'</div></div>'; }).join("")+'</div>'+
      infoBlocks();
  }
  // User yang sudah punya scan: blok jadwal rescan + info alat di bawah riwayat.
  function renderHow(has){
    var box=$("howBox"); if(!box) return;
    if(!has){ box.innerHTML=""; wireSched(); return; }
    box.innerHTML='<div class="sec">'+esc(L({en:"Next scan",id:"Scan berikutnya"}))+'</div><div class="card">'+
      (JS&&JS.rescan_due?'<p class="muted" style="font-size:13px;margin:0 0 10px">'+esc(L({en:"Suggested rescan: ",id:"Saran rescan: "}))+esc(new Date(JS.rescan_due+"T00:00:00").toLocaleDateString(I18N.lang==="en"?"en-GB":"id-ID",{day:"numeric",month:"long",year:"numeric"}))+'</p>':'')+
      locHtml()+'<div style="margin-top:10px">'+scheduleHtml()+'</div></div>'+infoBlocks();
    wireSched();
  }
  function wireSched(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-vbev]"),function(a){
      a.onclick=function(e){ e.preventDefault(); var href=a.getAttribute("href");
        authFetch("/api/journey/event",{method:"POST",body:JSON.stringify({event:"visbody_booking_clicked",props:{from:a.getAttribute("data-vbev")}})}).catch(function(){}).then(function(){ location.href=href; }); };
    });
    var b=$("schedBtn"); if(!b) return;
    b.onclick=function(e){ e.preventDefault(); var href=b.getAttribute("href");
      authFetch("/api/journey/event",{method:"POST",body:JSON.stringify({event:"visbody_booking_clicked",props:{from:"visbody_page"}})}).catch(function(){}).then(function(){ location.href=href; }); };
  }

  (async function(){
    await Auth.requireAuth();
    loadScans();
    loadJourneyState();
  })();
  if(window.I18N&&I18N.onChange) I18N.onChange(function(){ render(); });
</script>
</body>
</html>
