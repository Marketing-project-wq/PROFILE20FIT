<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"Is my.20fit free to use?","acceptedAnswer":{"@type":"Answer","text":"Yes. Creating your health profile, tracking, and AI check-up analysis are free. Some add-ons (like extra calorie scans) are optional top-ups."}},
    {"@type":"Question","name":"I already have a 20FIT account — can I use it here?","acceptedAnswer":{"@type":"Answer","text":"Absolutely. Sign in with your existing 20FIT email and password, or tap Continue with 20FIT. Your data connects automatically."}},
    {"@type":"Question","name":"What can the AI read from my check-up?","acceptedAnswer":{"@type":"Answer","text":"Upload lab results or an MCU report and the AI highlights what needs attention, explains each parameter, and suggests diet, exercise and follow-ups. It is guidance, not a diagnosis."}},
    {"@type":"Question","name":"How does the calorie food scan work?","acceptedAnswer":{"@type":"Answer","text":"Just snap or upload a photo of your meal. Our AI estimates the calories and full macros (protein, carbs, fat and fiber), gives a health score, and suggests how to make it more balanced. You get free scans every month, with optional top-ups for more."}},
    {"@type":"Question","name":"Is my health data private?","acceptedAnswer":{"@type":"Answer","text":"Yes. Your data is stored securely and only used to power your own profile and recommendations."}},
    {"@type":"Question","name":"Do I need a gym membership to start?","acceptedAnswer":{"@type":"Answer","text":"No. Anyone can start — whether you are new to a healthy lifestyle or a long-time member. 20FIT's services are there when you are ready."}}
  ]
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"Apakah my.20fit gratis?","acceptedAnswer":{"@type":"Answer","text":"Ya. Membuat profil kesehatan 20FIT, upload hasil medical check-up (MCU) & lab, tracking kesehatan harian, dan mendapatkan analisa berbasis AI semuanya gratis. Kamu hanya membayar untuk add-on opsional seperti scan kalori makanan AI tambahan di luar jatah gratis bulanan, tanpa perlu langganan."}},
    {"@type":"Question","name":"Aku sudah punya akun 20FIT — bisa dipakai di sini?","acceptedAnswer":{"@type":"Answer","text":"Bisa. Masuk pakai email dan password 20FIT kamu, atau klik Masuk dengan 20FIT. Membership dan data kesehatanmu otomatis terhubung, jadi profil, booking kelas, dan riwayat latihan tersimpan dalam satu tempat di ekosistem 20FIT."}},
    {"@type":"Question","name":"Apa yang bisa dibaca AI dari medical check-up?","acceptedAnswer":{"@type":"Answer","text":"Upload hasil lab atau laporan medical check-up (MCU) dari rumah sakit atau klinik mana pun (PDF, JPG, atau PNG). AI 20FIT membaca setiap parameter, menandai nilai di luar batas normal, menjelaskannya dengan bahasa sederhana, lalu memberi saran diet, olahraga, dan tindak lanjut. Ini panduan edukasi, bukan diagnosa medis."}},
    {"@type":"Question","name":"Bagaimana cara kerja scan kalori makanan pakai AI?","acceptedAnswer":{"@type":"Answer","text":"Foto makananmu atau upload gambar, dan AI 20FIT memperkirakan total kalori dan makro lengkap (protein, karbohidrat, lemak, serat), memberi health score, serta tips agar lebih seimbang. Cocok untuk masakan Indonesia dan masakan rumahan. Ada jatah scan gratis tiap bulan dengan opsi top-up."}},
    {"@type":"Question","name":"Apakah data kesehatanku aman dan privat?","acceptedAnswer":{"@type":"Answer","text":"Ya. Data kesehatanmu seperti hasil medical check-up, catatan kalori, berat badan, tidur, dan siklus disimpan dengan aman dan hanya dipakai untuk profil serta rekomendasimu sendiri. Data tidak dijual ke pihak ketiga."}},
    {"@type":"Question","name":"Perlu jadi member gym dulu untuk mulai?","acceptedAnswer":{"@type":"Answer","text":"Tidak. Siapa pun bisa mulai dengan my.20fit tanpa membership — tracking kesehatan, analisa check-up, dan scan makanan bisa langsung dipakai, lalu terhubung ke layanan gym, personal training, EMS, dan physiotherapy 20FIT kapan pun kamu siap."}}
  ]
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;900&family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#C41101;--bg:#EDE8DF;--card:#FFFFFF;--dark:#0A0908;--txt:#0A0908;--soft:#555;--muted:#9E8E7A;--border:#E8E2DB;--inp:#F0EDE5}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif}
  .emi{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;flex:0 0 auto}

  /* ---------- Sticky header ---------- */
  .site-header{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .hdr-in{max-width:1180px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .hdr-brand{display:flex;align-items:center;gap:13px;min-width:0}
  .hdr-brand img{height:72px;width:auto;display:block;margin:-20px 0}
  .hdr-sub{font-family:"Barlow Condensed";font-weight:600;letter-spacing:2.5px;font-size:10.5px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .hdr-right{display:flex;align-items:center;gap:12px}
  .lang{display:flex;gap:4px;background:rgba(10,9,8,.06);border-radius:9px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--soft);font-weight:700;font-size:12px;padding:6px 11px;border-radius:7px;cursor:pointer;font-family:Manrope}
  .lang button.on{background:var(--red);color:#fff}
  .hdr-cta{background:var(--red);color:#fff;border:0;border-radius:10px;padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:Manrope}
  .hdr-cta:hover{filter:brightness(1.08)}

  /* ---------- Hero ---------- */
  .hero{background:var(--bg);color:var(--txt);
    background-image:linear-gradient(rgba(10,9,8,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(10,9,8,.035) 1px,transparent 1px);background-size:46px 46px}
  .hero-in{max-width:1180px;margin:0 auto;padding:52px 22px 64px;display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
  .eyebrow{font-family:"Barlow Condensed";font-weight:700;letter-spacing:3px;font-size:13px;color:var(--red);text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:34px;height:2px;background:var(--red);flex:0 0 auto}
  .hero h1{font-family:Anton;font-size:52px;line-height:1.02;margin:16px 0 18px;letter-spacing:.5px;text-transform:uppercase;color:var(--dark)}
  .hero .lead{color:var(--soft);font-size:16px;line-height:1.7;max-width:520px;margin:0 0 24px}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chips span{background:#fff;border:1px solid var(--border);color:var(--txt);font-size:13px;font-weight:600;padding:9px 15px;border-radius:22px}

  /* ---------- Auth card ---------- */
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px 30px 24px;box-shadow:0 20px 50px rgba(10,9,8,.10);color:var(--txt)}
  .auth-card h2{font-family:Anton;font-size:26px;margin:0 0 4px;letter-spacing:.5px}
  .auth-card .h-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{border:0;background:transparent;padding:0 0 12px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;position:relative;font-family:Manrope}
  .tabs button.active{color:var(--txt)}
  .tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--red);border-radius:3px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:13px 14px;background:var(--inp);border:1px solid var(--border);border-radius:11px;font-size:15px;color:var(--txt);font-family:Manrope}
  input::placeholder{color:#b9ab98}
  input:focus{outline:none;border-color:var(--red);background:var(--card)}
  .btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(196,17,1,.25)}
  .btn:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--red)}.msg.ok{color:#2A7A4F}
  .gender2{display:flex;gap:10px}
  .gender2 button{flex:1;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;font-family:Manrope;font-size:14px}
  .gender2 button.active{border-color:var(--red);background:rgba(196,17,1,.08);color:var(--red)}
  .forgot-row{text-align:center;margin-top:14px;font-size:13px}
  .forgot-row a{color:var(--red);text-decoration:none;font-weight:600}
  .seebtn{width:100%;margin-top:14px;padding:12px;border-radius:12px;background:transparent;border:1px dashed var(--border);color:var(--soft);font-weight:700;font-size:13.5px;cursor:pointer;font-family:Manrope}
  .seebtn:hover{border-color:var(--red);color:var(--red)}
  .hide{display:none}

  /* ---------- Sections ---------- */
  .sec{max-width:1080px;margin:0 auto;padding:0 22px}
  .sec-h{text-align:center;margin:66px 0 6px}
  .sec-h .eyebrow{justify-content:center}
  .sec-h h2{font-family:Anton;font-size:34px;margin:14px 0 8px;letter-spacing:.5px;text-transform:uppercase;color:var(--dark)}
  .sec-h p{color:var(--muted);font-size:15px;max-width:600px;margin:0 auto;line-height:1.6}
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0 0}
  .fcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px}
  .fcard .fic{width:46px;height:46px;border-radius:12px;background:rgba(196,17,1,.10);display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:var(--red)}
  .fcard .fic .emi{width:22px;height:22px}
  .fcard h3{font-size:16px;font-weight:800;margin:0 0 6px;color:var(--dark)}
  .fcard p{color:var(--soft);font-size:13.5px;line-height:1.6;margin:0}
  /* Ecosystem highlight band (last feature card, full width) */
  .fcard.eco{grid-column:1/-1;background:rgba(196,17,1,.05);color:var(--txt);border:1px solid rgba(196,17,1,.18);display:flex;align-items:center;gap:22px;padding:26px 30px}
  .fcard.eco .fic{background:rgba(196,17,1,.14);margin:0;width:54px;height:54px;flex:0 0 auto}
  .fcard.eco .fic .emi{width:26px;height:26px}
  .fcard.eco .eco-body{flex:1;min-width:0}
  .fcard.eco h3{font-family:Anton;font-weight:400;font-size:22px;letter-spacing:.5px;text-transform:uppercase;color:var(--dark);margin-bottom:5px}
  .fcard.eco p{color:var(--soft);font-size:14px}
  .eco-cta{flex:0 0 auto;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:12px 20px;border-radius:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(196,17,1,.28)}
  .eco-cta:hover{filter:brightness(1.08)}

  /* ---------- FAQ ---------- */
  .faq{max-width:760px;margin:26px auto 0}
  .faq-item{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .faq-q{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;font-weight:700;font-size:14.5px}
  .faq-q .pl{color:var(--red);font-size:22px;line-height:1;flex:0 0 auto;transition:transform .3s}
  .faq-item.open .faq-q .pl{transform:rotate(45deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .faq-a .inner{padding:0 18px 16px;color:var(--soft);font-size:13.5px;line-height:1.65}

  /* ---------- Footer ---------- */
  .foot{background:#E7E0D6;color:var(--soft);border-top:1px solid var(--border);margin-top:60px;padding:46px 22px 30px}
  .foot-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;gap:30px 50px;justify-content:space-between}
  .foot .flogo{height:84px;width:auto;margin:-22px 0 6px}
  .foot .fabout{max-width:330px;font-size:13.5px;line-height:1.7;color:var(--muted)}
  .foot .fcol h4{color:var(--dark);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 12px;font-family:"Barlow Condensed";font-weight:700}
  .foot .fcol a{display:block;color:var(--soft);text-decoration:none;font-size:13.5px;margin-bottom:9px}
  .foot .fcol a:hover{color:var(--red)}
  .foot-bot{max-width:1080px;margin:28px auto 0;padding-top:20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* ---------- Scroll cue ---------- */
  .scrollcue{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--soft);font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;
    background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:22px;padding:8px 16px 6px;
    box-shadow:0 6px 20px rgba(10,9,8,.12);transition:opacity .4s,transform .4s}
  .scrollcue svg{width:16px;height:16px;stroke:var(--red);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;animation:cuebob 1.4s ease-in-out infinite}
  @keyframes cuebob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  .scrollcue.gone{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(12px)}

  @media(max-width:860px){
    .hdr-sub{display:none}
    .hdr-cta{display:none}
    .hero-in{grid-template-columns:1fr;gap:26px;padding:34px 20px 46px}
    .auth-card{order:-1;padding:24px 22px 20px}
    .hero h1{font-size:34px}
    .sec-h{margin:48px 0 4px}
    .sec-h h2{font-size:26px}
    .fgrid{grid-template-columns:1fr}
    .fcard.eco{flex-direction:column;align-items:flex-start;gap:16px;padding:24px 22px}
    .eco-cta{width:100%;text-align:center}
    .foot-in{gap:26px}
  }
</style>

<body>
  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="hdr-in">
      <div class="hdr-brand">
        <img src="https://media.20fit.id/wp-content/uploads/2026/05/Logo-20fit.png" alt="20FIT" />
        <span class="hdr-sub">Health Profile · my.20fit.id</span>
      </div>
      <div class="hdr-right">
        <div class="lang">
          <button id="lang-en" onclick="setLang('en')">EN</button>
          <button id="lang-id" onclick="setLang('id')">ID</button>
        </div>
        <button class="hdr-cta" id="hdrCta" type="button" onclick="focusForm()"></button>
      </div>
    </div>
  </header>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-in">
      <div class="hero-copy">
        <div class="eyebrow" data-k="missLabel">For everyone</div>
        <h1 data-k="missTitle"></h1>
        <p class="lead" data-k="missBody"></p>
        <div class="chips"><span data-k="missChip1"></span><span data-k="missChip2"></span><span data-k="missChip3"></span></div>
      </div>

      <div class="auth-card" id="authcard">
        <h2 id="title">Welcome</h2>
        <div class="h-sub" id="sub" data-k="sub"></div>

        <div class="tabs">
          <button id="tab-in" class="active" onclick="setMode('in')"></button>
          <button id="tab-up" onclick="setMode('up')"></button>
        </div>

        <form id="authform" autocomplete="on" onsubmit="event.preventDefault();doLogin();return false;">
        <div id="name-wrap" class="hide">
          <label data-k="name"></label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>

        <label data-k="email">Email</label>
        <input id="email" name="username" type="email" placeholder="name@email.com" autocomplete="username" />

        <div id="phone-wrap" class="hide">
          <label data-k="phone"></label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" />
        </div>

        <div id="gender-wrap" class="hide">
          <label data-k="gender">Gender</label>
          <div class="gender2">
            <button type="button" id="g-male" onclick="pickGender('male')" data-k="male">Male</button>
            <button type="button" id="g-female" onclick="pickGender('female')" data-k="female">Female</button>
          </div>
        </div>
        <div id="dob-wrap" class="hide">
          <label data-k="dob">Date of Birth</label>
          <input id="birthdate" type="date" />
        </div>

        <label data-k="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />

        <div id="confirm-wrap" class="hide">
          <label data-k="confirm">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <div id="consent-wrap" class="hide" style="margin:2px 0 4px">
          <label style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer;color:var(--muted)">
            <input id="consentChk" type="checkbox" style="width:auto;margin-top:2px;flex:0 0 auto" />
            <span><span data-k="consentText">I agree to the</span> <a href="/privacy" target="_blank" rel="noopener" style="color:var(--red);font-weight:700" data-k="consentLink">Privacy Policy</a>.</span>
          </label>
        </div>

        <button class="btn" id="submit" type="submit"></button>
        </form>
        <div class="forgot-row"><a id="forgot" href="reset-password.html"></a></div>

        <div class="msg" id="msg"></div>
        <button type="button" class="seebtn" data-k="seeFeatures" onclick="document.getElementById('features').scrollIntoView({behavior:'smooth'})"></button>
      </div>
    </div>
  </section>

  <!-- Petunjuk scroll -->
  <div class="scrollcue" id="scrollcue" onclick="document.getElementById('features').scrollIntoView({behavior:'smooth'})">
    <span data-k="scrollcue">Scroll for more</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
  </div>

  <!-- ============ FITUR + EKOSISTEM ============ -->
  <section class="sec">
    <div class="sec-h" id="features">
      <div class="eyebrow" data-k="featsLabel">Features</div>
      <h2 data-k="featsTitle"></h2>
      <p data-k="featsSub"></p>
    </div>
    <div class="fgrid" id="fgrid"></div>
  </section>

  <!-- ============ FAQ ============ -->
  <section class="sec">
    <div class="sec-h" id="faq-top">
      <div class="eyebrow" data-k="faqLabel">FAQ</div>
      <h2 data-k="faqTitle"></h2>
      <p data-k="faqSub"></p>
    </div>
    <div class="faq" id="faq"></div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="foot">
    <div class="foot-in">
      <div>
        <img class="flogo" src="https://media.20fit.id/wp-content/uploads/2026/05/Logo-20fit.png" alt="20FIT" />
        <div class="fabout" data-k="footAbout"></div>
      </div>

    // ---- Konten marketing (grid fitur + FAQ), bilingual ----
    const FEATURES = [
      {ic:'<svg class="emi" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>', en:{t:"Medical records, decoded",   d:"Upload lab & MCU results (PDF/JPG/PNG) from any hospital — our AI explains them in plain language."},

      {ic:'<svg class="emi" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>', en:{t:"Track your progress",         d:"Weight, streaks, sleep, water & weekly stats — all in one simple dashboard."},

      {ic:'<svg class="emi" viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg>', en:{t:"One 20FIT ecosystem",         d:"Book Gym, Personal Training, EMS, Physiotherapy & clinic — all connected to your health data."},
                id:{t:"Satu ekosistem 20FIT",        d:"Booking Gym, Personal Training, EMS, Physiotherapy & klinik — semua terhubung ke data kesehatanmu."}},
    ];
    const FAQS = [
      {en:{q:"Is my.20fit free to use?",           a:"Yes. Creating your 20FIT health profile, uploading medical check-up (MCU) and lab results, tracking your daily health, and getting AI-powered analysis are all completely free. You only pay for optional add-ons — such as extra AI calorie food scans beyond your free monthly quota — and there is no subscription required to start understanding your health."},
       id:{q:"Apakah my.20fit gratis?",            a:"Ya. Membuat profil kesehatan 20FIT, upload hasil medical check-up (MCU) & lab, tracking kesehatan harian, dan mendapatkan analisa berbasis AI semuanya sepenuhnya gratis. Kamu hanya membayar untuk add-on opsional — seperti scan kalori makanan AI tambahan di luar jatah gratis bulanan — dan tidak perlu langganan untuk mulai memahami kondisi kesehatanmu."}},
      {en:{q:"I already have a 20FIT account — can I use it here?", a:"Absolutely. If you already train at a 20FIT gym or use 20FIT services, sign in with your existing 20FIT email and password, or tap “Continue with 20FIT”. Your membership and health data connect automatically, so your profile, class bookings, and workout history stay in one place across the entire 20FIT ecosystem."},
       id:{q:"Aku sudah punya akun 20FIT — bisa dipakai di sini?",  a:"Tentu. Kalau kamu sudah latihan di gym 20FIT atau memakai layanan 20FIT, masuk pakai email dan password 20FIT kamu, atau klik “Masuk dengan 20FIT”. Membership dan data kesehatanmu otomatis terhubung, jadi profil, booking kelas, dan riwayat latihanmu tersimpan dalam satu tempat di seluruh ekosistem 20FIT."}},
      {en:{q:"What can the AI read from my medical check-up?",   a:"Upload your lab results or a full medical check-up (MCU) report from any hospital or clinic — as a PDF, JPG, or PNG — and the 20FIT AI reads every parameter, highlights values outside the normal range, and explains what each one means in plain, easy-to-understand language. It then suggests diet, exercise, and follow-up steps tailored to your results. This is educational guidance to help you understand your health, not a medical diagnosis or a replacement for your doctor."},
       id:{q:"Apa yang bisa dibaca AI dari medical check-up?",  a:"Upload hasil lab atau laporan medical check-up (MCU) lengkap dari rumah sakit atau klinik mana pun — dalam format PDF, JPG, atau PNG — dan AI 20FIT membaca setiap parameter, menandai nilai yang di luar batas normal, serta menjelaskan artinya dengan bahasa yang mudah dipahami. AI juga memberi saran diet, olahraga, dan langkah tindak lanjut sesuai hasilmu. Ini panduan edukasi untuk membantumu memahami kesehatan, bukan diagnosa medis atau pengganti dokter."}},
      {en:{q:"How does the AI calorie food scan work?",     a:"Just snap a photo of your meal or upload an existing one, and the 20FIT AI estimates the total calories and full macros — protein, carbohydrates, fat, and fiber — then gives the meal a health score and practical tips to make it more balanced. It works for Indonesian dishes and home cooking, not only packaged food. You get a set of free scans every month, with affordable top-ups if you want to track your nutrition more often."},
       id:{q:"Bagaimana cara kerja scan kalori makanan pakai AI?", a:"Cukup foto makananmu atau upload gambar yang sudah ada, dan AI 20FIT memperkirakan total kalori dan makro lengkap — protein, karbohidrat, lemak, dan serat — lalu memberi health score serta tips praktis agar makananmu lebih seimbang. Bisa untuk masakan Indonesia dan masakan rumahan, bukan cuma makanan kemasan. Ada jatah scan gratis tiap bulan, dan top-up terjangkau kalau ingin tracking nutrisi lebih sering."}},
      {en:{q:"Is my health data private and secure?",              a:"Yes. Your health data — medical check-up results, calorie logs, weight, sleep, and cycle information — is stored securely and used only to power your own profile, insights, and recommendations. It is never sold to third parties, and you stay in full control of the information you choose to upload."},
       id:{q:"Apakah data kesehatanku aman dan privat?",          a:"Ya. Data kesehatanmu — hasil medical check-up, catatan kalori, berat badan, tidur, dan informasi siklus — disimpan dengan aman dan hanya dipakai untuk profil, insight, dan rekomendasimu sendiri. Datamu tidak pernah dijual ke pihak ketiga, dan kamu tetap memegang kendali penuh atas informasi yang kamu upload."}},
      {en:{q:"Do I need a gym membership to start?",     a:"No. Anyone can start with my.20fit — whether you are just beginning a healthier lifestyle or you have been training for years. You can track your health, analyse your check-ups, and scan your meals without any membership, and connect to 20FIT gym, personal training, EMS, and physiotherapy services whenever you are ready."},
       id:{q:"Perlu jadi member gym dulu untuk mulai?", a:"Tidak. Siapa pun bisa mulai dengan my.20fit — baik kamu baru memulai hidup sehat maupun sudah bertahun-tahun latihan. Kamu bisa tracking kesehatan, analisa check-up, dan scan makanan tanpa membership apa pun, lalu terhubung ke layanan gym, personal training, EMS, dan physiotherapy 20FIT kapan pun kamu siap."}},
    ];
    function renderMarketing(){
      const pick=o=>o[lang]||o.en;
      const g=document.getElementById("fgrid");
      if(g) g.innerHTML=FEATURES.map((f,i)=>{
        if(i===FEATURES.length-1){
          return '<div class="fcard eco"><div class="fic">'+f.ic+'</div><div class="eco-body"><h3>'+pick(f).t+'</h3><p>'+pick(f).d+'</p></div><a class="eco-cta" href="https://booking.20fit.id/" target="_blank" rel="noopener">'+T[lang].ecoCta+' →</a></div>';
        }
        return '<div class="fcard"><div class="fic">'+f.ic+'</div><h3>'+pick(f).t+'</h3><p>'+pick(f).d+'</p></div>';
      }).join("");
      const fq=document.getElementById("faq");
      if(fq) fq.innerHTML=FAQS.map((f,i)=>'<div class="faq-item" id="faqi'+i+'"><div class="faq-q" onclick="toggleFaq('+i+')">'+pick(f).q+'<span class="pl">+</span></div><div class="faq-a"><div class="inner">'+pick(f).a+'</div></div></div>').join("");
    }
    function toggleFaq(i){
      const el=document.getElementById("faqi"+i); if(!el) return;
      const open=el.classList.contains("open");
      el.classList.toggle("open",!open);
      const a=el.querySelector(".faq-a");
      a.style.maxHeight=open?"0":(a.querySelector(".inner").scrollHeight+20)+"px";
    }

    function setLang(l){ lang=l; localStorage.setItem("lang",l); applyLang(); }
    function applyLang(){
      const d=T[lang];
      document.documentElement.lang=lang;
      document.getElementById("lang-en").classList.toggle("on",lang==="en");
      document.getElementById("lang-id").classList.toggle("on",lang==="id");
      document.querySelectorAll("[data-k]").forEach(el=>{const k=el.getAttribute("data-k"); if(d[k]!=null) el.textContent=d[k];});
      document.getElementById("name").placeholder=d.namePh;
      document.getElementById("phone").placeholder=d.phonePh;
      document.getElementById("forgot").textContent=d.forgot;
      document.getElementById("hdrCta").textContent=d.tabIn;
      renderMarketing();
      refreshMode();
    }
    function refreshMode(){
      const d=T[lang];
      document.getElementById("tab-in").textContent=d.tabIn;
      document.getElementById("tab-up").textContent=d.tabUp;
      document.getElementById("submit").textContent=mode==="in"?d.btnIn:d.btnUp;
      document.getElementById("title").textContent=mode==="in"?d.titleIn:d.titleUp;
    }
    function setMode(m){
      mode=m;
      document.getElementById("tab-in").classList.toggle("active",m==="in");
      document.getElementById("tab-up").classList.toggle("active",m==="up");
      document.getElementById("name-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("phone-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("gender-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("dob-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("confirm-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("consent-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("password").autocomplete=m==="in"?"current-password":"new-password";
      msg("");
      refreshMode();
    }
    function msg(t,type){const el=document.getElementById("msg");el.textContent=t||"";el.className="msg"+(type?" "+type:"")}

    // Simpan email+password ke password manager browser (sinkron antar device)
    function saveCredential(id,password){
      try{
        if(window.PasswordCredential && navigator.credentials){
          const c=new window.PasswordCredential({id:id,password:password,name:id});
          navigator.credentials.store(c).catch(function(){});
        }
      }catch(e){}
    }
    async function doLogin(){
      const d=T[lang];
      // Meta Pixel: klik tombol Sign In / Create Account = Lead
      try{ Meta.track("Lead", {content_name: mode==="up"?"create_account":"sign_in"}); }catch(e){}
      const email=document.getElementById("email").value.trim();
      const password=document.getElementById("password").value;
      const name=document.getElementById("name").value.trim();
      const phone=document.getElementById("phone").value.trim();
      const birthdate=document.getElementById("birthdate").value;
      if(!email||!password)return msg(d.errFill,"err");
      if(mode==="up"&&!name)return msg(d.errName,"err");
      if(mode==="up"&&!gender)return msg(d.errGender,"err");
      if(mode==="up"&&!birthdate)return msg(d.errDob,"err");
      if(mode==="up"&&password.length<8)return msg(d.errPw,"err");
      if(mode==="up"&&password!==document.getElementById("confirm").value)return msg(d.errMatch,"err");
      if(mode==="up"&&!document.getElementById("consentChk").checked)return msg(d.errConsent,"err");
      const btn=document.getElementById("submit");btn.disabled=true;msg(d.processing,"");
      try{
        if(mode==="up"){
          // REGISTER lewat API 20FIT (developer). Data gender + tgl lahir ikut terkirim.
          await Auth.fitcoRegister({name:name,email:email,password:password,phone:phone,gender:gender,date_of_birth:birthdate});
        }
        else{
          // Prioritas akun 20FIT (API developer). Kalau ditolak (bukan akun 20FIT),
          // fallback ke akun profile20fit (Supabase) supaya akun lama tetap bisa masuk.
          try{
            await Auth.fitcoLogin(email,password);
          }catch(e20){
            const m=String((e20&&e20.message)||"").toLowerCase();
            // Kalau 20FIT down / server belum dikonfigurasi (bukan sekadar salah kredensial),
            // jangan disembunyikan -> lempar lagi biar pesannya jelas.
            if(m.includes("dikonfigurasi")||m.includes("service key")||m.includes("menghubungi")){ throw e20; }
            await Auth.signIn(email,password);   // akun profile20fit (Supabase)
          }
        }
        saveCredential(email,password);
        await Auth.routeAfterAuth();
      }catch(e){msg(terjemah(e.message),"err");btn.disabled=false}
    }
    function terjemah(m){
      const d=T[lang]; m=(m||"").toLowerCase();
      if(m.includes("invalid login"))return d.errCred;
      if(m.includes("already registered")||m.includes("already been")||m.includes("sudah terdaftar"))return d.errExists;
      if(m.includes("20FIT")&&(m.includes("salah")||m.includes("wrong")))return d.errCred;
      if(m.includes("menghubungi server 20FIT")||m.includes("contact"))return lang==="en"?"Couldn't reach 20FIT. Try again.":"Tidak bisa menghubungi 20FIT. Coba lagi.";
      if(m.includes("password minimal")||(m.includes("password")&&m.includes("8")))return d.errPw;
      if(m.includes("password"))return d.errCred;
      if(m.includes("dikonfigurasi")||m.includes("service key"))return lang==="en"?"20FIT sign-in isn’t ready on the server yet. Try again later.":"Login 20FIT belum aktif di server. Coba lagi nanti.";
      if(m.includes("supabaseurl")||m.includes("not configured")||m.includes("anon"))return lang==="en"?"Server not ready. Refresh in a moment.":"Server belum siap. Coba refresh.";
      if(m.includes("fetch")||m.includes("network"))return lang==="en"?"Connection failed. Try again.":"Koneksi gagal. Coba lagi.";
      return "Error: "+(m||"unknown");
    }

    // Prefill email & password dari password manager browser (kalau ada)
    async function tryAutofill(){
      try{
        if(navigator.credentials && window.PasswordCredential){
          const cred=await navigator.credentials.get({password:true, mediation:"optional"});
          if(cred){
            if(cred.id) document.getElementById("email").value=cred.id;
            if(cred.password) document.getElementById("password").value=cred.password;
          }
        }
      }catch(e){}
    }

    // SSO SEAMLESS: kalau app utama 20FIT mengoper access_token lewat URL
    //   my.20fit.id/login.html?token=XXX  (atau ?access_token=  / #token= )
    // -> langsung buat sesi TANPA user ketik apa pun.
    async function tryTokenSSO(){
      try{
        const q=new URLSearchParams(location.search);
        let tok=q.get("token")||q.get("access_token")||q.get("fittoken")||q.get("fitco_token");
        if(!tok && location.hash){ const h=new URLSearchParams(location.hash.replace(/^#/,"")); tok=h.get("token")||h.get("access_token"); }
        if(!tok) return false;
        // Bersihkan token dari URL supaya tidak ke-share / ke-log.
        try{ history.replaceState(null,"",location.pathname); }catch(e){}
        msg(lang==="en"?"Signing you in…":"Menyiapkan sesi kamu…","ok");
        await Auth.tokenLogin(tok);
        await Auth.routeAfterAuth();
        return true;
      }catch(e){
        msg(lang==="en"?"Auto sign-in failed — please sign in below.":"Masuk otomatis gagal — silakan masuk di bawah.","err");
        return false;
      }
    }

    // Auto-enter hanya kalau user sudah SIAP PENUH. Selain itu -> tampilkan pilihan login/sign up dulu.
    (async function(){
      try{
        await Auth.ready;
        // 0) Token SSO dari app utama -> langsung masuk.
        if(await tryTokenSSO()) return;
        // Route HANYA saat user AKTIF login / balik dari Google (evt SIGNED_IN), bukan saat sesi lama kebaca.
        Auth.supabase.auth.onAuthStateChange((evt,sess)=>{ if(evt==="SIGNED_IN" && sess && sess.user){ Auth.routeAfterAuth(); } });
        // Ada sesi -> arahkan sesuai flow (data dulu -> password -> dashboard).
        const u=await Auth.getUser();
        if(u){ try{ await Auth.routeAfterAuth(); return; }catch(e){} }
        tryAutofill();
      }catch(e){}
    })();
    applyLang();
    // Sembunyikan tanda scroll setelah user mulai scroll
    window.addEventListener("scroll",function(){
      var c=document.getElementById("scrollcue"); if(c) c.classList.toggle("gone", window.scrollY>60);
    },{passive:true});
    // Prefill dari URL (mis. dari halaman kode saat email belum terdaftar -> dorong Buat Akun)
    (function(){
      try{
        const q=new URLSearchParams(location.search);
        const em=q.get("email"); if(em) document.getElementById("email").value=em;
        if(q.get("mode")==="up"){ setMode("up"); if(em) msg(lang==="en"?"This email has no account yet — create one below.":"Email ini belum punya akun — buat akunnya di bawah ya.","err"); }
      }catch(e){}
    })();

    // Meta Pixel: kunjungan halaman login = ViewContent
    try{ Meta.track("ViewContent", {content_name:"login"}); }catch(e){}
  </script>
