<!-- SEO: FAQ structured data (schema.org FAQPage) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {"@type":"Question","name":"Is my.20fit free to use?","acceptedAnswer":{"@type":"Answer","text":"Yes. Creating your health profile, tracking, and AI check-up analysis are free. Some add-ons (like extra calorie scans) are optional top-ups."}},
    {"@type":"Question","name":"I already have a 20FIT account — can I use it here?","acceptedAnswer":{"@type":"Answer","text":"Absolutely. Sign in with your existing 20FIT email and password, or your same login works here. Your data connects automatically."}},
    {"@type":"Question","name":"What can the AI read from my check-up?","acceptedAnswer":{"@type":"Answer","text":"Upload lab results or an MCU report and the AI highlights what needs attention, explains each parameter, and suggests diet, exercise and follow-ups. It is guidance, not a diagnosis."}},
    {"@type":"Question","name":"How does the calorie food scan work?","acceptedAnswer":{"@type":"Answer","text":"Just snap or upload a photo of your meal. Our AI estimates the calories and full macros (protein, carbs, fat and fiber), gives a health score, and suggests how to make it more balanced. You get free scans every month, with optional top-ups for more."}},
    {"@type":"Question","name":"Is my health data private?","acceptedAnswer":{"@type":"Answer","text":"Yes. Your data is stored securely and only used to power your own profile and recommendations."}},
    {"@type":"Question","name":"Do I need a gym membership to start?","acceptedAnswer":{"@type":"Answer","text":"No. Anyone can start — whether you are new to a healthy lifestyle or a long-time member. 20FIT's services are there when you are ready."}}
  ]
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#C41101;--bg:#F1EFF0;--card:#FFFFFF;--dark:#15171C;--txt:#15171C;--soft:#555;--muted:#8A8D94;--border:#E7E4E4;--inp:#F4F2F2}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--txt);font-family:Manrope,system-ui,sans-serif;
    background:linear-gradient(180deg,#F7EEF0 0%,#F2F0F2 26%,#EFEFF1 100%);background-attachment:fixed;min-height:100vh}
  .emi{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;flex:0 0 auto}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .disp{font-family:"Barlow Condensed",sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1.02}
  .eyebrow{font-family:"Barlow Condensed";font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--red);text-transform:uppercase;display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:30px;height:2px;background:var(--red);flex:0 0 auto}

  /* ---------- Header ---------- */
  .site-header{position:sticky;top:0;z-index:80;background:rgba(247,240,242,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .hdr-in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{font-family:"Barlow Condensed";font-weight:900;font-size:26px;letter-spacing:.01em;color:var(--dark);text-decoration:none;line-height:1}
  .brand b{color:var(--red);font-weight:900}
  /* Logo header pakai gambar (Logo-20fit.png). File punya padding internal -> tinggi besar
     + margin negatif biar ukuran visual wajar (~34px) & rata vertikal. */
  .brand-img{display:inline-flex;align-items:center}
  .brand-img img{height:74px;width:auto;display:block;margin:-20px 0}
  .lang{display:flex;gap:3px;background:rgba(21,23,28,.06);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--soft);font-weight:700;font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;font-family:Manrope}
  .lang button.on{background:var(--red);color:#fff}

  /* ---------- Hero ---------- */
  .hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:start;padding:56px 24px 40px;max-width:1180px;margin:0 auto}
  .hero h1{font-size:58px;margin:16px 0 18px;color:var(--dark)}
  .hero .lead{color:var(--soft);font-size:16px;line-height:1.7;max-width:500px;margin:0 0 26px}
  .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
  .btn-primary{background:var(--red);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-weight:800;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;font-family:Manrope;box-shadow:0 8px 20px rgba(196,17,1,.28)}
  .btn-primary:hover{filter:brightness(1.07)}
  .btn-ghost{background:#fff;color:var(--dark);border:1px solid var(--border);border-radius:999px;padding:14px 24px;font-weight:800;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;font-family:Manrope}
  .btn-ghost:hover{border-color:var(--red);color:var(--red)}
  .checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
  .checks li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--txt);font-weight:500}
  .checks svg{width:16px;height:16px;stroke:var(--red);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  /* ---------- Auth card ---------- */
  .auth-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 28px;box-shadow:0 20px 50px rgba(21,23,28,.08)}
  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .tabs button{border:0;background:transparent;padding:0 0 12px;font-family:"Barlow Condensed";font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative}
  .tabs button.active{color:var(--txt)}
  .tabs button.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--red);border-radius:3px}
  label{display:block;font-family:"Barlow Condensed";font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;background:var(--inp);border:1px solid var(--border);border-radius:11px;font-size:15px;color:var(--txt);font-family:Manrope}
  input::placeholder{color:#aab0b8}
  input:focus{outline:none;border-color:var(--red);background:var(--card)}
  .btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px rgba(196,17,1,.24)}
  .btn:disabled{opacity:.6}
  .msg{margin-top:12px;font-size:13px;text-align:center;min-height:16px}
  .msg.err{color:var(--red)}.msg.ok{color:#2A7A4F}
  .forgot-row{text-align:center;margin-top:12px;font-size:13px}
  .forgot-row a{color:var(--red);text-decoration:none;font-weight:700}
  .card-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
  .gender2{display:flex;gap:10px}
  .gender2 button{flex:1;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--muted);font-weight:700;cursor:pointer;font-family:Manrope;font-size:14px}
  .gender2 button.active{border-color:var(--red);background:rgba(196,17,1,.08);color:var(--red)}
  .hide{display:none}

  /* ---------- Sections ---------- */
  .sec{max-width:1180px;margin:0 auto;padding:0 24px}
  .sec-h{margin:56px 0 4px}
  .sec-h h2{font-size:40px;margin:12px 0 6px;color:var(--dark)}
  .sec-h p{color:var(--muted);font-size:15px;max-width:620px;margin:0;line-height:1.6}

  /* Preview grid */
  .fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 0}
  .pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .pcard .pbody{padding:18px 20px}
  .pcard.photo .pimg{height:170px;background:linear-gradient(135deg,#d9d5d6,#efeceb);overflow:hidden}
  .pcard.photo .pimg img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .pcard .fic{width:46px;height:46px;border-radius:12px;background:rgba(196,17,1,.10);display:flex;align-items:center;justify-content:center;color:var(--red);margin:20px 20px 0}
  .pcard .fic .emi{width:22px;height:22px}
  .pcard h3{font-family:"Barlow Condensed";font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;color:var(--dark)}
  .pcard p{color:var(--soft);font-size:13.5px;line-height:1.6;margin:0}

  /* FOR EVERYONE band (light) */
  .everyone{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:40px 40px;margin:34px auto 0;box-shadow:0 16px 40px rgba(21,23,28,.05)}
  .everyone .eyebrow{margin-bottom:14px}
  .everyone h2{font-size:34px;line-height:1.05;margin:0 0 14px;color:var(--dark);max-width:760px}
  .everyone p{color:var(--soft);font-size:15.5px;line-height:1.7;max-width:720px;margin:0}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .chips span{background:var(--inp);border:1px solid var(--border);color:var(--txt);font-family:"Barlow Condensed";font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;padding:9px 15px;border-radius:999px}

  /* FAQ */
  .faq{margin:24px auto 0}
  .faq-item{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
  .faq-q{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;font-weight:700;font-size:14.5px}
  .faq-q .pl{color:var(--red);font-size:22px;line-height:1;flex:0 0 auto;transition:transform .3s}
  .faq-item.open .faq-q .pl{transform:rotate(45deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .faq-a .inner{padding:0 20px 16px;color:var(--soft);font-size:13.5px;line-height:1.65}

  /* Footer */
  .foot{border-top:1px solid var(--border);margin-top:56px;padding:44px 24px 40px}
  .foot-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:30px 50px;justify-content:space-between}
  .foot .brand{font-size:24px;display:inline-block;margin-bottom:12px}
  .foot .fabout{max-width:320px;font-size:13.5px;line-height:1.7;color:var(--muted)}
  .foot .fcol h4{color:var(--dark);font-family:"Barlow Condensed";font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:0 0 12px}
  .foot .fcol a{display:block;color:var(--soft);text-decoration:none;font-size:13.5px;margin-bottom:9px}
  .foot .fcol a:hover{color:var(--red)}
  .foot-bot{max-width:1180px;margin:26px auto 0;padding-top:18px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}

  /* Sticky CTA bar (light) */
  .sticky{position:fixed;left:16px;right:16px;bottom:16px;z-index:70;max-width:1180px;margin:0 auto;
    background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--border);border-radius:16px;box-shadow:0 12px 34px rgba(21,23,28,.14);
    display:flex;align-items:center;gap:14px;padding:12px 14px 12px 20px}
  .sticky .stx{flex:1;font-family:"Barlow Condensed";font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--dark);min-width:0}
  .sticky .btn-primary{padding:11px 20px}
  .sticky .sclose{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;flex:0 0 auto}
  .sticky.gone{display:none}

  @media(max-width:860px){
    .hero-in{grid-template-columns:1fr;gap:26px;padding:30px 20px 26px}
    /* Mobile: hero copy dulu ("Your whole health story…"), lalu kartu Sign In/Create Account di bawahnya. */
    .hero h1{font-size:40px}
    .sec-h h2{font-size:30px}
    .fgrid{grid-template-columns:1fr}
    .everyone{padding:28px 22px}.everyone h2{font-size:27px}
    .foot-in{gap:24px}
    .sticky{flex-wrap:wrap;padding:12px 14px}
    .sticky .stx{flex-basis:100%}
    .sticky .btn-primary{flex:1}
  }
</style>

          </label>
        </div>

        <button class="btn" id="submit" type="submit"></button>
        </form>
        <div class="forgot-row"><a id="forgot" href="reset-password.html"></a></div>
        <div class="msg" id="msg"></div>
        <div class="card-note" data-k="cardNote"></div>
      </div>

  <!-- Promo CTA sekunder (dari my20fit_promo_banners, teks dwibahasa & tanggal dari DB;
       auto-hilang setelah ends_at; klik → mode Buat Akun). Putih border merah, bukan merah penuh. -->
  <style>
    #promoLogin{padding:4px 18px 30px}
    .promo-login{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;margin:0 auto;
      background:#fff;border:1.8px solid #C41101;border-radius:14px;padding:13px 16px;cursor:pointer;
      text-align:left;font-family:inherit;text-decoration:none}
    .promo-login:focus-visible{outline:3px solid #C41101;outline-offset:2px}
    .promo-login .pl-ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:#FCEBED;color:#C41101;display:grid;place-items:center}

    const FAQS = [
      {en:{q:"Is my.20fit free to use?",           a:"Yes. Creating your 20FIT health profile, uploading medical check-up (MCU) and lab results, tracking your daily health, and getting AI-powered analysis are all completely free. You only pay for optional add-ons — such as extra AI calorie food scans beyond your free monthly quota — and there is no subscription required to start understanding your health."},
       id:{q:"Apakah my.20fit gratis?",            a:"Ya. Membuat akun, upload hasil medical check-up (MCU) & lab, tracking kesehatan harian, dan mendapatkan analisa berbasis AI semuanya gratis. Kamu hanya membayar untuk add-on opsional — seperti scan kalori makanan AI tambahan di luar jatah gratis bulanan dan tidak perlu langganan untuk mulai memahami kondisi kesehatanmu."}},
      {en:{q:"I already have a 20FIT account — can I use it here?", a:"Absolutely. If you already train at a 20FIT gym or use 20FIT services, sign in with your existing 20FIT email and password — your same login works here. Your membership and health data connect automatically, so your profile, class bookings, and workout history stay in one place across the entire 20FIT ecosystem."},
       id:{q:"Aku sudah punya akun 20FIT, bisa digunakan di sini?",  a:"Tentu bisa. Jika kamu sudah menjadi member gym atau menggunakan layanan 20FIT lainnya, cukup masuk menggunakan email dan kata sandi akun 20FIT yang sudah kamu miliki. Akunmu akan otomatis terhubung dengan membership dan data kesehatanmu, sehingga profil, jadwal kelas, serta riwayat latihanmu tetap tersimpan dalam satu ekosistem 20FIT."}},
      {en:{q:"What can the AI read from my medical check-up?",   a:"Upload your lab results or a full medical check-up (MCU) report from any hospital or clinic — as a PDF, JPG, or PNG — and the 20FIT AI reads every parameter, highlights values outside the normal range, and explains what each one means in plain, easy-to-understand language. It then suggests diet, exercise, and follow-up steps tailored to your results. This is educational guidance to help you understand your health, not a medical diagnosis or a replacement for your doctor."},
       id:{q:"Apa saja yang bisa dianalisis AI dari hasil Medical Check-Up (MCU)?",  a:"Upload hasil lab atau laporan medical check-up (MCU) lengkap dari rumah sakit atau klinik mana pun — dalam format PDF, JPG, atau PNG — dan AI 20FIT membaca setiap parameter, menandai nilai yang di luar batas normal, serta menjelaskan artinya dengan bahasa yang mudah dipahami. AI juga memberi saran diet, olahraga, dan langkah tindak lanjut sesuai hasilmu. Ini panduan edukasi untuk membantumu memahami kesehatan, bukan diagnosa medis atau pengganti dokter."}},
      {en:{q:"How does the AI calorie food scan work?",     a:"Just snap a photo of your meal or upload an existing one, and the 20FIT AI estimates the total calories and full macros — protein, carbohydrates, fat, and fiber — then gives the meal a health score and practical tips to make it more balanced. It works for Indonesian dishes and home cooking, not only packaged food. You get a set of free scans every month, with affordable top-ups if you want to track your nutrition more often."},
       id:{q:"Bagaimana cara kerja scan kalori makanan pakai AI?", a:"Cukup foto makananmu atau upload gambar yang sudah ada, dan AI 20FIT memperkirakan total kalori dan makro lengkap — protein, karbohidrat, lemak, dan serat — lalu memberi health score serta tips praktis agar makananmu lebih seimbang. Bisa untuk masakan Indonesia dan masakan rumahan, bukan cuma makanan kemasan. Ada jatah scan gratis tiap bulan, dan top-up terjangkau kalau ingin tracking nutrisi lebih sering."}},
      {en:{q:"Is my health data private and secure?",              a:"Yes. Your health data — medical check-up results, calorie logs, weight, sleep, and cycle information — is stored securely and used only to power your own profile, insights, and recommendations. It is never sold to third parties, and you stay in full control of the information you choose to upload."},
       id:{q:"Apakah data kesehatanku aman dan privat?",          a:"Ya. Seluruh data kesehatanmu, termasuk hasil Medical Check-Up (MCU), hasil pemeriksaan laboratorium, catatan kalori, berat badan, tidur, hingga informasi siklus menstruasi, disimpan dengan aman dan hanya digunakan untuk memberikan insight serta rekomendasi yang dipersonalisasi."}},
      {en:{q:"Do I need a gym membership to start?",     a:"No. Anyone can start with my.20fit — whether you are just beginning a healthier lifestyle or you have been training for years. You can track your health, analyse your check-ups, and scan your meals without any membership, and connect to 20FIT gym, personal training, EMS, and physiotherapy services whenever you are ready."},

    function renderMarketing(){

    function toggleFaq(i){

    function setLang(l){ lang=l; localStorage.setItem("lang",l); applyLang(); }

      const d=T[lang];

      document.getElementById("forgot").textContent=d.forgot;
      renderMarketing();
      refreshMode();
      renderPromoLogin();

    // Tombol promo sekunder di halaman login: konten & tanggal dari my20fit_promo_banners

    var PROMO_LB; // undefined=blm fetch | null=tak ada | {..}=ada
    function plEsc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
    function plFmtEnds(iso){ if(!iso) return ""; var dt=new Date(iso); if(isNaN(dt)) return ""; try{ return new Intl.DateTimeFormat(lang==="en"?"en-GB":"id-ID",{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Jakarta"}).format(dt); }catch(e){ return ""; } }
    function drawPromoLogin(){
      var box=document.getElementById("promoLogin"); if(!box) return;
      var b=PROMO_LB;
      if(!b){ box.hidden=true; box.innerHTML=""; return; }
      var title=lang==="en"?(b.title_en||b.title_id||""):(b.title_id||b.title_en||"");
      var sub=lang==="en"?"Create a my.20fit.id account to claim":"Buat akun my.20fit.id untuk klaim";
      var ends=plFmtEnds(b.ends_at);
      var until=ends?((lang==="en"?" · only until ":" · hanya sampai ")+ends):"";
      var GIFT='<rect x="3" y="8" width="18" height="4" rx="1"></rect><path d="M12 8v13"></path><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"></path><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8"></path><path d="M16.5 8a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8"></path>';
      box.hidden=false;
      box.innerHTML='<button type="button" class="promo-login" onclick="goCreate()" aria-label="'+plEsc(title+" — "+sub+until)+'">'
        +'<span class="pl-ic" aria-hidden="true"><svg viewBox="0 0 24 24">'+GIFT+'</svg></span>'
        +'<span class="pl-tx"><b>'+plEsc(title)+'</b><small>'+plEsc(sub+until)+'</small></span></button>';
    }
    function renderPromoLogin(){
      if(PROMO_LB!==undefined){ drawPromoLogin(); return; }
      fetch("/api/promo/banner").then(function(r){return r.ok?r.json():null;}).then(function(j){ PROMO_LB=(j&&j.ok&&j.banner)?j.banner:null; drawPromoLogin(); }).catch(function(){ PROMO_LB=null; drawPromoLogin(); });
    }
    function refreshMode(){
      const d=T[lang];
      document.getElementById("tab-in").textContent=d.tabIn;
      document.getElementById("tab-up").textContent=d.tabUp;
      document.getElementById("submit").textContent=mode==="in"?d.btnIn:d.btnUp;

    function setMode(m){
      mode=m;
      document.getElementById("tab-in").classList.toggle("active",m==="in");
      document.getElementById("tab-up").classList.toggle("active",m==="up");
      document.getElementById("name-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("phone-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("gender-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("dob-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("confirm-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("consent-wrap").classList.toggle("hide",m!=="up");
      document.getElementById("password").autocomplete=m==="in"?"current-password":"new-password";
      msg("");
      refreshMode();
    }
    function msg(t,type){const el=document.getElementById("msg");el.textContent=t||"";el.className="msg"+(type?" "+type:"")}

    function saveCredential(id,password){
      try{
        if(window.PasswordCredential && navigator.credentials){
          const c=new window.PasswordCredential({id:id,password:password,name:id});
          navigator.credentials.store(c).catch(function(){});
        }
      }catch(e){}
    }
    async function doLogin(){
      const d=T[lang];
      try{ Meta.track("Lead", {content_name: mode==="up"?"create_account":"sign_in"}); }catch(e){}
      const email=document.getElementById("email").value.trim();
      const password=document.getElementById("password").value;
      const name=document.getElementById("name").value.trim();
      const phone=document.getElementById("phone").value.trim();
      const birthdate=document.getElementById("birthdate").value;
      if(!email||!password)return msg(d.errFill,"err");
      if(mode==="up"&&!name)return msg(d.errName,"err");
      if(mode==="up"&&!gender)return msg(d.errGender,"err");
      if(mode==="up"&&!birthdate)return msg(d.errDob,"err");
      if(mode==="up"&&password.length<8)return msg(d.errPw,"err");
      if(mode==="up"&&password!==document.getElementById("confirm").value)return msg(d.errMatch,"err");
      if(mode==="up"&&!document.getElementById("consentChk").checked)return msg(d.errConsent,"err");
      const btn=document.getElementById("submit");btn.disabled=true;msg(d.processing,"");
      try{
        if(mode==="up"){
          await Auth.fitcoRegister({name:name,email:email,password:password,phone:phone,gender:gender,date_of_birth:birthdate});
        }
        else{
          try{
            await Auth.fitcoLogin(email,password);
          }catch(e20){
            const m=String((e20&&e20.message)||"").toLowerCase();
            if(m.includes("dikonfigurasi")||m.includes("service key")||m.includes("menghubungi")){ throw e20; }
            await Auth.signIn(email,password);
          }
        }
        saveCredential(email,password);
        await Auth.routeAfterAuth();
      }catch(e){msg(terjemah(e.message),"err");btn.disabled=false}
    }
    function terjemah(m){
      const d=T[lang]; m=(m||"").toLowerCase();
      if(m.includes("invalid login"))return d.errCred;
      if(m.includes("already registered")||m.includes("already been")||m.includes("sudah terdaftar"))return d.errExists;
      if(m.includes("20FIT")&&(m.includes("salah")||m.includes("wrong")))return d.errCred;
      if(m.includes("menghubungi server 20FIT")||m.includes("contact"))return lang==="en"?"Couldn't reach 20FIT. Try again.":"Tidak bisa menghubungi 20FIT. Coba lagi.";
      if(m.includes("password minimal")||(m.includes("password")&&m.includes("8")))return d.errPw;
      if(m.includes("password"))return d.errCred;
      if(m.includes("dikonfigurasi")||m.includes("service key"))return lang==="en"?"20FIT sign-in isn’t ready on the server yet. Try again later.":"Login 20FIT belum aktif di server. Coba lagi nanti.";
      if(m.includes("supabaseurl")||m.includes("not configured")||m.includes("anon"))return lang==="en"?"Server not ready. Refresh in a moment.":"Server belum siap. Coba refresh.";
      if(m.includes("fetch")||m.includes("network"))return lang==="en"?"Connection failed. Try again.":"Koneksi gagal. Coba lagi.";
      return "Error: "+(m||"unknown");
    }

    async function tryAutofill(){
      try{
        if(navigator.credentials && window.PasswordCredential){
          const cred=await navigator.credentials.get({password:true, mediation:"optional"});
          if(cred){
            if(cred.id) document.getElementById("email").value=cred.id;
            if(cred.password) document.getElementById("password").value=cred.password;
          }
        }
      }catch(e){}
    }

    // SSO seamless: token dari app utama 20FIT lewat URL -> langsung masuk.
    async function tryTokenSSO(){
      try{
        const q=new URLSearchParams(location.search);
        let tok=q.get("token")||q.get("access_token")||q.get("fittoken")||q.get("fitco_token");
        if(!tok && location.hash){ const h=new URLSearchParams(location.hash.replace(/^#/,"")); tok=h.get("token")||h.get("access_token"); }
        if(!tok) return false;
        try{ history.replaceState(null,"",location.pathname); }catch(e){}
        msg(lang==="en"?"Signing you in…":"Menyiapkan sesi kamu…","ok");
        await Auth.tokenLogin(tok);
        await Auth.routeAfterAuth();
        return true;
      }catch(e){
        msg(lang==="en"?"Auto sign-in failed — please sign in below.":"Masuk otomatis gagal — silakan masuk di bawah.","err");
        return false;
      }
    }

    // Datang dari calorietracker.20fit.id (Sign In -> login.html?next=calories): simpan tujuan
    // ke sessionStorage SEBELUM Auth.routeAfterAuth() sempat kepanggil, supaya dia tau harus
    // balik ke calorietracker.20fit.id (bukan dashboard) begitu login penuh selesai.
    (function(){
      try{
        const q=new URLSearchParams(location.search);
        if(q.get("next")==="calories") sessionStorage.setItem("post_auth_next","calories");
      }catch(e){}
    })();

    (async function(){
      try{
        await Auth.ready;
        if(await tryTokenSSO()) return;
        Auth.supabase.auth.onAuthStateChange((evt,sess)=>{ if(evt==="SIGNED_IN" && sess && sess.user){ Auth.routeAfterAuth(); } });
        const u=await Auth.getUser();
        if(u){ try{ await Auth.routeAfterAuth(); return; }catch(e){} }
        tryAutofill();
      }catch(e){}
    })();
    try{ if(sessionStorage.getItem("stickyClosed")==="1"){ var _s=document.getElementById("sticky"); if(_s) _s.classList.add("gone"); } }catch(e){}
    applyLang();
    // Prefill dari URL (mis. dari halaman kode saat email belum terdaftar -> dorong Buat Akun)
    (function(){
      try{
        const q=new URLSearchParams(location.search);
        const em=q.get("email"); if(em) document.getElementById("email").value=em;
        if(q.get("mode")==="up"){ setMode("up"); if(em) msg(lang==="en"?"This email has no account yet — create one below.":"Email ini belum punya akun — buat akunnya di bawah ya.","err"); }
      }catch(e){}
    })();

    try{ Meta.track("ViewContent", {content_name:"login"}); }catch(e){}
  </script>
</body>
</html>
