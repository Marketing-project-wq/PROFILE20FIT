<!DOCTYPE html>
<html lang="id">
<head>
<base href="/">
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Upload History · 20FIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --a-bg:var(--bg,#F1F1F4); --a-surface:var(--card,#FFFFFF);
    --a-line:var(--glass-hair,var(--line,#EBEBEF)); --a-txt:var(--txt,#15171C); --a-mut:var(--muted,#8A8D94);
    --accent:var(--blue,#2F6BFF); --ai:var(--fit-red,#E4002B);
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--a-bg);color:var(--a-txt);font-family:var(--sans);padding:20px 16px 100px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto}
  .muted{color:var(--a-mut)}
  .card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--radius,16px);padding:16px}
  .card+.card{margin-top:12px}
  .chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .chead .bk{width:38px;height:38px;border-radius:99px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none;font-size:18px}
  .chead h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px}
  .chead .sub{font-size:13px;color:var(--a-mut);margin-top:2px}
  .skel{background:color-mix(in srgb,var(--a-txt) 7%,transparent);border-radius:10px;animation:pul 1.3s ease-in-out infinite}
  @keyframes pul{0%,100%{opacity:1}50%{opacity:.45}}
  /* Kartu riwayat: seluruh kartu = tautan ke detail analisa */
  .hcard{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit;transition:border-color .2s,transform .12s}
  a.hcard:hover{border-color:color-mix(in srgb,var(--ai) 40%,var(--a-line))}
  a.hcard:active{transform:scale(.995)}
  .hcard .ic{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ai) 12%,transparent);color:var(--ai)}
  .hcard.up .ic{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
  .hcard .bd{flex:1;min-width:0}
  .hcard .dt{font-size:11px;color:var(--a-mut);font-family:var(--mono);font-weight:700}
  .hcard .tt{font-size:15px;font-weight:800;margin-top:2px;line-height:1.3}
  .hcard .hl{font-size:12.5px;color:var(--a-txt);margin-top:7px;line-height:1.5}
  .hcard .lv{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;border:1px solid var(--a-line);color:var(--a-mut);margin-left:6px;font-family:var(--sans);text-transform:uppercase;letter-spacing:.3px}
  .hcard .nx{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;font-weight:700;color:var(--ai);margin-top:7px;line-height:1.45}
  .hcard .nx b{color:var(--a-mut);font-weight:700;white-space:nowrap}
  .hcard .go{flex:none;color:var(--a-mut);font-size:20px;align-self:center}
  .gp{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .fchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--a-line);white-space:nowrap}
  .fchip.baik{background:color-mix(in srgb,var(--green,#1C8A4B) 11%,transparent);border-color:color-mix(in srgb,var(--green,#1C8A4B) 30%,var(--a-line));color:var(--green,#1C8A4B)}
  .fchip.kurang{background:color-mix(in srgb,var(--red,#E4002B) 10%,transparent);border-color:color-mix(in srgb,var(--red,#E4002B) 30%,var(--a-line));color:var(--red,#E4002B)}
  .fchip.berlebih{background:color-mix(in srgb,var(--amber,#D97706) 12%,transparent);border-color:color-mix(in srgb,var(--amber,#D97706) 34%,var(--a-line));color:var(--amber,#B45309)}
  .fchip.eff{color:var(--a-txt)}
  .fchip.read{background:color-mix(in srgb,var(--amber,#D97706) 12%,transparent);border-color:color-mix(in srgb,var(--amber,#D97706) 34%,var(--a-line));color:var(--amber,#B45309)}
  .fchip.read.rendah{background:transparent;color:var(--a-mut);border-style:dashed}
  .fchip.safety{background:var(--red,#E4002B);border-color:var(--red,#E4002B);color:#fff}
  .ins{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 8%,var(--a-surface));border-color:color-mix(in srgb,var(--accent) 25%,var(--a-line));margin-bottom:12px}
  .ins b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);margin-bottom:3px}
  .ins p{margin:0;font-size:13px;line-height:1.5}
  .empty{text-align:center;color:var(--a-mut);font-size:13px;padding:26px 10px;line-height:1.6}
  .empty a{color:var(--ai);font-weight:800;text-decoration:none}
  .empty button{margin-top:10px;padding:8px 16px;border-radius:99px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);font-weight:700;cursor:pointer;font-family:inherit}
</style>
<link rel="stylesheet" href="css/20fit-design-system.css">
<link rel="stylesheet" href="css/glass-app.css">
<script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
</head>
<body>
<div class="wrap">
  <div class="chead">
    <a class="bk" href="/activity" aria-label="Kembali" title="Kembali">‹</a>
    <div>
      <h1 data-en="Upload History" data-id="Riwayat Upload">Riwayat Upload</h1>
      <div class="sub" data-en="Your workouts & what affected your performance" data-id="Workout kamu & apa yang memengaruhi performamu">Workout kamu & apa yang memengaruhi performamu</div>
    </div>
  </div>
  <div id="root"><div class="card"><div class="skel" style="height:80px"></div></div><div class="card"><div class="skel" style="height:80px"></div></div></div>
</div>

<script src="js/vendor-supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/fiticons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script>
(function(){
  function L(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
  function lang(){ return (window.I18N&&I18N.lang==="en")?"en":"id"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function el(id){ return document.getElementById(id); }
  async function apiFetch(path){ var o={headers:{"Content-Type":"application/json"}}; try{var tk=await Auth.token(); if(tk)o.headers.Authorization="Bearer "+tk;}catch(e){} return fetch(path,o); }
  var WO_ICON={ run:"run", walk:"run", cycling:"cycle", swimming:"swim", gym:"dumbbell", hiit:"dumbbell", hyrox:"run", other:"run" };
  var UP_ICON={ sleep:"moon", daily_activity:"steps", weight:"scale", food_log:"meal", other:"chart" };   // ikon js/fiticons.js
  var FACTOR={ sleep:{en:"Sleep",id:"Tidur"}, nutrition:{en:"Nutrition",id:"Nutrisi"}, pre_meal:{en:"Pre-workout meal",id:"Makan sebelum"},
    hydration:{en:"Hydration",id:"Hidrasi"}, load:{en:"Training load",id:"Beban latihan"}, body:{en:"Body",id:"Tubuh"} };
  // Bacaan coach (dugaan penyebab dari pola HR & pace) + intensitas sesi. Faktor tanpa data tidak dikirim server.
  var CAUSE={ short_sleep:{en:"short sleep",id:"kurang tidur"}, low_fuel:{en:"low fuel",id:"kurang bahan bakar"}, dehydration:{en:"low fluids",id:"kurang cairan"},
    heat:{en:"heat",id:"panas"}, high_load:{en:"training load",id:"beban latihan"}, unwell:{en:"not feeling well",id:"kurang fit"}, pacing:{en:"fast start",id:"start terlalu cepat"} };
  var CONF={ tinggi:{en:"high",id:"tinggi"}, sedang:{en:"medium",id:"sedang"}, rendah:{en:"low",id:"rendah"} };
  var EFFORT={ easy:{en:"Easy effort",id:"Intensitas ringan"}, moderate:{en:"Moderate effort",id:"Intensitas sedang"}, hard:{en:"Hard effort",id:"Intensitas berat"} };
  function stLabel(c){
    if(c.status==="berlebih") return c.key==="pre_meal"?L({en:"too close",id:"terlalu dekat"}):c.key==="load"?L({en:"high",id:"tinggi"}):L({en:"too much",id:"berlebih"});
    return c.status==="baik"?L({en:"good",id:"baik"}):L({en:"low",id:"kurang"});
  }
  function fmtDate(s,time){ if(!s) return ""; try{ var d=new Date(String(s).slice(0,10)+"T00:00:00"); if(isNaN(d)) return String(s).slice(0,10);
    return d.toLocaleDateString(lang()==="en"?"en-GB":"id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"})+(time?" · "+time:""); }catch(e){ return String(s).slice(0,10); } }
  function card(it){
    if(it.kind==="upload"){
      return '<div class="card hcard up"><span class="ic">'+FIC(UP_ICON[it.type]||UP_ICON.other,20)+'</span><div class="bd">'+
        '<div class="dt">'+esc(fmtDate(it.date))+(it.source_app?" · "+esc(it.source_app):"")+'</div><div class="tt">'+esc(it.title)+'</div></div></div>';
    }
    var chips=it.safety?'<span class="fchip safety">'+esc(it.safety==="emergency"?L({en:"Seek medical help",id:"Cari pertolongan medis"}):L({en:"See a doctor",id:"Cek ke dokter"}))+'</span>':
      (it.effort?'<span class="fchip eff">'+esc(L(EFFORT[it.effort]))+'</span>':'')+
      (it.reads||[]).map(function(c){ return '<span class="fchip read '+esc(c.confidence)+'">'+esc(L({en:"Coach: ",id:"Coach: "})+L(CAUSE[c.key]||{en:c.key,id:c.key})+" · "+L(CONF[c.confidence]))+'</span>'; }).join("")+
      (it.chips||[]).map(function(c){ return '<span class="fchip '+esc(c.status)+'">'+esc(L(FACTOR[c.key]||{en:c.key,id:c.key}))+' · '+esc(stLabel(c))+'</span>'; }).join("");
    return '<a class="card hcard" href="/activity/history/'+encodeURIComponent(it.id)+'"><span class="ic">'+FIC(WO_ICON[it.type]||"run",20)+'</span><div class="bd">'+
      '<div class="dt">'+esc(fmtDate(it.date,it.started_at))+(it.source_app?" · "+esc(it.source_app):"")+(it.level?'<span class="lv">'+esc(it.level)+'</span>':'')+'</div>'+
      '<div class="tt">'+esc(it.title)+'</div>'+(chips?'<div class="gp">'+chips+'</div>':'')+
      (it.headline?'<div class="hl">'+esc(it.headline)+'</div>':'')+
      (it.next&&it.next.title?'<div class="nx"><b>'+esc(L({en:"Next:",id:"Berikutnya:"}))+'</b><span>'+esc(it.next.title)+'</span></div>':'')+'</div><span class="go" aria-hidden="true">›</span></a>';
  }
  function render(j){
    var root=el("root"), items=(j&&j.items)||[];
    if(!items.length){ root.innerHTML='<div class="card"><div class="empty">'+esc(L({en:"No uploads yet. Upload a workout screenshot on the Activity page to get your first analysis.",id:"Belum ada upload. Upload screenshot workout di halaman Activity untuk dapat analisa pertamamu."}))+'<br><a href="/activity#upload-workout">'+esc(L({en:"Upload now →",id:"Upload sekarang →"}))+'</a></div></div>'; return; }
    var ins=j.insight?'<div class="card ins">'+FIC("chart",20)+'<div><b>'+esc(L({en:"Your pattern",id:"Pola kamu"}))+'</b><p>'+esc(j.insight.text)+'</p></div></div>':'';
    root.innerHTML=ins+items.map(card).join("");
  }
  async function load(){
    var root=el("root");
    try{
      var r=await apiFetch("/api/activity/history?limit=30&lang="+lang()); var j=await r.json().catch(function(){return {};});
      if(r.status===401){ location.href="/login"; return; }
      if(!r.ok) throw new Error();
      render(j);
    }catch(e){
      root.innerHTML='<div class="card"><div class="empty">'+esc(L({en:"Couldn't load history.",id:"Gagal memuat riwayat."}))+'<br><button type="button" id="retry">'+esc(L({en:"Try again",id:"Coba lagi"}))+'</button></div></div>';
      el("retry").onclick=function(){ root.innerHTML='<div class="card"><div class="skel" style="height:80px"></div></div>'; load(); };
    }
  }
  (async function(){
    try{ await Auth.requireAuth(); }catch(e){ location.href="/login"; return; }
    load();
    if(window.I18N&&I18N.onChange) I18N.onChange(load);   // ganti bahasa -> judul & headline ikut
  })();
})();
</script>
</body>
</html>
