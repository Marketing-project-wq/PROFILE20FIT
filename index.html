<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8">
<!-- Jaring pengaman OAuth: kalau redirect balik mendarat di root "/" sambil membawa ?code=/?error=
     (mis. GoTrue jatuh ke Site URL), teruskan ke /auth/callback dengan query+hash UTUH SEBELUM
     meta-refresh ke login.html (yang akan membuang query-nya) supaya penukaran PKCE tetap jalan. -->
<script>(function(){try{var q=new URLSearchParams(location.search);if(q.has("code")||q.has("error")||q.has("error_description")){location.replace("/auth/callback"+location.search+location.hash);}}catch(e){}})();</script>
<meta http-equiv="refresh" content="0; url=./login.html">
<title>20FIT Health Profile</title>
</head>
<body>
<p>Redirecting to <a href="./login.html">20FIT Health Profile</a>...</p>
</body>
</html>
