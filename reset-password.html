<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password · 20FIT</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--red:#C41101;--bg:#EDE8DF;--card:#fff;--dark:#0A0908;--txt:#0A0908;--muted:#9E8E7A;--border:#E8E2DB;--inp:#F0EDE5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px 26px}
  .logo{display:inline-block;background:var(--dark);padding:9px 13px;border-radius:10px}
  .logo img{height:30px;display:block}
  h2{font-family:Anton;font-size:24px;margin:14px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  input{width:100%;padding:13px 14px;background:var(--inp);border:1px solid var(--border);border-radius:11px;font-size:15px;color:var(--txt)}
  input:focus{outline:none;border-color:var(--red)}
  .otp{text-align:center;letter-spacing:8px;font-size:22px}
  .btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(196,17,1,.25)}
  .btn:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
  .msg.err{color:var(--red)}.msg.ok{color:#2A7A4F}
  .link{margin-top:16px;text-align:center;font-size:13px}.link a{color:var(--red);text-decoration:none;font-weight:600}
  .hide{display:none}
  .dev{margin-top:12px;font-size:12px;color:#b07a00;background:#fff6e0;border:1px solid #efe0b0;border-radius:8px;padding:8px;display:none}
</style>
<script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
<link rel="stylesheet" href="css/20fit-design-system.css">
<link rel="stylesheet" href="css/glass-app.css">
</head>
<body>
  <div class="card">
    <div class="logo"><img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT"></div>
    <h2 id="title">Lupa Password</h2>
    <div class="sub" id="sub">Masukkan email kamu, kami kirim kode verifikasi.</div>

    <!-- Step 1: minta kode -->
    <div id="step1">
      <label id="lblEmail">Email</label>
      <input id="email" type="email" placeholder="nama@email.com" autocomplete="email" />
      <button class="btn" id="btn1" onclick="sendCode()">Kirim Kode</button>
    </div>

    <!-- Step 2: kode + password baru -->
    <div id="step2" class="hide">
      <label id="lblCode">Kode dari Email</label>
      <input id="code" class="otp" inputmode="numeric" maxlength="6" placeholder="------" />
      <label id="lblPassword">Password Baru (min 8 karakter)</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" />
      <button class="btn" id="btn2" onclick="resetPw()">Simpan Password Baru</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="dev" id="dev"></div>
    <div class="link"><a id="backLink" href="login.html">← Kembali ke Masuk</a></div>
  </div>

  <script src="js/i18n.js"></script>
  <script>
    // Lupa/reset password lewat API 20FIT (akun yang sama dengan app 20FIT).
    let theEmail = "";
    let step = 1; // 1 = minta kode, 2 = kode + password baru
    function msg(t,type){const e=document.getElementById("msg");e.textContent=t||"";e.className="msg"+(type?" "+type:"")}
    // Render semua teks statis sesuai bahasa aktif (dipanggil saat load & saat toggle EN/ID).
    function applyLang(){
      document.getElementById("lblEmail").textContent = L({en:"Email",id:"Email"});
      document.getElementById("email").placeholder = L({en:"name@email.com",id:"nama@email.com"});
      document.getElementById("btn1").textContent = L({en:"Send Code",id:"Kirim Kode"});
      document.getElementById("lblCode").textContent = L({en:"Code from Email",id:"Kode dari Email"});
      document.getElementById("lblPassword").textContent = L({en:"New Password (min 8 characters)",id:"Password Baru (min 8 karakter)"});
      document.getElementById("btn2").textContent = L({en:"Save New Password",id:"Simpan Password Baru"});
      document.getElementById("backLink").textContent = L({en:"← Back to Sign In",id:"← Kembali ke Masuk"});
      if(step===1){
        document.getElementById("title").textContent = L({en:"Forgot Password",id:"Lupa Password"});
        document.getElementById("sub").textContent = L({en:"Enter your email and we'll send a verification code.",id:"Masukkan email kamu, kami kirim kode verifikasi."});
      }else{
        document.getElementById("title").textContent = L({en:"Enter Code",id:"Masukkan Kode"});
        document.getElementById("sub").textContent = L({en:"Code sent to "+theEmail+". Check your email.",id:"Kode dikirim ke "+theEmail+". Cek email kamu."});
      }
    }
    async function api(path,body){
      const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      let j={}; try{ j=await r.json(); }catch(e){}
      if(!r.ok) throw new Error(j.error||L({en:"Failed ("+r.status+")",id:"Gagal ("+r.status+")"}));
      return j;
    }
    async function sendCode(){
      const email=document.getElementById("email").value.trim();
      if(!email)return msg(L({en:"Enter your email first.",id:"Isi email dulu."}),"err");
      const b=document.getElementById("btn1");b.disabled=true;msg(L({en:"Sending code...",id:"Mengirim kode..."}),"");
      try{
        await api("/api/fitco-forgot",{email});
        theEmail=email;
        step=2;
        document.getElementById("step1").classList.add("hide");
        document.getElementById("step2").classList.remove("hide");
        applyLang();
        msg(L({en:"Code sent! Check your email.",id:"Kode terkirim! Cek email."}),"ok");
      }catch(e){msg(e.message,"err");b.disabled=false}
    }
    async function resetPw(){
      const code=document.getElementById("code").value.trim();
      const password=document.getElementById("password").value;
      if(!code)return msg(L({en:"Enter the code from your email.",id:"Isi kode dari email."}),"err");
      if(password.length<8)return msg(L({en:"Password must be at least 8 characters.",id:"Password minimal 8 karakter."}),"err");
      const b=document.getElementById("btn2");b.disabled=true;msg(L({en:"Saving...",id:"Menyimpan..."}),"");
      try{
        await api("/api/fitco-reset",{email:theEmail,otp:code,password});
        msg(L({en:"Password changed! Redirecting to Sign In...",id:"Password berhasil diubah! Mengarahkan ke Masuk..."}),"ok");
        setTimeout(()=>location.href="login.html",1500);
      }catch(e){msg(e.message,"err");b.disabled=false}
    }
    applyLang();
    I18N.onChange(applyLang);
  </script>
  <script src="js/pw-toggle.js"></script>
</body>
</html>
