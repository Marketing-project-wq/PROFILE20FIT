<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book Doctor · 20FIT</title>
<style>
  :root{--red:#C41101;--bg:#F3F2F0;--card:#FFFFFF;--line:#E8E2DB;--txt:#1A1714;--ink:#16170F;--muted:#8A7C68;--inp:#F0EDE5;--dark:#000;--pagetx:#16170F;--green:#2A7A4F;--shadow:0 2px 12px rgba(0,0,0,.10)}
  html:not(.theme-light){ --bg:#0C0D10;--card:#17191F;--line:#25272E;--txt:#F4F5F7;--ink:#F4F5F7;--muted:#8E9198;--inp:#23262E;--pagetx:#F4F5F7 }
  *{box-sizing:border-box} a{text-decoration:none}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--pagetx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 18px 96px}
  .wrap{max-width:560px;margin:0 auto}
  .logobar{background:var(--dark);border-radius:16px;padding:13px 18px;margin-bottom:16px;display:flex;align-items:center}
  .logobar img{height:34px}
  h1{font-size:24px;font-weight:900;margin:0 0 6px;text-transform:uppercase}
  .lead{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.5}
  .note{background:color-mix(in srgb,var(--red) 8%,transparent);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;margin:0 0 16px}
  .sec-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px}
  .svc{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;margin-bottom:10px}
  .svc.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
  .svc input{margin-top:3px;flex:0 0 auto;accent-color:var(--red)}
  .svc .nm{font-weight:800;font-size:15px;color:var(--ink)}
  .svc .pr{color:var(--red);font-weight:800;font-size:14px;margin-top:2px}
  .svc .ds{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  label.fld{display:block;font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 6px}
  input[type=date],textarea{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:14px}
  textarea{min-height:88px;resize:vertical}
  .btn{width:100%;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px;font-family:inherit}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:13px;line-height:1.5}
  .msg.err{color:var(--red)} .msg.ok{color:var(--green)}
  .state{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 20px;text-align:center;color:var(--muted);font-size:13px}
  .skel{height:78px;border-radius:14px;background:linear-gradient(90deg,var(--inp),color-mix(in srgb,var(--inp) 55%,#fff),var(--inp));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .retry{margin-top:12px;border:1px solid var(--red);color:var(--red);background:transparent;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .ok-box{background:var(--card);border:1.5px solid var(--green);border-radius:14px;padding:22px;text-align:center}
  .ok-box .code{font-family:ui-monospace,monospace;font-weight:800;font-size:16px;margin-top:6px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logobar"><img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT" /></div>
    <h1 id="pgTitle">Book Doctor</h1>
    <p class="lead" id="pgLead"></p>
    <div class="note" id="pgNote"></div>
    <div id="root"></div>
  </div>

  <script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
  <script src="js/vendor-supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script>
  (function(){
    "use strict";
    var TXT = {
      title:{en:"Book Doctor",id:"Book Dokter"},
      lead:{en:"Request a doctor consultation. Pick a service, your preferred date, and describe your concern.",
            id:"Ajukan konsultasi dokter. Pilih layanan, tanggal yang diinginkan, dan ceritakan keluhanmu."},
      note:{en:"This is a request — our clinic team confirms the schedule and doctor after you submit. You'll be notified.",
            id:"Ini permintaan — tim klinik yang mengonfirmasi jadwal dan dokternya setelah kamu kirim. Kamu akan diberi tahu."},
      pickSvc:{en:"Choose service",id:"Pilih layanan"},
      dateLbl:{en:"Preferred date",id:"Tanggal diinginkan"},
      compLbl:{en:"Your concern (optional)",id:"Keluhan singkat (opsional)"},
      compPh:{en:"e.g. lower back pain after training…",id:"mis. nyeri punggung bawah setelah latihan…"},
      submit:{en:"Send request",id:"Kirim permintaan"},
      loadErr:{en:"Couldn't load services.",id:"Gagal memuat layanan."},
      retry:{en:"Try again",id:"Coba lagi"},
      needSvc:{en:"Please choose a service.",id:"Pilih layanan dulu ya."},
      needDate:{en:"Please pick a date.",id:"Pilih tanggal dulu ya."},
      sending:{en:"Sending…",id:"Mengirim…"},
      okTitle:{en:"Request sent!",id:"Permintaan terkirim!"},
      okSub:{en:"Our clinic team will confirm your schedule and doctor. Reference:",id:"Tim klinik akan mengonfirmasi jadwal & dokter. Nomor referensi:"},
      okMore:{en:"Book another",id:"Ajukan lagi"}
    };
    function LL(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
    function rp(n){ return "Rp " + (Number(n)||0).toLocaleString("id-ID"); }
    var $ = function(id){ return document.getElementById(id); };
    async function apiFetch(path, opts){ opts=opts||{}; opts.headers=opts.headers||{"Content-Type":"application/json"};
      try{ var tk=await Auth.token(); if(tk) opts.headers["Authorization"]="Bearer "+tk; }catch(e){} return fetch(path, opts); }

    var SERVICES=null, SEL=null, STATE="loading";
    function applyStatic(){ $("pgTitle").textContent=LL(TXT.title); $("pgLead").textContent=LL(TXT.lead); $("pgNote").textContent=LL(TXT.note); document.title=LL(TXT.title)+" · 20FIT"; }
    function todayStr(){ var d=new Date(); var p=function(n){return(n<10?"0":"")+n;}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }

    function render(){
      var root=$("root"); if(!root) return;
      if(STATE==="loading"){ root.innerHTML='<div class="sec-t">'+LL(TXT.pickSvc)+'</div><div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
      if(STATE==="error"){ root.innerHTML='<div class="state">'+LL(TXT.loadErr)+'<br><button class="retry" id="rt">'+LL(TXT.retry)+'</button></div>'; var b=$("rt"); if(b)b.onclick=load; return; }
      if(STATE&&STATE.okCode){ root.innerHTML='<div class="ok-box"><div style="font-weight:900;font-size:18px">'+LL(TXT.okTitle)+'</div><div style="color:var(--muted);font-size:13px;margin-top:6px">'+LL(TXT.okSub)+'</div><div class="code">'+esc(STATE.okCode)+'</div><button class="retry" id="again" style="margin-top:16px">'+LL(TXT.okMore)+'</button></div>'; var ag=$("again"); if(ag)ag.onclick=function(){ SEL=null; STATE="ready"; render(); }; return; }
      // ready
      var cards=(SERVICES||[]).map(function(s){
        var on=(SEL===s.id);
        return '<label class="svc'+(on?' sel':'')+'"><input type="radio" name="svc" value="'+esc(s.id)+'"'+(on?' checked':'')+'>'
          +'<span><span class="nm">'+esc(s.name)+'</span><span class="pr">'+rp(s.price)+'</span>'
          +(s.description?'<span class="ds">'+esc(s.description)+'</span>':'')+'</span></label>';
      }).join("");
      root.innerHTML='<div class="sec-t">'+LL(TXT.pickSvc)+'</div>'+cards
        +'<label class="fld">'+LL(TXT.dateLbl)+'</label><input type="date" id="dt" min="'+todayStr()+'">'
        +'<label class="fld">'+LL(TXT.compLbl)+'</label><textarea id="cmp" placeholder="'+esc(LL(TXT.compPh))+'"></textarea>'
        +'<button class="btn" id="send">'+LL(TXT.submit)+'</button><div class="msg" id="m"></div>';
      root.querySelectorAll('input[name=svc]').forEach(function(r){ r.addEventListener("change",function(){ SEL=this.value; render(); }); });
      $("send").addEventListener("click", submit);
    }
    async function submit(){
      var m=$("m"), btn=$("send");
      if(!SEL){ m.className="msg err"; m.textContent=LL(TXT.needSvc); return; }
      var dt=$("dt")?$("dt").value:""; if(!dt){ m.className="msg err"; m.textContent=LL(TXT.needDate); return; }
      var cmp=$("cmp")?$("cmp").value:"";
      btn.disabled=true; m.className="msg"; m.textContent=LL(TXT.sending);
      try{
        var r=await apiFetch("/api/book/doctor-request",{method:"POST",body:JSON.stringify({service_id:SEL,preferred_date:dt,complaint:cmp})});
        var j=await r.json().catch(function(){return null;});
        if(!r.ok||!j||!j.ok){ m.className="msg err"; m.textContent=(j&&j.error)||LL(TXT.loadErr); btn.disabled=false; return; }
        STATE={okCode:j.booking_code}; render();
      }catch(e){ m.className="msg err"; m.textContent=LL(TXT.loadErr); btn.disabled=false; }
    }
    async function load(){
      STATE="loading"; render();
      try{
        var r=await apiFetch("/api/clinic/doctor-services");
        var j=await r.json().catch(function(){return null;});
        if(!r.ok||!j||!j.ok){ STATE="error"; render(); return; }
        SERVICES=j.services||[]; STATE="ready"; render();
      }catch(e){ STATE="error"; render(); }
    }
    (async function(){
      try{ if(window.Auth&&Auth.requireAuth) await Auth.requireAuth(); }catch(e){}
      applyStatic();
      if(window.I18N&&I18N.onChange) I18N.onChange(function(){ applyStatic(); render(); });
      load();
    })();
  })();
  </script>
</body>
</html>
