<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Book a personal session · 20FIT</title>
<link rel="preconnect" href="https://media.20fit.id">
<style>
  :root{--red:#C41101;--bg:#F3F2F0;--card:#FFFFFF;--line:#E8E2DB;--txt:#1A1714;--ink:#16170F;--muted:#8A7C68;--inp:#F0EDE5;--dark:#000;--pagetx:#16170F;--green:#2A7A4F;--amber:#C87000;--shadow:0 2px 12px rgba(0,0,0,.10)}
  html:not(.theme-light){ --bg:#0C0D10;--card:#17191F;--line:#25272E;--txt:#F4F5F7;--ink:#F4F5F7;--muted:#8E9198;--inp:#23262E;--pagetx:#F4F5F7 }
  *{box-sizing:border-box} a{text-decoration:none;color:inherit}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--pagetx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 18px 96px}
  .wrap{max-width:900px;margin:0 auto}
  .logobar{background:var(--dark);border-radius:16px;padding:13px 18px;margin-bottom:16px;display:flex;align-items:center}
  .logobar img{height:34px}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
  h1{font-size:26px;font-weight:900;margin:0 0 4px;letter-spacing:-.01em}
  .lead{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
  /* Filter chips (gaya mockup: All aktif = gelap; lain = putih + titik warna + jumlah) */
  .tfilters{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .tchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 15px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .tchip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
  .tchip .dot{width:8px;height:8px;border-radius:99px;flex:none}
  /* Carousel kartu coach/dokter */
  .tcar{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;margin:0 -2px;-webkit-overflow-scrolling:touch}
  .tcar::-webkit-scrollbar{height:6px}
  .tcar::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
  .tcard{flex:0 0 212px;width:212px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 14px 15px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
  @media(max-width:520px){ .tcard{flex-basis:70vw;width:70vw;max-width:260px} }
  .tbadge{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#fff;border-radius:6px;padding:3px 8px}
  .tbadge.coach{background:var(--red)}
  .tbadge.doctor{background:#2F6BFF}
  .tbadge.physiotherapist{background:#0EA5A5}
  .tav{width:96px;height:96px;border-radius:99px;overflow:hidden;background:var(--inp);margin:16px 0 12px;position:relative}
  .tav img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .tav .ini{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:30px}
  .tnm{font-weight:800;font-size:17px;color:var(--ink);line-height:1.2;overflow-wrap:anywhere}
  .tsp{font-size:13px;color:var(--muted);margin-top:3px;min-height:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tbook{margin-top:14px;width:100%;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-radius:12px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;text-align:center}
  .tbook:hover{background:color-mix(in srgb,var(--red) 20%,transparent)}
  .state{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);font-size:13px}
  .retry{margin-top:12px;border:1px solid var(--red);color:var(--red);background:transparent;border-radius:10px;padding:9px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .skel{background:linear-gradient(90deg,var(--inp),color-mix(in srgb,var(--inp) 55%,#fff),var(--inp));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* ── Upcoming Classes (di bawah carousel) ── */
  .upcoming{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  .uc-h{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .uc-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
  .uc-main{min-width:0}
  .uc-nm{font-size:14.5px;font-weight:800;color:var(--ink);margin:0;display:flex;align-items:center;gap:8px}
  .uc-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .uc-meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .uc-when{font-size:12px;color:var(--muted);margin-top:2px}
  .uc-right{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .uc-slots{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .uc-slots.low{color:#F97316}
  .uc-slots.full{color:var(--red)}
  .uc-book{padding:7px 15px;background:var(--red);color:#fff;border-radius:9px;font-size:12px;font-weight:800;white-space:nowrap}
  .uc-reason{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  @media(max-width:520px){ .uc-card{flex-direction:column;align-items:stretch} .uc-right{justify-content:space-between} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logobar"><img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT" /></div>
    <a class="back" href="/dashboard">← <span data-en="Home" data-id="Beranda">Home</span></a>
    <h1 id="pgTitle">Book a personal session</h1>
    <p class="lead" id="pgLead"></p>
    <div class="tfilters" id="roleFilters" hidden></div>
    <div id="root"></div>
    <div id="upcoming" class="upcoming" hidden></div>
  </div>

  <script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
  <script src="js/vendor-supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script>
  (function(){
    "use strict";
    var TXT={
      title:{en:"Book a personal session",id:"Book sesi personal"},
      lead:{en:"With our coaches & doctors — tap a card to book.",id:"Bareng coach & dokter kami — ketuk kartu untuk booking."},
      loadErr:{en:"Couldn't load the team.",id:"Gagal memuat tim."},
      retry:{en:"Try again",id:"Coba lagi"},
      empty:{en:"No team members available right now.",id:"Belum ada anggota tim saat ini."},
      book:{en:"Book session",id:"Book sesi"}
    };
    // Label chip (singular, gaya mockup). Physio dipertahankan kalau ada datanya.
    var CHIP_LBL={ "":{en:"All",id:"Semua"}, coach:{en:"Coach",id:"Coach"}, doctor:{en:"Doctor",id:"Dokter"}, physiotherapist:{en:"Physio",id:"Fisio"} };
    var BADGE_LBL={ coach:{en:"Coach",id:"Coach"}, doctor:{en:"Doctor",id:"Dokter"}, physiotherapist:{en:"Physio",id:"Fisio"} };
    var DOT={ coach:"var(--red)", doctor:"#2F6BFF", physiotherapist:"#0EA5A5" };
    var GRP_ORDER=["coach","doctor","physiotherapist"];
    function LL(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
    var $=function(id){return document.getElementById(id);};
    var PAL=["#C41101","#2A7A4F","#2F6BFF","#7c5cff","#C87000","#0EA5A5","#B0308A","#4A5568"];
    function initials(n){ var p=String(n||"").trim().split(/\s+/); var a=(p[0]||"")[0]||"", b=(p.length>1?(p[p.length-1][0]||""):""); return (a+b).toUpperCase()||"?"; }
    function colorFor(n){ var s=String(n||""),h=0; for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0; return PAL[h%PAL.length]; }
    function hrefFor(p){ if(p.role==="coach")return "/book-coach?coach="+encodeURIComponent(p.id); if(p.role==="doctor")return "/book-doctor"; if(p.role==="physiotherapist")return "/classes?venue=clinic"; return "#"; }

    var TEAM=null, STATE="loading", ROLE="";

    function applyStatic(){
      $("pgTitle").textContent = LL(TXT.title);
      $("pgLead").textContent = LL(TXT.lead);
    }

    function avatarInner(name, photo){
      var color=colorFor(name);
      if(photo) return '<img src="'+esc(photo)+'" alt="'+esc(name)+'" loading="lazy" decoding="async" onerror="this.style.display=\'none\';var n=this.nextElementSibling;if(n)n.style.display=\'grid\'"><span class="ini" style="display:none;background:'+color+'">'+esc(initials(name))+'</span>';
      return '<span class="ini" style="background:'+color+'">'+esc(initials(name))+'</span>';
    }
    function card(p){
      var badge='<span class="tbadge '+esc(p.role)+'">'+esc(LL(BADGE_LBL[p.role]||{en:p.role,id:p.role}))+'</span>';
      return '<div class="tcard">'+badge+
        '<div class="tav">'+avatarInner(p.name,p.photo_url)+'</div>'+
        '<div class="tnm">'+esc(p.name)+'</div>'+
        '<div class="tsp">'+esc(p.speciality||"")+'</div>'+
        '<a class="tbook" href="'+esc(hrefFor(p))+'">'+esc(LL(TXT.book))+'</a></div>';
    }

    function buildChips(){
      if(!TEAM||!TEAM.length){ $("roleFilters").hidden=true; return; }
      var counts={ "":TEAM.length };
      GRP_ORDER.forEach(function(r){ counts[r]=TEAM.filter(function(p){return p.role===r;}).length; });
      var order=[""].concat(GRP_ORDER.filter(function(r){ return counts[r]>0; }));
      $("roleFilters").hidden=false;
      $("roleFilters").innerHTML=order.map(function(r){
        var d=(r&&DOT[r])?'<span class="dot" style="background:'+DOT[r]+'"></span>':'';
        return '<button class="tchip" data-role="'+r+'" aria-pressed="'+(r===ROLE)+'">'+d+esc(LL(CHIP_LBL[r]||{en:r,id:r}))+' · '+counts[r]+'</button>';
      }).join("");
      $("roleFilters").querySelectorAll("button").forEach(function(b){
        b.onclick=function(){ ROLE=b.getAttribute("data-role")||""; buildChips(); render(); };
      });
    }

    function render(){
      var root=$("root");
      if(STATE==="loading"){ root.innerHTML='<div class="tcar">'+[0,0,0,0].map(function(){return '<div class="tcard" style="border:0;box-shadow:none;background:transparent"><div class="tav skel"></div><div class="skel" style="height:16px;width:70%;border-radius:6px;margin-top:6px"></div><div class="skel" style="height:38px;width:100%;border-radius:12px;margin-top:14px"></div></div>';}).join("")+'</div>'; return; }
      if(STATE==="error"){ root.innerHTML='<div class="state">'+esc(LL(TXT.loadErr))+'<br><button class="retry" id="rtry">'+esc(LL(TXT.retry))+'</button></div>'; var rb=$("rtry"); if(rb)rb.onclick=load; return; }
      var list=(TEAM||[]).filter(function(p){ return !ROLE || p.role===ROLE; });
      if(!list.length){ root.innerHTML='<div class="state">'+esc(LL(TXT.empty))+'</div>'; return; }
      root.innerHTML='<div class="tcar">'+list.map(card).join("")+'</div>';
    }

    async function load(){
      STATE="loading"; render();
      try{
        var r=await fetch("/api/team?include_bio=1");
        var j=await r.json().catch(function(){return null;});
        if(!j||!j.ok){ STATE="error"; render(); return; }
        TEAM=j.team||[]; STATE="ready";
        buildChips(); render();
      }catch(e){ STATE="error"; render(); }
    }

    // ── Upcoming Classes (flat lintas arena+gym) — /api/classes/upcoming ──
    var UPC=null;
    function ucLoc(){ return (window.I18N && I18N.lang==="en")?"en-US":"id-ID"; }
    function venueLbl(src){ return src==="gym"?"Gym":(src==="arena"?"Arena":src); }
    function reasonLbl(r){ return r==="full"?LL({en:"Full",id:"Penuh"}):(r==="passed"?LL({en:"Passed",id:"Lewat"}):LL({en:"Closed",id:"Ditutup"})); }
    function fmtWhen(dateStr,start,end){
      var d=new Date(dateStr+"T"+(start||"00:00")+":00+07:00");
      var ds=d.toLocaleDateString(ucLoc(),{weekday:"short",day:"numeric",month:"short"});
      return ds+" · "+(start||"")+(end?("–"+end):"");
    }
    function ucCard(c){
      var coachName=c.coach?c.coach.name:(c.instructor||"");
      var meta=esc(coachName)+(coachName?" · ":"")+esc(venueLbl(c.source));
      var slots="";
      if(c.remaining!=null){
        var sc=c.remaining<=0?"full":(c.remaining<=3?"low":"");
        var stx=c.remaining<=0?LL({en:"Full",id:"Penuh"}):(c.remaining+" "+LL({en:"left",id:"sisa"}));
        slots='<span class="uc-slots '+sc+'">'+esc(stx)+'</span>';
      }
      var action=c.selectable
        ? '<a class="uc-book" href="'+esc(c.book_url)+'">'+esc(LL({en:"Book",id:"Book"}))+'</a>'
        : (c.reason==="full" ? "" : '<span class="uc-reason">'+esc(reasonLbl(c.reason))+'</span>');
      return '<div class="uc-card"><div class="uc-main">'+
        '<div class="uc-nm"><span class="uc-dot" style="background:'+esc(c.color||"#C41101")+'"></span>'+esc(c.name||"Kelas")+'</div>'+
        '<div class="uc-meta">'+meta+'</div>'+
        '<div class="uc-when">'+esc(fmtWhen(c.date,c.start,c.end))+'</div>'+
        '</div><div class="uc-right">'+slots+action+'</div></div>';
    }
    function renderUpcoming(){
      var wrap=$("upcoming"); if(!wrap) return;
      if(!UPC||!UPC.length){ wrap.hidden=true; wrap.innerHTML=""; return; }
      wrap.innerHTML='<div class="uc-h">'+esc(LL({en:"Upcoming Classes",id:"Kelas Mendatang"}))+'</div>'+UPC.map(ucCard).join("");
      wrap.hidden=false;
    }
    async function loadUpcoming(){
      try{
        var r=await fetch("/api/classes/upcoming?days=14&limit=30");
        var j=await r.json().catch(function(){return null;});
        UPC=(j&&j.ok&&Array.isArray(j.classes))?j.classes:[];
      }catch(e){ UPC=[]; }
      renderUpcoming();
    }

    applyStatic(); load(); loadUpcoming();
    if(window.I18N && I18N.onChange) I18N.onChange(function(){ applyStatic(); buildChips(); render(); renderUpcoming(); });
  })();
  </script>
</body>
</html>
