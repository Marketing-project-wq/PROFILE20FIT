<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event · 20FIT</title>
<link rel="stylesheet" href="css/ticket-wallet.css">
<style>
  :root{--red:#C41101;--bg:#0b0b0c;--card:#FFFFFF;--line:#E8E2DB;--txt:#0A0908;--ink:#16170F;--muted:#8A7C68;--inp:#F0EDE5;--dark:#000;--pagetx:#EDE8DF;--shadow:0 2px 12px rgba(0,0,0,.14)}
  html:not(.theme-light){ --bg:#0C0D10;--pagetx:#F4F5F7;--dark:#000 }
  *{box-sizing:border-box}
  a{text-decoration:none}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--pagetx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 18px 96px}
  .wrap{max-width:560px;margin:0 auto}
  @media(min-width:900px){ .wrap{max-width:860px} }
  .logobar{background:var(--dark);border-radius:16px;padding:13px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .logobar img{height:34px}
  h1{font-size:26px;font-weight:900;margin:0 0 6px;text-transform:uppercase}
  .lead{color:var(--pagetx);opacity:.85;font-size:14px;margin:0 0 18px;line-height:1.5}
  /* Halaman Event = varian SPACIOUS dari komponen Ticket Wallet: pakai kartu/tab/grid yang SAMA
     (css/ticket-wallet.css), hanya container lebih lapang. Tak ada CSS kartu yang disalin ke sini. */
  #eventRoot .twk-tabs{max-width:420px}
  #eventRoot .twk-grid{margin-top:16px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logobar"><img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT" /></div>
    <h1 id="pgTitle">Event</h1>
    <p class="lead" id="pgLead"></p>
    <div id="eventRoot"><!-- diisi komponen Ticket Wallet (varian grid) --></div>
  </div>

  <script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
  <script src="js/vendor-supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ticket-wallet.js"></script>
  <script src="js/nav.js"></script>
  <script>
  (function(){
    "use strict";
    // Halaman /event dan widget dashboard memakai SATU komponen (js/ticket-wallet.js).
    // Di sini kita hanya: pasang teks halaman, tempel TicketWallet.renderInner (varian "grid"
    // yang lebih lapang), dan minta modul memuat data (tiket + katalog event) sekaligus.
    var TXT = {
      title: { en:"Events & Tickets", id:"Event & Tiket" },
      lead:  { en:"Your 20FIT tickets and upcoming events, races & community sessions — all in one place.",
               id:"Tiket 20FIT kamu dan event, race & sesi komunitas mendatang — semua di satu tempat." }
    };
    function LL(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
    var $ = function(id){ return document.getElementById(id); };

    function applyStatic(){
      $("pgTitle").textContent = LL(TXT.title);
      $("pgLead").textContent  = LL(TXT.lead);
      document.title = LL(TXT.title)+" · 20FIT";
    }
    function renderPage(){
      var root = $("eventRoot"); if(!root) return;
      root.innerHTML = (window.TicketWallet && window.TicketWallet.renderInner)
        ? window.TicketWallet.renderInner({ layout:"grid" }) : "";
    }

    (async function(){
      try{ if(window.Auth && Auth.requireAuth) await Auth.requireAuth(); }catch(e){}
      applyStatic();
      if(window.I18N && I18N.onChange) I18N.onChange(function(){ applyStatic(); renderPage(); });
      if(window.TicketWallet){
        window.TicketWallet.onRender(renderPage);   // re-render tiap data/tab berubah
        renderPage();                               // gambar awal (skeleton)
        window.TicketWallet.init({ eagerUpcoming:true }); // muat tiket + katalog event
      }
    })();
  })();
  </script>
</body>
</html>
