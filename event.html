<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event · 20FIT</title>
<style>
  :root{--red:#C41101;--bg:#0b0b0c;--card:#FFFFFF;--line:#E8E2DB;--txt:#0A0908;--muted:#8A7C68;--inp:#F0EDE5;--dark:#000;--pagetx:#EDE8DF;--green:#2A7A4F;--amber:#C87000}
  html:not(.theme-light){ --bg:#0C0D10;--pagetx:#F4F5F7;--dark:#000 }
  *{box-sizing:border-box}
  a{text-decoration:none}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--pagetx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 18px 96px}
  .wrap{max-width:560px;margin:0 auto}
  @media(min-width:900px){ .wrap{max-width:720px} }
  .logobar{background:var(--dark);border-radius:16px;padding:13px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .logobar img{height:34px}
  h1{font-size:24px;font-weight:900;margin:0 0 6px;text-transform:uppercase}
  .lead{color:var(--pagetx);opacity:.85;font-size:14px;margin:0 0 18px;line-height:1.5}

  /* Kartu event (dipakai saat API sudah menyediakan data) */
  .elist{display:flex;flex-direction:column;gap:12px}
  .ecard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;color:var(--txt);box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .ecard .et{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--red);text-transform:uppercase}
  .ecard .en{font-size:16px;font-weight:900;margin:3px 0 4px;line-height:1.2}
  .ecard .es{font-size:12.5px;color:var(--muted);line-height:1.45}

  /* State cards: upcoming / empty / loading / error */
  .state{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:34px 22px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.25)}
  .state .ic{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:grid;place-items:center;background:color-mix(in srgb,var(--red) 12%,transparent)}
  .state .ic svg{width:28px;height:28px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .state .tt{font-size:17px;font-weight:900;margin-bottom:6px}
  .state .sub{font-size:13px;color:var(--muted);line-height:1.5;max-width:360px;margin:0 auto}
  .state .pill{display:inline-block;margin-bottom:14px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:999px;padding:5px 12px}
  .state .retry{margin-top:16px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--red);color:var(--red);background:transparent;border-radius:12px;padding:10px 16px;font-weight:800;font-size:13px;cursor:pointer}
  .state.load .ic{background:var(--inp)}
  .state.load .ic svg{stroke:var(--muted);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logobar"><img src="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" alt="20FIT" /></div>
    <h1 id="pgTitle">Event</h1>
    <p class="lead" id="pgLead"></p>
    <div id="eventRoot"><!-- state dirender oleh JS --></div>
  </div>

  <script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
  <script src="js/vendor-supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/nav.js"></script>
  <script>
  (function(){
    "use strict";
    // ---- LAYER TEKS (i18n) — terpisah dari logic. Placeholder copy TIDAK ditulis di
    //      dalam fungsi render; render hanya membaca dari EVENT_TXT. ----
    var EVENT_TXT = {
      title:   { en:"Event", id:"Event" },
      lead:    { en:"20FIT events, races & community sessions — all in one place.",
                 id:"Event, race & sesi komunitas 20FIT — semua di satu tempat." },
      loading: { en:"Loading events…", id:"Memuat event…" },
      upcomingPill: { en:"Upcoming", id:"Segera Hadir" },
      upcomingTitle:{ en:"Events are on the way", id:"Event akan segera hadir" },
      upcomingSub:  { en:"We're lining up 20FIT events for you. Check back here soon — this page will list dates, venues & sign-ups.",
                      id:"Kami sedang menyiapkan event 20FIT untukmu. Cek lagi di sini — halaman ini akan menampilkan tanggal, lokasi & pendaftaran." },
      emptyTitle:{ en:"No upcoming events", id:"Belum ada event terdekat" },
      emptySub:  { en:"There are no scheduled events right now. New events will appear here.",
                   id:"Belum ada event terjadwal saat ini. Event baru akan muncul di sini." },
      errTitle:  { en:"Couldn't load events", id:"Gagal memuat event" },
      errSub:    { en:"Something went wrong. Please try again.", id:"Terjadi kesalahan. Coba lagi." },
      retry:     { en:"Try again", id:"Coba lagi" }
    };

    // ---- LAYER DATA — satu-satunya tempat sumber data. Saat API Event tersedia,
    //      cukup ganti isi fetch() ke pemanggilan endpoint (mis. GET /api/events),
    //      bentuk kembalian tetap { status, events }. TIDAK memanggil endpoint karangan. ----
    var EventData = {
      // status: "upcoming" (API belum ada) | "ok" (ada data) | "empty" (API ada, 0 event)
      fetch: function(){
        // TODO(API): ganti dengan:
        //   var r = await apiFetch("/api/events"); var j = await r.json();
        //   return { status: (j.events&&j.events.length)?"ok":"empty", events: j.events||[] };
        return Promise.resolve({ status: "upcoming", events: [] });
      }
    };

    // Pemanggil API terautentikasi (pola sama halaman lain) — siap dipakai saat wiring.
    async function apiFetch(path){
      var opts={headers:{"Content-Type":"application/json"}};
      try{ var tk=await Auth.token(); if(tk) opts.headers["Authorization"]="Bearer "+tk; }catch(e){}
      return fetch(path, opts);
    }

    function LL(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
    var $ = function(id){ return document.getElementById(id); };
    var ICON = {
      cal:  '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      empty:'<path d="M21 15V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9"/><path d="M16 19h6M3 9h18"/>',
      err:  '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>',
      load: '<path d="M21 12a9 9 0 1 1-6.2-8.5"/>'
    };
    function stateCard(cls, icon, pill, tt, sub, withRetry){
      return '<div class="state '+cls+'">'+
        (pill?'<div class="pill">'+pill+'</div>':'')+
        '<div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">'+icon+'</svg></div>'+
        '<div class="tt">'+tt+'</div>'+
        '<div class="sub">'+sub+'</div>'+
        (withRetry?'<button class="retry" id="evRetry"><svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>'+LL(EVENT_TXT.retry)+'</button>':'')+
      '</div>';
    }
    function eventCard(ev){
      return '<div class="ecard">'+
        '<div class="et">'+(ev.date||"")+(ev.venue?(' · '+ev.venue):"")+'</div>'+
        '<div class="en">'+(ev.title||"")+'</div>'+
        (ev.desc?'<div class="es">'+ev.desc+'</div>':'')+
      '</div>';
    }

    function applyStatic(){
      $("pgTitle").textContent = LL(EVENT_TXT.title);
      $("pgLead").textContent  = LL(EVENT_TXT.lead);
      document.title = LL(EVENT_TXT.title)+" · 20FIT";
    }

    function render(model){
      var root = $("eventRoot");
      if(!root) return;
      if(model.state === "loading"){
        root.innerHTML = stateCard("load", ICON.load, "", LL(EVENT_TXT.loading), "", false);
      } else if(model.state === "error"){
        root.innerHTML = stateCard("err", ICON.err, "", LL(EVENT_TXT.errTitle), LL(EVENT_TXT.errSub), true);
        var b=$("evRetry"); if(b) b.onclick = load;
      } else if(model.state === "ok"){
        root.innerHTML = '<div class="elist">'+model.events.map(eventCard).join("")+'</div>';
      } else if(model.state === "empty"){
        root.innerHTML = stateCard("empty", ICON.empty, "", LL(EVENT_TXT.emptyTitle), LL(EVENT_TXT.emptySub), false);
      } else { // "upcoming" — API belum ada
        root.innerHTML = stateCard("up", ICON.cal, LL(EVENT_TXT.upcomingPill), LL(EVENT_TXT.upcomingTitle), LL(EVENT_TXT.upcomingSub), false);
      }
    }

    var CUR = { state:"loading", events:[] };
    async function load(){
      CUR = { state:"loading", events:[] }; render(CUR);
      try{
        var res = await EventData.fetch();
        if(res && res.status === "ok" && res.events && res.events.length){ CUR = { state:"ok", events:res.events }; }
        else if(res && res.status === "empty"){ CUR = { state:"empty", events:[] }; }
        else { CUR = { state:"upcoming", events:[] }; }
      }catch(e){ CUR = { state:"error", events:[] }; }
      render(CUR);
    }

    (async function(){
      try{ if(window.Auth && Auth.requireAuth) await Auth.requireAuth(); }catch(e){}
      applyStatic();
      if(window.I18N && I18N.onChange) I18N.onChange(function(){ applyStatic(); render(CUR); });
      load();
    })();
  })();
  </script>
</body>
</html>
