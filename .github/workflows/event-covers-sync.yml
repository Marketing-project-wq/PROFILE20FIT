name: Sync event covers

# Memanggil endpoint server POST /api/cron/sync-event-covers (menarik cover event dari
# TICKET_API → Supabase Storage → isi cover_url). Rahasia CRON_SECRET dibaca dari
# GitHub Secrets (repo Settings → Secrets and variables → Actions), TIDAK pernah ditulis di kode.
#
# - workflow_dispatch: jalankan manual; pilih target (staging/production) & mode (debug/run).
#     debug  → panggil ?debug=1 (tanpa mengunggah) untuk memeriksa bentuk data & field cover.
#     run    → sinkronisasi sungguhan (mengisi cover_url + synced_at).
# - schedule: sinkronisasi production tiap hari (Langkah 4: sinkronisasi berkelanjutan).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment"
        type: choice
        required: true
        default: production
        options: [staging, production]
      mode:
        description: "debug (cek bentuk data, tanpa unggah) atau run (sinkron sungguhan)"
        type: choice
        required: true
        default: debug
        options: [debug, run]
  schedule:
    - cron: "0 21 * * *"   # 04:00 WIB (21:00 UTC) tiap hari → production

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET belum di-set di GitHub Secrets (repo Settings → Secrets and variables → Actions)."
            exit 1
          fi
          TARGET="${{ github.event.inputs.target || 'production' }}"
          MODE="${{ github.event.inputs.mode || 'run' }}"
          if [ "$TARGET" = "staging" ]; then
            BASE="https://profile20fit-staging.up.railway.app"
          else
            BASE="https://my.20fit.id"
          fi
          URL="$BASE/api/cron/sync-event-covers"
          if [ "$MODE" = "debug" ]; then URL="$URL?debug=1"; fi
          echo "POST $URL  (target=$TARGET mode=$MODE)"
          # -s tenang, -S tampilkan error, tulis HTTP code di baris terakhir. Body dicetak ke log
          # (isi event = data publik marketing; CRON_SECRET hanya di header, tak dicetak).
          HTTP=$(curl -sS -o response.json -w "%{http_code}" -X POST "$URL" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" --max-time 120)
          echo "HTTP $HTTP"
          echo "----- response -----"
          cat response.json || true
          echo
          echo "--------------------"
          if [ "$HTTP" -ge 300 ]; then
            echo "::error::Endpoint mengembalikan HTTP $HTTP"
            exit 1
          fi
