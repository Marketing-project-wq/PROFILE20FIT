<!DOCTYPE html>
<html lang="id">
<head>
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Medical Record · 20FIT</title>
<style>
  /* ===== 20FIT Medical Record — new visual design (re-skin only) =====
     Every JS-emitted class hook (.card/.ch/.param/.find/.ohstat/.prow/.achrow/.rfull …)
     and all wired ids (#mcufile/#result/#list) & the whole <script> are unchanged.
     Cards stay light in both themes so AI-generated result text remains readable. */
  :root{
    --red:#C41101;--red-ink:#B01C2E;--red-soft:#FCEBED;
    --amber:#C87000;--amber-soft:#FDF1E2;--amber-ink:#9A5D12;
    --blue:#2563eb;--blue-soft:#EAF1FF;--green:#2A7A4F;--green-soft:#E6F6EE;--green-ink:#1B7A4D;
    --card:#FFFFFF;--txt:#15171C;--ink:#15171C;--muted:#8A8D94;--faint:#B7B9BF;--line:#EBEBEF;--inp:#F2F2F5;
    --bg:#F3F2F0;--pagetx:#15171C;--dark:#141414;
    --radius-lg:22px;--radius:14px;
    --shadow:0 1px 2px rgba(16,18,22,.04),0 8px 26px rgba(16,18,22,.05);
  }
  /* Dark = app toggle removes .theme-light. Keep cards light for readable AI content. */
  html:not(.theme-light){ --bg:#0C0D10;--pagetx:#F4F5F7;--dark:#000 }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--pagetx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:20px 16px 96px;
    -webkit-font-smoothing:antialiased;transition:background .3s ease}
  .wrap{max-width:640px;margin:0 auto}
  @media(min-width:900px){ .wrap{max-width:1000px} }
  a{text-decoration:none}

  /* ---- Hero header ---- */
  .hero{position:relative;padding:8px 4px 6px;margin:2px 0 8px}
  .hero .kick{color:var(--red);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
  h1{font-size:31px;font-weight:800;margin:2px 2px 4px;letter-spacing:-.03em;line-height:1.04;text-transform:none}
  .muted{color:var(--muted);font-size:13px}

  /* ---- Card ---- */
  .card{background:var(--card);color:var(--txt);border:0;border-radius:var(--radius-lg);padding:20px;margin-top:14px;box-shadow:var(--shadow)}

  /* ---- Upload ---- */
  .up{border:1.5px dashed color-mix(in srgb,var(--red) 40%,var(--line));background:color-mix(in srgb,var(--red-soft) 55%,var(--card));text-align:center;cursor:pointer;transition:.15s}
  .up:active{transform:scale(.99)}
  .up .ic{width:50px;height:50px;border-radius:15px;background:var(--card);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;box-shadow:var(--shadow)}
  .up .ic svg{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn{margin-top:12px;padding:13px 20px;border:0;border-radius:var(--radius);background:var(--red);color:#fff;font-weight:800;font-size:14px;cursor:pointer;
    box-shadow:0 8px 20px color-mix(in srgb,var(--red) 26%,transparent)}

  /* ---- Consult banner (static, data-i18n) ---- */
  .consultbn{display:flex;align-items:center;gap:14px;margin-top:14px;padding:18px;border-radius:var(--radius-lg);
    background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
  .consultbn .cbic{width:46px;height:46px;border-radius:13px;background:var(--red-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .consultbn .cbic svg{width:24px;height:24px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .consultbn .cbt{font-weight:800;font-size:16px}
  .consultbn .cbs{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  .cbbtn{flex:0 0 auto;background:var(--red);color:#fff;border-radius:12px;padding:12px 16px;font-weight:750;font-size:13px;text-decoration:none;white-space:nowrap;
    box-shadow:0 8px 20px color-mix(in srgb,var(--red) 26%,transparent)}
  @media(max-width:560px){ .consultbn{flex-wrap:wrap} .cbbtn{width:100%;text-align:center} }

  /* ---- Dynamic result grid ---- */
  #result{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
  #result .card{margin-top:0}
  .rfull{grid-column:1/-1}
  @media(min-width:900px){ #result{grid-template-columns:1fr 1fr} }

  /* section header inside result cards */
  .ch{font-weight:800;font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
  .ch svg{width:19px;height:19px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* overall summary tiles */
  .ohrow{display:flex;gap:0;margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ohstat{flex:1;padding:14px 8px;text-align:center;position:relative}
  .ohstat + .ohstat::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--line)}
  .ohstat .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .ohstat .v{font-weight:800;font-size:22px;margin-top:6px;letter-spacing:-.02em}

  /* parameter rows */
  .param{padding:13px 0;border-bottom:1px solid var(--line)}
  .param:last-child{border-bottom:0}
  .param .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .param .ph b{font-weight:700;font-size:14.5px;letter-spacing:-.01em}
  .param .pv{font-weight:800;display:flex;align-items:center;gap:6px;font-size:15px}
  .dot{width:9px;height:9px;border-radius:999px;flex:0 0 auto}

  /* findings */
  .find{border-left:3px solid;border-radius:12px;padding:13px 15px;margin-top:10px;background:var(--inp)}
  .find .ft{font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sevtag{font-size:9px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}

  /* plan bullet rows */
  .plan{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5}
  .plan:last-child{border-bottom:0}
  .plan .pi{width:28px;height:28px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px}

  /* bookable program rows */
  .prow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .prow:last-child{border-bottom:0}
  .prow .pn{font-weight:700;font-size:14.5px;letter-spacing:-.01em}.prow .pd{font-size:12px;color:var(--muted);margin-top:1px}
  .bookchip{flex:0 0 auto;background:var(--red);color:#fff;border:0;border-radius:11px;padding:9px 15px;font-weight:750;font-size:12px;text-decoration:none;cursor:pointer}
  .bookchip.clinic{background:var(--blue)}


  /* shop banner (affiliate) */
  .shopbn{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--radius-lg);color:var(--txt);
    background:linear-gradient(150deg,var(--green-soft),var(--card));box-shadow:var(--shadow)}
  .shopbn .cbic{width:46px;height:46px;border-radius:13px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow)}
  .shopbn .cbic svg{width:24px;height:24px;fill:none;stroke:var(--green);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .shopbn .cbt{font-weight:800;font-size:16px}.shopbn .cbs{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  @media(max-width:560px){ .shopbn{flex-wrap:wrap} .shopbn .cbbtn{width:100%;text-align:center} }

  /* book buttons + history rows */
  .bookbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px;border:0;border-radius:var(--radius);background:var(--red);color:#fff;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;
    box-shadow:0 8px 20px color-mix(in srgb,var(--red) 24%,transparent)}
  .bookbtn.alt{background:var(--inp);color:var(--txt);box-shadow:none}
  .bookbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .rec{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .rec:last-child{border-bottom:0}
  .grade{width:40px;height:40px;border-radius:12px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}
  .seemore{flex:0 0 auto;color:var(--red);font-weight:800;font-size:12px;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .soon{display:inline-block;font-size:12px;background:var(--inp);color:var(--muted);padding:6px 14px;border-radius:999px;margin-top:6px;font-weight:700}
  .emi{width:1.05em;height:1.05em;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;flex:0 0 auto}
  /* Toggle "Semua MCU" + catatan setelah scan */
  .mcu-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;color:var(--txt);font-weight:800;font-size:15px;cursor:pointer;padding:2px 0;text-align:left}
  .mcu-toggle .mcu-chev{width:20px;height:20px;flex:0 0 auto;transition:transform .2s}
  .mcu-toggle.open .mcu-chev{transform:rotate(180deg)}
  .mcu-list{margin-top:10px}
  .mcu-note{display:flex;align-items:center;gap:10px;margin-top:14px;padding:13px 15px;border-radius:14px;border:1px solid #bfe3cd;background:#eef8f1;color:#1d6b41;font-weight:700;font-size:13.5px;cursor:pointer}
  /* Modal detail hasil MCU dari history */
  .mcu-bg{position:fixed;inset:0;z-index:200;background:rgba(10,12,16,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 14px}
  .mcu-bg.open{display:flex}
  .mcu-modal{width:100%;max-width:720px;background:var(--card,#fff);color:var(--txt);border-radius:20px;padding:0;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:mcuUp .28s cubic-bezier(.2,.85,.25,1);margin:auto}
  @keyframes mcuUp{from{transform:translateY(16px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .mcu-hd{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--card,#fff);border-bottom:1px solid var(--line);border-radius:20px 20px 0 0}
  .mcu-hd h3{margin:0;font-size:16px;font-weight:800}
  .mcu-body{padding:16px 20px 22px}
  /* Banner terjemahan AI: disclaimer + tombol lihat asli/terjemahan (atau peringatan fallback) */
  .tbanner{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:11px 15px;border-radius:14px;background:var(--blue-soft);color:#1d3a8a;font-size:12.5px;font-weight:600;line-height:1.4;box-shadow:var(--shadow)}
  .tbanner.warn{background:#fbf3df;color:#8a6d1a}
  .tbanner span{flex:1;min-width:180px}
  .tlink{flex:0 0 auto;border:0;background:transparent;color:var(--red);font-weight:800;font-size:12.5px;cursor:pointer;text-decoration:none;padding:4px 2px}
  .tlink:hover{opacity:.75}
  .mcu-body .tbanner{margin-bottom:14px}
</style>

<body>

    <div class="card up" onclick="document.getElementById('mcufile').click()">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg></div>
      <div style="font-weight:800;font-size:16px;margin-top:2px" data-i18n="med_upload">Upload Medical Check-Up</div>

    <div class="consultbn">

      <div style="flex:1">
        <div class="cbt" data-i18n="med_consult_t">Talk to a 20FIT doctor</div>

      </div>

    </div>

    <div id="result"></div>

    <!-- Catatan setelah scan: arahkan ke toggle "Semua MCU" -->
    <div id="mcuScanNote" class="mcu-note" style="display:none" onclick="openAllMcu()"></div>

    <!-- Toggle tunggal: semua MCU (collapsible). Hasil baru langsung masuk di atas, tanpa refresh. -->

      <button type="button" id="mcuToggle" class="mcu-toggle" onclick="toggleAllMcu()" aria-expanded="false">

  <!-- Pop-up detail hasil MCU dari history -->

  <script src="js/vendor-supabase.js"></script>

  <script src="js/tour.js"></script>
  <script src="js/meta-pixel.js"></script>
  <script>try{ Meta.track("View Medical"); }catch(e){}</script>
  <script>
    const AI_URL="https://cpvzwqptzcxnwzfzgrmt.supabase.co/functions/v1/my20fit-ai";
    const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwdnp3cXB0emN4bnd6Znpncm10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzE0MzksImV4cCI6MjA5MTIwNzQzOX0.DIP-tTFxa3GHMhT6b1Tq-Zz0a24P-vbU9ixEtITbqpI";
    let user=null, history=[], profile=null;
    function readData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
    // Perkecil gambar sebelum dikirim -> upload & OCR jauh lebih cepat (PDF dilewati)
    function fileURL(f){
      if(!String(f.type).startsWith("image/"))return readData(f);
      return new Promise(async(resolve)=>{
        try{
          const dataUrl=await readData(f);
          const img=new Image();
          img.onload=()=>{
            const MAX=1500; let{width:w,height:h}=img;
            if(Math.max(w,h)>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
            const c=document.createElement("canvas");c.width=w;c.height=h;
            c.getContext("2d").drawImage(img,0,0,w,h);
            resolve(c.toDataURL("image/jpeg",0.8));
          };
          img.onerror=()=>resolve(dataUrl);
          img.src=dataUrl;
        }catch(e){resolve(await readData(f));}
      });
    }
    // Muat PDF.js sekali (dari CDN) untuk render PDF -> gambar
    function loadScript(src){return new Promise((res,rej)=>{if([].some.call(document.scripts,s=>s.src===src))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load fail"));document.head.appendChild(s);});}
    // PDF (sering hasil scan & berat) -> render maksimal 3 halaman jadi 1 JPEG kecil -> upload cepat
    async function pdfToImage(f){
      await loadScript("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
      const pdfjsLib=window.pdfjsLib||window["pdfjs-dist/build/pdf"];
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const buf=await f.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      const n=Math.min(pdf.numPages,3);
      const canvases=[];let W=0,H=0;
      for(let i=1;i<=n;i++){
        const page=await pdf.getPage(i);
        let vp=page.getViewport({scale:1});
        const scale=Math.min(1400/vp.width,2.2);
        vp=page.getViewport({scale});
        const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
        await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        canvases.push(c);W=Math.max(W,c.width);H+=c.height;
      }
      const big=document.createElement("canvas");big.width=W;big.height=H;
      const g=big.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
      let y=0;for(const c of canvases){g.drawImage(c,0,y);y+=c.height;}
      return big.toDataURL("image/jpeg",0.82);
    }

    async function analyzeMCU(e){
      const f=e.target.files[0];if(!f)return;
      const box=document.getElementById("result");
      // Hanya izinkan file medical check-up: foto (image) atau PDF — tolak selain itu
      const okType=String(f.type||"").startsWith("image/")||String(f.type||"").includes("pdf");
      if(!okType){ box.innerHTML='<div class="card" style="color:var(--red)">'+L({en:"Only a medical check-up file is allowed — a photo (JPG/PNG) or PDF.",id:"Hanya file medical check-up yang boleh — foto (JPG/PNG) atau PDF."})+'</div>'; e.target.value=""; return; }
      const sig="mcu_"+(f.name||"")+"_"+f.size+"_"+(f.lastModified||0);
      // Kalau file yang sama pernah dianalisa -> tampilkan instan tanpa panggil AI lagi
      try{const cached=localStorage.getItem(sig);if(cached){showResult(JSON.parse(cached));e.target.value="";return;}}catch(e0){}
      box.innerHTML='<div class="card"><div class="muted">'+I18N.t("med_analysing")+'</div></div>';
      let url,mime;
      try{
        if(String(f.type).includes("pdf")){
          try{ url=await pdfToImage(f); mime="image/jpeg"; }
          catch(e2){ url=await fileURL(f); mime=f.type; } // fallback: kirim PDF mentah
        }else{ url=await fileURL(f); mime=f.type; }
      }catch(e3){ box.innerHTML='<div class="card" style="color:var(--red)">'+L({en:"Couldn't read the file. Try another.",id:"Gagal membaca file. Coba file lain."})+'</div>'; e.target.value=""; return; }
      try{
        const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),90000);
        const r=await fetch(AI_URL,{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json","Authorization":"Bearer "+ANON,"apikey":ANON},body:JSON.stringify({action:"mcu",file:url,mime:mime,lang:I18N.lang})});
        clearTimeout(to);
        const j=await r.json();
        if(!r.ok||!j.result)throw new Error((j.error||L({en:"Failed to analyse document",id:"Gagal menganalisa dokumen"}))+(j.detail?" — "+j.detail:""));
        j.result._lang=I18N.lang;
        showResult(j.result);
        try{localStorage.setItem(sig,JSON.stringify(j.result));}catch(e1){}
        // Simpan 2 BAHASA: terjemahkan ke bahasa satunya (teks saja; angka/nilai IDENTIK) lalu ikut
        // disimpan sebagai result._alt -> toggle EN/ID instan & history langsung benar. Kalau gagal,
        // biarkan 1 bahasa (fallback terjemah saat toggle tetap jalan).
        try{
          var _oth=(I18N.lang==="id")?"en":"id";
          var _alt=await aiTranslate(_oth, j.result);
          if(_alt){ var _altm=mergeTrans(j.result,_alt); _altm._lang=_oth; j.result._alt=_altm; transCache[_oth]=_altm; try{localStorage.setItem(sig,JSON.stringify(j.result));}catch(e8){} }
        }catch(e9){}
        // Simpan ke akun (Supabase). Kalau GAGAL, kasih tahu user — jangan diam-diam hilang saat refresh.
        let saveErr=null;
        const nowISO=new Date().toISOString();

    function mergeTrans(base, tr){
      if(!tr || typeof tr!=="object") return base;

    function openHistory(i){
      const r=history[i]; if(!r||!r.result) return;
      mBase=r.result; mCache={}; mOriginal=false; mFailed=false; mId=(r.id!=null)?r.id:null;
      mDate=(r.analyzed_at||r.created_at||"").slice(0,10);
      seedCache(mCache,mBase);
      modalTitle(mBase);
      const bg=document.getElementById("mcuModalBg"); bg.classList.add("open");
      bg.scrollTop=0; document.body.style.overflow="hidden";
      translateModal();
    }
    // Render isi pop-up sesuai state: banner (bila terjemahan) + hasil. Angka/nilai tetap.
    function renderModalBody(){
      const base=mBase; const body=document.getElementById("mcuModalBody"); if(!base||!body) return;
      const src=srcLang(base), want=I18N.lang;
      let res, banner="";
      if(want===src){ res=base; }
      else if(mFailed){ res=base; banner=tbannerHTML(true,L(T_UNAVAIL)); }
      else if(mOriginal){ res=base; banner=tbannerHTML(false,L(T_DISCLAIMER),"viewModalTrans()",L(T_VIEWTRANS)); }
      else if(mCache[want]){ res=mCache[want]; banner=tbannerHTML(false,L(T_DISCLAIMER),"viewModalOriginal()",L(T_VIEWORIG)); }
      else { res=base; }
      modalTitle(res);
      body.innerHTML=banner+buildResultHTML(res);
    }
    function viewModalOriginal(){ mOriginal=true; renderModalBody(); }
    function viewModalTrans(){ mOriginal=false; renderModalBody(); }
    // Terjemahkan pop-up ke bahasa aktif (cache + persist ke result.i18n record ini). Gagal -> tampil asli.
    async function translateModal(){
      const base=mBase; if(!base) return;
      const src=srcLang(base), want=I18N.lang;
      mFailed=false;
      if(want===src||mCache[want]){ renderModalBody(); return; }
      renderModalBody(); // sementara tampil sumber
      const res=await aiTranslate(want,base);
      if(!isModalOpen()||mBase!==base||I18N.lang!==want) return;
      if(res){ const m=mergeTrans(base,res); m._lang=want; mCache[want]=m; persistTrans(mId,base,want,m); renderModalBody(); }
      else { mFailed=true; renderModalBody(); }
    }
    function closeMcuModal(){ document.getElementById("mcuModalBg").classList.remove("open"); document.body.style.overflow=""; }
    (function(){ var bg=document.getElementById("mcuModalBg"); if(bg) bg.addEventListener("click",function(e){ if(e.target===bg) closeMcuModal(); });
      document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeMcuModal(); }); })();
    // Panggil AI translate: terjemahkan STRUKTUR hasil ke `lang` (hanya TEKS/label — angka & nilai
    // hasil pemeriksaan tetap, karena ini menerjemahkan output analisa yang sama, bukan analisa ulang).
    async function aiTranslate(lang, data){
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),45000);
      try{
        const r=await fetch(AI_URL,{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json","Authorization":"Bearer "+ANON,"apikey":ANON},body:JSON.stringify({action:"translate",lang:lang,data:data})});
        clearTimeout(to);
        const j=await r.json();
        return (r.ok&&j&&j.result)?j.result:null;
      }catch(e){ clearTimeout(to); return null; }
    }
    (async function(){
      user=await Auth.requireAuth();
      try{ profile=await Auth.getProfile(); }catch(e){ profile=null; }
      var _lst=document.getElementById("list"); if(_lst) _lst.innerHTML='<div class="empty">'+L({en:"Loading your history…",id:"Memuat riwayat…"})+'</div>';
      await loadHistory(); renderList();
      // Setelah refresh: tampilkan otomatis hasil TERBARU dari DB (bukan upload lama)
      if(history[0]&&history[0].result){ showResult(history[0].result,true,history[0].id); }
    })();
    I18N.onChange(()=>{ renderList(); if(baseRes)translateMain(true); if(isModalOpen())translateModal(); });
  </script>
</body>
