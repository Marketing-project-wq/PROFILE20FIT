<!DOCTYPE html>
<html lang="id">
<head>
<base href="/">
<link rel="icon" type="image/png" href="https://media.20fit.id/wp-content/uploads/2026/05/Copy-of-new-logo-20fit-putih-3.png" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analisa Workout · 20FIT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --a-bg:var(--bg,#F1F1F4); --a-surface:var(--card,#FFFFFF);
    --a-line:var(--glass-hair,var(--line,#EBEBEF)); --a-txt:var(--txt,#15171C); --a-mut:var(--muted,#8A8D94);
    --accent:var(--blue,#2F6BFF); --ai:var(--fit-red,#E4002B);
    --ok:var(--fit-green,#1C8A4B); --bad:var(--red,#E4002B); --warn:var(--fit-amber,#D97706);
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--a-bg);color:var(--a-txt);font-family:var(--sans);padding:20px 16px 100px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto}
  .muted{color:var(--a-mut)}
  .card{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--radius,16px);padding:16px}
  .card+.card,.sec+.card{margin-top:12px}
  .sec{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--a-mut);margin:22px 2px 8px}
  .chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .chead .bk{width:38px;height:38px;border-radius:99px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);display:flex;align-items:center;justify-content:center;text-decoration:none;flex:none;font-size:18px}
  .chead h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.3px;line-height:1.25}
  .chead .sub{font-size:12.5px;color:var(--a-mut);margin-top:3px;font-family:var(--mono);font-weight:700}
  .skel{background:color-mix(in srgb,var(--a-txt) 7%,transparent);border-radius:10px;animation:pul 1.3s ease-in-out infinite}
  @keyframes pul{0%,100%{opacity:1}50%{opacity:.45}}
  .acts{display:flex;flex-wrap:wrap;gap:8px}
  .b{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:11px;border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none}
  .b.pri{background:var(--ai);border-color:var(--ai);color:#fff}
  .b.dng{color:var(--bad)}
  .b:disabled{opacity:.5;cursor:default}
  .note{font-size:12px;color:var(--a-mut);margin-top:10px;line-height:1.5}
  /* metrik */
  .mx{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
  .mx>div{padding:11px 12px;border-radius:12px;background:color-mix(in srgb,var(--a-txt) 4.5%,transparent)}
  .mx .k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--a-mut)}
  .mx .v{font-size:18px;font-weight:800;font-family:var(--mono);margin-top:3px}
  .mx .v small{font-size:11px;color:var(--a-mut);font-weight:700}
  .zb{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin-top:12px;background:color-mix(in srgb,var(--a-txt) 8%,transparent)}
  .zl{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11px;color:var(--a-mut);font-family:var(--mono)}
  .zl i{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px}
  table.sp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px;font-family:var(--mono)}
  table.sp th{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--a-mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--a-line)}
  table.sp td{padding:5px 6px;border-bottom:1px solid var(--a-line)}
  /* performa */
  .pf{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .pf .big{font-size:28px;font-weight:800;font-family:var(--mono);line-height:1}
  .pf .lb{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--a-mut);margin-bottom:5px}
  .delta{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
  .delta.down{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
  .delta.up{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}
  .delta.eq{background:color-mix(in srgb,var(--a-txt) 7%,transparent);color:var(--a-mut)}
  .chart{width:100%;height:110px;margin-top:14px;display:block;overflow:visible}
  .chart .ln{fill:none;stroke:color-mix(in srgb,var(--a-txt) 35%,transparent);stroke-width:2}
  .chart .pt{fill:var(--a-surface);stroke:color-mix(in srgb,var(--a-txt) 45%,transparent);stroke-width:2}
  .chart .pt.cur{fill:var(--ai);stroke:var(--ai)}
  .chart .av{stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1.5}
  .chart text{font-size:10px;fill:var(--a-mut);font-family:var(--mono)}
  .chart-cap{font-size:11px;color:var(--a-mut);margin-top:4px}
  /* faktor */
  .fx{display:grid;grid-template-columns:1fr;gap:10px}
  @media(min-width:640px){ .fx{grid-template-columns:1fr 1fr} }
  .fc{display:flex;flex-direction:column;gap:7px}
  .fc-h{display:flex;align-items:center;gap:9px}
  .fc-ic{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--a-txt) 6%,transparent)}
  .fc-n{font-weight:800;font-size:14px;flex:1}
  .fc p{margin:0;font-size:13px;line-height:1.5}
  .fchip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid var(--a-line);white-space:nowrap}
  .fchip.baik{background:color-mix(in srgb,var(--ok) 11%,transparent);border-color:color-mix(in srgb,var(--ok) 30%,var(--a-line));color:var(--ok)}
  .fchip.kurang{background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 30%,var(--a-line));color:var(--bad)}
  .fchip.berlebih{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 34%,var(--a-line));color:var(--warn)}
  .fchip.tidak_ada_data{border-style:dashed;color:var(--a-mut)}
  .fc.baik .fc-ic{color:var(--ok)} .fc.kurang .fc-ic{color:var(--bad)} .fc.berlebih .fc-ic{color:var(--warn)} .fc.tidak_ada_data{border-style:dashed}
  .infl{font-size:11.5px;font-weight:700;color:var(--a-mut)}
  .infl b{color:var(--a-txt)}
  .fform{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .fform input{width:110px;padding:8px 10px;border-radius:9px;border:1px solid var(--a-line);background:var(--a-bg);color:var(--a-txt);font-family:inherit;font-size:13.5px}
  /* coach */
  .co-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .co-h b{display:block;font-size:15px}
  .co-h span{font-size:11.5px;color:var(--a-mut)}
  .co p{margin:0 0 10px;font-size:14px;line-height:1.6}
  .co .src{font-size:11.5px;color:var(--a-mut);display:flex;align-items:center;gap:6px}
  .typing{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
  .typing i{width:5px;height:5px;border-radius:99px;background:var(--a-mut);animation:pul 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
  ul.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  ul.tips li{display:flex;gap:10px;font-size:13.5px;line-height:1.5}
  ul.tips li:before{content:"";flex:none;width:7px;height:7px;border-radius:99px;background:var(--ai);margin-top:7px}
  .safe{background:color-mix(in srgb,var(--bad) 8%,var(--a-surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--a-line))}
  .safe h2{margin:0 0 8px;font-size:16px;color:var(--bad)}
  .safe p{margin:0 0 8px;font-size:13.5px;line-height:1.55}
  .empty{text-align:center;color:var(--a-mut);font-size:13px;padding:26px 10px;line-height:1.6}
  /* dialog */
  dialog{border:1px solid var(--a-line);background:var(--a-surface);color:var(--a-txt);border-radius:16px;padding:18px;max-width:440px;width:94%;max-height:90vh;overflow:auto;font-family:var(--sans)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog label{display:block;font-size:12px;font-weight:700;color:var(--a-mut);margin:10px 0 4px}
  dialog input,dialog select,dialog textarea{width:100%;padding:10px;border-radius:9px;border:1px solid var(--a-line);background:var(--a-bg);color:var(--a-txt);font-family:inherit;font-size:14px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:8px}
  .shots img{width:100%;border-radius:12px;display:block;margin-bottom:10px}
</style>
<link rel="stylesheet" href="css/20fit-design-system.css">
<link rel="stylesheet" href="css/glass-app.css">
<link rel="stylesheet" href="css/coach-profiles.css">
<script>try{var _t=localStorage.getItem('theme')||'light';var _h=document.documentElement;_h.setAttribute('data-theme',_t);if(_t!=='dark')_h.classList.add('theme-light');}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.add('theme-light');}</script>
</head>
<body>
<div class="wrap">
  <div class="chead">
    <a class="bk" href="/activity/history" aria-label="Kembali" title="Kembali">‹</a>
    <div style="min-width:0"><h1 id="hT" data-en="Workout analysis" data-id="Analisa workout">Analisa workout</h1><div class="sub" id="hS"></div></div>
  </div>
  <div id="root"><div class="card"><div class="skel" style="height:90px"></div></div><div class="card"><div class="skel" style="height:160px"></div></div></div>
</div>
<dialog id="edDlg"></dialog>
<dialog id="shotDlg"></dialog>

<script src="js/vendor-supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/fiticons.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/workout-metrics.js"></script>
<script src="js/coach-profiles.js"></script>
<script>
(function(){
  var WM=window.WorkoutMetrics;
  var ID=decodeURIComponent((location.pathname.match(/\/activity\/history\/([^\/?#]+)/)||[])[1]||"");
  var S={ w:null, a:null, n:null, pending:false, coach:"nando", emergency:null };
  function L(o){ return (window.L?window.L(o):(o&&(o.id||o.en)))||""; }
  function lang(){ return (window.I18N&&I18N.lang==="en")?"en":"id"; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function el(id){ return document.getElementById(id); }
  async function api(path,opt){
    opt=opt||{}; opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{});
    try{ var tk=await Auth.token(); if(tk) opt.headers.Authorization="Bearer "+tk; }catch(e){}
    var r=await fetch(path,opt); var j=await r.json().catch(function(){return {};});
    if(r.status===401){ location.href="/login"; throw new Error("401"); }
    return {ok:r.ok,status:r.status,j:j};
  }
  function dec(n,d){ return WM.dec(+n,d==null?1:d,lang()); }
  function fmtDay(ymd,opt){ try{ return new Date(ymd+"T00:00:00").toLocaleDateString(lang()==="en"?"en-GB":"id-ID",opt||{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }catch(e){ return ymd; } }
  function addDays(ymd,n){ var d=new Date(ymd+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
  function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  try{ var cp=localStorage.getItem("my20fit_coach_pick"); if(cp&&window.CoachProfiles&&CoachProfiles.NAME[cp]) S.coach=cp; }catch(e){}

  var FACTOR={ sleep:[{en:"Sleep",id:"Tidur"},"moon"], nutrition:[{en:"Nutrition (day before)",id:"Nutrisi kemarin"},"meal"],
    pre_meal:[{en:"Pre-workout meal",id:"Makan sebelum latihan"},"clock"], hydration:[{en:"Hydration",id:"Hidrasi"},"water"],
    load:[{en:"Training load",id:"Beban latihan"},"dumbbell"], body:[{en:"Body condition",id:"Kondisi tubuh"},"scale"] };
  function stLabel(f){
    if(f.status==="tidak_ada_data") return L({en:"not logged",id:"belum dicatat"});
    if(f.status==="berlebih") return f.key==="pre_meal"?L({en:"too close",id:"terlalu dekat"}):f.key==="load"?L({en:"high",id:"tinggi"}):L({en:"too much",id:"berlebih"});
    return f.status==="baik"?L({en:"good",id:"baik"}):L({en:"low",id:"kurang"});
  }

  // ---------- render ----------
  function head(){
    var w=S.w, when=fmtDay(w.date)+(w.started_at?" · "+w.started_at:""), src=w.source_app||(w.source==="manual"?L({en:"manual",id:"manual"}):"");
    el("hT").textContent=w.title; el("hS").textContent=when+(src?" · "+src:"");
    document.title=w.title+" · 20FIT";
    var dcNote="";
    if(w.date_check&&w.date_check.reason){
      var seen=w.date_check.text||(w.date_check.read?fmtDay(w.date_check.read,{day:"numeric",month:"short",year:"numeric"}):null);
      dcNote='<div class="note">'+FIC("calendar",13)+' '+esc(L({en:"Date confirmed by you",id:"Tanggal dikonfirmasi olehmu"})+(seen?" ("+L({en:"screenshot read: ",id:"terbaca di screenshot: "})+seen+")":"")+".")+'</div>';
    }
    return '<div class="card"><div class="acts">'+
      (w.screenshots.length?'<button type="button" class="b" id="bShots">'+FIC("image",15)+' '+esc(L({en:"Original screenshot",id:"Screenshot asli"}))+(w.screenshots.length>1?" ("+w.screenshots.length+")":"")+'</button>':'')+
      '<button type="button" class="b" id="bEdit">'+FIC("edit",15)+' '+esc(L({en:"Edit data",id:"Edit data"}))+'</button></div>'+dcNote+
      (w.note?'<div class="note">'+FIC("chat",13)+' '+esc(w.note)+'</div>':'')+'</div>';
  }
  function metrics(){
    var w=S.w, t=[];
    function add(k,v,u){ if(v!=null&&v!=="") t.push('<div><div class="k">'+esc(L(k))+'</div><div class="v">'+esc(v)+(u?' <small>'+esc(u)+'</small>':'')+'</div></div>'); }
    add({en:"Distance",id:"Jarak"},w.distance_km?dec(w.distance_km,2):null,"km");
    add({en:"Duration",id:"Durasi"},WM.fmtDuration(w.duration_min));
    if(w.pace_sec&&w.distance_km&&w.type!=="cycling") add({en:"Pace",id:"Pace"},WM.fmtPace(w.pace_sec).replace("/km",""),"/km");
    if(w.type==="cycling"&&w.speed_kmh) add({en:"Speed",id:"Kecepatan"},dec(w.speed_kmh),"km/h");
    add({en:"Avg HR",id:"HR rata-rata"},w.avg_heart_rate,"bpm");
    add({en:"Max HR",id:"HR maks"},w.max_heart_rate,"bpm");
    add({en:"Calories",id:"Kalori"},w.calories_burned,L({en:"kcal",id:"kkal"}));
    add({en:"Elevation",id:"Elevasi"},w.elevation_gain_m!=null?Math.round(w.elevation_gain_m):null,"m");
    add({en:"Cadence",id:"Cadence"},w.cadence,"spm");
    var z=w.hr_zone_data, zh="";
    if(z){
      var keys=["z1","z2","z3","z4","z5"], C=["#60A5FA","#34D399","#FBBF24","#FB923C","#F43F5E"];
      var tot=keys.reduce(function(a,k){ return a+(+z[k]||0); },0);
      if(tot>0) zh='<div class="zb">'+keys.map(function(k,i){ return (+z[k]>0)?'<i style="flex:'+(+z[k])+';background:'+C[i]+'"></i>':''; }).join("")+'</div>'+
        '<div class="zl">'+keys.map(function(k,i){ return '<span><i style="background:'+C[i]+'"></i>Z'+(i+1)+' '+esc(WM.fmtDuration((+z[k]||0)/60)||"0:00")+'</span>'; }).join("")+'</div>';
    }
    var sp="";
    if(w.splits&&w.splits.length){
      sp='<table class="sp"><thead><tr><th>km</th><th>'+esc(L({en:"Split",id:"Split"}))+'</th></tr></thead><tbody>'+w.splits.map(function(x){
        return '<tr><td>'+esc(x.km)+'</td><td>'+esc(x.sec?WM.fmtPace(+x.sec).replace("/km",""):"—")+'</td></tr>'; }).join("")+'</tbody></table>';
    }
    return '<div class="sec">'+esc(L({en:"Main metrics",id:"Metrik utama"}))+'</div><div class="card"><div class="mx">'+t.join("")+'</div>'+zh+sp+'</div>';
  }
  function chart(b){
    var pts=(b.series||[]).filter(function(p){ return p.metric!=null; });
    if(pts.length<2) return "";
    var W=600,H=100,P=14, vals=pts.map(function(p){ return p.metric; }), mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    if(b.base!=null){ mn=Math.min(mn,b.base); mx=Math.max(mx,b.base); }
    var rng=(mx-mn)||1, pace=b.kind==="pace";
    function x(i){ return P+(W-2*P)*(pts.length===1?0.5:i/(pts.length-1)); }
    function y(v){ var t=(v-mn)/rng; if(pace) t=1-t; return H-P-(H-2*P)*t; }   // atas = lebih baik
    var d=pts.map(function(p,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.metric).toFixed(1); }).join(" ");
    var avg=b.base!=null?'<line class="av" x1="'+P+'" x2="'+(W-P)+'" y1="'+y(b.base).toFixed(1)+'" y2="'+y(b.base).toFixed(1)+'"/>':'';
    return '<svg class="chart" viewBox="0 0 '+W+' '+(H+14)+'" preserveAspectRatio="none" role="img" aria-label="'+esc(L({en:"Recent similar sessions",id:"Sesi sejenis terakhir"}))+'">'+avg+
      '<path class="ln" d="'+d+'"/>'+pts.map(function(p,i){ return '<circle class="pt'+(p.current?" cur":"")+'" cx="'+x(i).toFixed(1)+'" cy="'+y(p.metric).toFixed(1)+'" r="'+(p.current?5.5:4)+'"/>'; }).join("")+
      '<text x="'+P+'" y="'+(H+12)+'">'+esc(fmtDay(pts[0].date,{day:"numeric",month:"short"}))+'</text><text x="'+(W-P)+'" y="'+(H+12)+'" text-anchor="end">'+esc(fmtDay(pts[pts.length-1].date,{day:"numeric",month:"short"}))+'</text></svg>'+
      '<div class="chart-cap">'+esc(L({en:"Last "+pts.length+" similar sessions · higher = better · dashed line = your usual",id:pts.length+" sesi sejenis terakhir · makin atas makin baik · garis putus = rata-rata biasamu"}))+'</div>';
  }
  function perf(){
    var b=S.a.baseline, body;
    if(b.status==="insufficient"){
      body='<p style="margin:0;font-size:13.5px;line-height:1.55">'+esc(L({en:"Not enough similar sessions yet ("+b.n+" of "+b.needed+"). Once you log "+b.needed+", we'll compare this workout with your usual — no faster/slower claims until then.",id:"Baseline belum cukup ("+b.n+" dari "+b.needed+" sesi sejenis). Setelah ada "+b.needed+", workout ini dibandingkan dengan performa biasanya — sebelum itu tidak ada klaim lebih cepat/lambat."}))+'</p>'+chart(b);
    } else if(b.status!=="ok"){
      body='<p style="margin:0;font-size:13.5px">'+esc(L({en:"This workout type has no pace or speed to compare.",id:"Jenis workout ini tidak punya pace/kecepatan untuk dibandingkan."}))+'</p>';
    } else {
      var pace=b.kind==="pace", cur=pace?WM.fmtPace(b.current):dec(b.current)+" km/h", base=pace?WM.fmtPace(b.base):dec(b.base)+" km/h";
      var cls=b.similar?"eq":(b.delta_pct>0?"down":"up");
      var dTxt=b.similar?L({en:"about the same",id:"mirip biasanya"}):pace?(Math.abs(b.delta)+L({en:" sec ",id:" dtk "})+(b.delta>0?L({en:"slower",id:"lebih lambat"}):L({en:"faster",id:"lebih cepat"})))
        :(dec(Math.abs(b.delta))+" km/h "+(b.delta<0?L({en:"slower",id:"lebih lambat"}):L({en:"faster",id:"lebih cepat"})));
      body='<div class="pf"><div><div class="lb">'+esc(L({en:"This session",id:"Sesi ini"}))+'</div><div class="big">'+esc(cur)+'</div></div>'+
        '<div><div class="lb">'+esc(L({en:"Your usual ("+b.n+" sessions)",id:"Biasanya ("+b.n+" sesi)"}))+'</div><div class="big muted" style="font-size:20px">'+esc(base)+'</div></div>'+
        '<span class="delta '+cls+'">'+(cls==="down"?"↓":cls==="up"?"↑":"=")+' '+esc(dTxt)+'</span></div>'+
        (b.hr!=null&&b.base_hr!=null?'<div class="note">'+esc(L({en:"Avg heart rate ",id:"HR rata-rata "})+b.hr+" bpm · "+L({en:"usual ",id:"biasanya "})+b.base_hr+" bpm ("+(b.hr_delta>0?"+":"")+b.hr_delta+")")+
          (b.efficiency?esc(" · "+L({en:"beats per km ",id:"detak per km "})+b.efficiency.beats_per_km+" vs "+b.efficiency.base_beats_per_km):"")+'</div>':'')+chart(b);
    }
    return '<div class="sec">'+esc(L({en:"Performance vs your usual",id:"Performa vs biasanya"}))+'</div><div class="card">'+body+'</div>';
  }
  function factorAction(f){
    if(f.status!=="tidak_ada_data") return "";
    if(f.key==="sleep") return '<div class="fform"><input type="number" step="0.1" min="0" max="16" inputmode="decimal" id="fSleepH" placeholder="'+esc(L({en:"hours",id:"jam"}))+'"><button type="button" class="b pri" data-act="sleep">'+esc(L({en:"Log last night's sleep",id:"Catat tidur semalam"}))+'</button></div>';
    if(f.key==="hydration") return '<div class="fform"><input type="number" step="50" min="50" max="5000" inputmode="numeric" id="fHydMl" placeholder="ml"><button type="button" class="b pri" data-act="hyd">'+esc(L({en:"Log water (day before)",id:"Catat minum kemarin"}))+'</button></div>';
    if(f.key==="pre_meal"&&f.reason==="no_start_time") return '<button type="button" class="b" data-act="start">'+FIC("clock",14)+' '+esc(L({en:"Add start time",id:"Isi jam mulai"}))+'</button>';
    if(f.key==="nutrition"||f.key==="pre_meal") return '<a class="b" href="/calories">'+FIC("meal",14)+' '+esc(L({en:"Open Calorie Tracker",id:"Buka Calorie Tracker"}))+'</a>';
    if(f.key==="load") return '<a class="b" href="/activity#upload-workout">'+esc(L({en:"Log other workouts",id:"Catat workout lain"}))+'</a>';
    if(f.key==="body") return '<a class="b" href="/activity/visbody">'+esc(L({en:"About Visbody scan",id:"Tentang scan Visbody"}))+'</a>';
    return "";
  }
  function factors(){
    var fs=S.a.factors;
    return '<div class="sec">'+esc(L({en:"What affected your performance",id:"Apa yang memengaruhi performamu"}))+'</div><div class="fx">'+fs.map(function(f){
      var m=FACTOR[f.key]||[{en:f.key,id:f.key},"chart"], infl="";
      if(f.role==="possible_cause") infl='<div class="infl">'+esc(L({en:"Possible influence: ",id:"Kemungkinan pengaruh: "}))+'<b>'+esc(L({tinggi:{en:"high",id:"tinggi"},sedang:{en:"medium",id:"sedang"},rendah:{en:"low",id:"rendah"}}[f.influence]||{en:"",id:""}))+'</b></div>';
      else if(f.role==="watch") infl='<div class="infl"><b>'+esc(L({en:"Worth watching",id:"Perlu diperhatikan"}))+'</b></div>';
      return '<div class="card fc '+esc(f.status)+'"><div class="fc-h"><span class="fc-ic">'+FIC(m[1],18)+'</span><span class="fc-n">'+esc(L(m[0]))+'</span><span class="fchip '+esc(f.status)+'">'+esc(stLabel(f))+'</span></div>'+
        '<p>'+esc(f.sentence)+'</p>'+infl+factorAction(f)+'</div>';
    }).join("")+'</div>';
  }
  function coachCard(){
    var n=S.n||{}, nm=(window.CoachProfiles&&CoachProfiles.NAME[S.coach])||"Coach";
    var src=n.source==="ai"?L({en:"Written by your AI coach from your own data — every number checked.",id:"Ditulis AI coach dari datamu sendiri — semua angka sudah dicek."})
      :L({en:"Automatic summary from your data.",id:"Ringkasan otomatis dari datamu."});
    return '<div class="sec">'+esc(L({en:"Coach says",id:"Kata Coach"}))+'</div><div class="card co" id="coBox"><div class="co-h">'+
      (window.CoachProfiles?CoachProfiles.avatar(S.coach,46):'')+'<div><b>Coach '+esc(nm)+'</b><span>'+esc(L({en:"AI coach · not a doctor",id:"AI coach · bukan dokter"}))+'</span></div></div>'+
      (n.headline?'<p><b>'+esc(n.headline)+'</b></p>':'')+(n.analysis||[]).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("")+
      '<div class="src">'+(S.pending?esc(L({en:"Coach is writing a personal analysis",id:"Coach sedang menulis analisa personal"}))+'<span class="typing"><i></i><i></i><i></i></span>':FIC("check",13)+' '+esc(src))+'</div>'+
      '<div class="acts" style="margin-top:12px"><button type="button" class="b pri" id="bReply">'+FIC("chat",15)+' '+esc(L({en:"Reply to coach",id:"Balas Coach"}))+'</button></div></div>';
  }
  function tipsCard(){
    var t=(S.n&&S.n.next_session_tips)||[];
    if(!t.length) return "";
    return '<div class="sec">'+esc(L({en:"For your next session",id:"Untuk sesi berikutnya"}))+'</div><div class="card"><ul class="tips">'+t.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></div>';
  }
  function ctaCard(){
    var c=S.n&&S.n.cta;
    if(c==="BOOK_CLASS") return '<div class="card" style="margin-top:12px"><div class="acts"><a class="b pri" href="/book-class">'+FIC("calendar",15)+' '+esc(L({en:"Book a class with a 20FIT coach",id:"Book kelas dengan coach 20FIT"}))+'</a></div></div>';
    if(c==="BOOK_DOCTOR") return '<div class="card" style="margin-top:12px"><div class="acts"><a class="b pri" href="/book-doctor">'+FIC("clinic",15)+' '+esc(L({en:"Book a doctor (20FIT Sports Clinic)",id:"Book dokter (20FIT Sports Clinic)"}))+'</a></div></div>';
    return "";
  }
  function safetyCard(){
    var n=S.n||{}, em=S.a.safety.level==="emergency";
    var call=em?(S.emergency?'<a class="b pri" href="tel:'+esc(S.emergency)+'">'+esc(L({en:"Call ",id:"Hubungi "})+S.emergency)+'</a>'
      :'<span class="note" style="margin:0">'+esc(L({en:"Contact your local emergency service or go to the nearest emergency room.",id:"Hubungi layanan darurat setempat atau datang ke IGD terdekat."}))+'</span>'):'';
    return '<div class="card safe"><h2>'+esc(n.headline||"")+'</h2>'+(n.analysis||[]).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("")+
      '<div class="acts">'+call+'<a class="b'+(em?"":" pri")+'" href="/book-doctor">'+FIC("clinic",15)+' '+esc(L({en:"Book a doctor",id:"Book dokter"}))+'</a></div></div>';
  }
  function render(){
    var root=el("root"), html=head();
    if(S.a.safety) html+=safetyCard()+metrics();
    else html+=metrics()+perf()+factors()+coachCard()+tipsCard()+ctaCard();
    html+='<div class="acts" style="margin-top:22px"><button type="button" class="b dng" id="bDel">'+FIC("trash",15)+' '+esc(L({en:"Delete this upload",id:"Hapus upload ini"}))+'</button></div>';
    root.innerHTML=html;
    wire();
  }
  function rerenderCoach(){ var b=el("coBox"); if(!b){ return; } render(); }

  // ---------- aksi ----------
  function wire(){
    var bs=el("bShots"); if(bs) bs.onclick=openShots;
    el("bEdit").onclick=function(){ openEdit(); };
    el("bDel").onclick=delWorkout;
    var br=el("bReply"); if(br) br.onclick=function(){
      var w=S.w, msg=L({en:"About my "+w.title+" on "+fmtDay(w.date,{day:"numeric",month:"short"})+": ",id:"Soal "+w.title+" tanggal "+fmtDay(w.date,{day:"numeric",month:"short"})+": "});
      location.href="/activity/chat/"+encodeURIComponent(S.coach)+"?ask="+encodeURIComponent(msg);
    };
    Array.prototype.forEach.call(document.querySelectorAll("[data-act]"),function(b){
      b.onclick=function(){ var a=b.getAttribute("data-act"); if(a==="start") openEdit("eStart"); else if(a==="sleep") logSleep(b); else if(a==="hyd") logHyd(b); };
    });
  }
  async function uid(){ try{ var au=await Auth.supabase.auth.getUser(); return (au&&au.data&&au.data.user)?au.data.user.id:null; }catch(e){ return null; } }
  // Isi data yang kosong langsung dari sini -> analisa dihitung ulang (hash input berubah).
  async function logSleep(btn){
    var h=parseFloat(el("fSleepH").value); if(!(h>0&&h<=16)) { el("fSleepH").focus(); return; }
    btn.disabled=true;
    try{
      var u=await uid(); if(!u) throw new Error();
      var r=await Auth.supabase.from("my20fit_sleep").upsert({auth_user_id:u,sleep_date:S.w.date,duration_hours:h,source:"manual",updated_at:new Date().toISOString()},{onConflict:"auth_user_id,sleep_date"});
      if(r.error) throw r.error;
      try{ await Auth.saveDaily({sleep_hours:h},S.w.date); }catch(e){}
      await load();
    }catch(e){ btn.disabled=false; alert(L({en:"Couldn't save. Try again.",id:"Gagal menyimpan. Coba lagi."})); }
  }
  async function logHyd(btn){
    var ml=parseInt(el("fHydMl").value,10); if(!(ml>0&&ml<=5000)) { el("fHydMl").focus(); return; }
    btn.disabled=true;
    try{
      var u=await uid(); if(!u) throw new Error(); var d1=addDays(S.w.date,-1);
      var r=await Auth.supabase.from("my20fit_hydration").insert({auth_user_id:u,log_date:d1,amount_ml:ml,drink_type:"water"});
      if(r.error) throw r.error;
      try{ await Auth.saveDaily({water_glasses:Math.round(ml/250)},d1); }catch(e){}
      await load();
    }catch(e){ btn.disabled=false; alert(L({en:"Couldn't save. Try again.",id:"Gagal menyimpan. Coba lagi."})); }
  }
  function openShots(){
    var d=el("shotDlg");
    d.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>'+esc(L({en:"Original screenshot",id:"Screenshot asli"}))+'</b><button type="button" class="b" id="shClose">✕</button></div>'+
      '<div class="shots">'+S.w.screenshots.map(function(u){ return '<img src="'+esc(u)+'" alt="">'; }).join("")+'</div>';
    el("shClose").onclick=function(){ d.close(); };
    d.showModal();
  }
  function openEdit(focusId){
    var w=S.w, d=el("edDlg");
    var types=Object.keys(WM.TYPES).map(function(k){ return '<option value="'+k+'"'+(k===w.type?" selected":"")+'>'+esc(WM.typeLabel(k,lang()))+'</option>'; }).join("");
    function v(x){ return x==null?"":esc(x); }
    d.innerHTML='<b style="font-size:15px">'+esc(L({en:"Edit workout data",id:"Edit data workout"}))+'</b>'+
      '<div class="note" style="margin-top:4px">'+esc(L({en:"Fix anything the AI read wrong. The analysis is recalculated after saving.",id:"Perbaiki yang salah terbaca AI. Analisa dihitung ulang setelah disimpan."}))+'</div>'+
      '<div class="g2"><div><label>'+esc(L({en:"Date",id:"Tanggal"}))+'</label><input type="date" id="eDate" max="'+today()+'" value="'+v(w.date)+'"></div>'+
      '<div><label>'+esc(L({en:"Start time",id:"Jam mulai"}))+'</label><input type="time" id="eStart" value="'+v(w.started_at)+'"></div></div>'+
      '<label>'+esc(L({en:"Type",id:"Jenis"}))+'</label><select id="eType">'+types+'</select>'+
      '<div class="g2"><div><label>'+esc(L({en:"Duration (min)",id:"Durasi (menit)"}))+'</label><input type="number" step="0.01" id="eDur" value="'+v(w.duration_min)+'"></div>'+
      '<div><label>'+esc(L({en:"Distance (km)",id:"Jarak (km)"}))+'</label><input type="number" step="0.01" id="eDist" value="'+v(w.distance_km)+'"></div></div>'+
      '<div class="g2"><div><label>'+esc(L({en:"Avg HR",id:"HR rata-rata"}))+'</label><input type="number" id="eHr" value="'+v(w.avg_heart_rate)+'"></div>'+
      '<div><label>'+esc(L({en:"Max HR",id:"HR maks"}))+'</label><input type="number" id="eMax" value="'+v(w.max_heart_rate)+'"></div></div>'+
      '<label>'+esc(L({en:"Calories",id:"Kalori"}))+'</label><input type="number" id="eKcal" value="'+v(w.calories_burned)+'">'+
      '<label>'+esc(L({en:"Note (pain, dizziness, how it felt)",id:"Catatan (nyeri, pusing, rasanya gimana)"}))+'</label><textarea id="eNote" rows="2" maxlength="500">'+v(w.note)+'</textarea>'+
      '<div class="err" id="eErr"></div><div class="acts" style="margin-top:10px"><button type="button" class="b" id="eCancel">'+esc(L({en:"Cancel",id:"Batal"}))+'</button>'+
      '<button type="button" class="b pri" id="eSave">'+esc(L({en:"Save & recalculate",id:"Simpan & hitung ulang"}))+'</button></div>';
    el("eCancel").onclick=function(){ d.close(); };
    el("eSave").onclick=async function(){
      var btn=this, num=function(id){ var x=el(id).value; return x===""?null:Number(x); };
      var body={ workout_date:el("eDate").value, started_at:el("eStart").value||null, type:el("eType").value, duration_min:num("eDur"), distance_km:num("eDist"),
        avg_heart_rate:num("eHr"), max_heart_rate:num("eMax"), calories_burned:num("eKcal"), note:el("eNote").value.trim()||null };
      btn.disabled=true;
      var r=await api("/api/activity/workout/"+encodeURIComponent(ID),{method:"PATCH",body:JSON.stringify(body)}).catch(function(){ return {ok:false,j:{}}; });
      btn.disabled=false;
      if(!r.ok){ el("eErr").textContent=r.j.error||L({en:"Couldn't save.",id:"Gagal menyimpan."}); return; }
      d.close(); load();
    };
    d.showModal();
    if(focusId&&el(focusId)) el(focusId).focus();
  }
  async function delWorkout(){
    if(!confirm(L({en:"Delete this workout, its screenshot and analysis? This can't be undone.",id:"Hapus workout ini beserta screenshot & analisanya? Tidak bisa dibatalkan."}))) return;
    var r=await api("/api/activity/workout/"+encodeURIComponent(ID),{method:"DELETE"}).catch(function(){ return {ok:false,j:{}}; });
    if(r.ok) location.href="/activity/history"; else alert(r.j.error||L({en:"Couldn't delete.",id:"Gagal menghapus."}));
  }

  // ---------- data ----------
  async function narrative(){
    S.pending=true;
    try{
      var r=await api("/api/activity/workouts/"+encodeURIComponent(ID)+"/narrative",{method:"POST",body:JSON.stringify({lang:lang(),coach_id:S.coach})});
      if(r.ok&&r.j.narrative) S.n=r.j.narrative;
    }catch(e){}
    S.pending=false;
    if(S.n&&S.n.coach_id&&window.CoachProfiles&&CoachProfiles.NAME[S.n.coach_id]) S.coach=S.n.coach_id;
    rerenderCoach();
  }
  async function load(){
    var root=el("root");
    try{
      var r=await api("/api/activity/workouts/"+encodeURIComponent(ID)+"?lang="+lang());
      if(r.status===404){ root.innerHTML='<div class="card"><div class="empty">'+esc(L({en:"Workout not found.",id:"Workout tidak ditemukan."}))+'<br><a href="/activity/history">'+esc(L({en:"Back to history",id:"Kembali ke riwayat"}))+'</a></div></div>'; return; }
      if(!r.ok) throw new Error();
      S.w=r.j.workout; S.a=r.j.analysis; S.n=r.j.narrative; S.emergency=r.j.emergency_number||null;
      if(r.j.coach_id&&window.CoachProfiles&&CoachProfiles.NAME[r.j.coach_id]) S.coach=r.j.coach_id;
      S.pending=!!r.j.narrative_pending;
      render();
      if(S.pending) narrative();
    }catch(e){
      if(String(e&&e.message)==="401") return;
      root.innerHTML='<div class="card"><div class="empty">'+esc(L({en:"Couldn't load this workout.",id:"Gagal memuat workout ini."}))+'<br><button type="button" class="b" id="retry" style="margin-top:10px">'+esc(L({en:"Try again",id:"Coba lagi"}))+'</button></div></div>';
      el("retry").onclick=load;
    }
  }
  (async function(){
    try{ await Auth.requireAuth(); }catch(e){ location.href="/login"; return; }
    if(window.CoachProfiles) CoachProfiles.loadRoster().then(function(){ if(S.w) render(); });
    load();
    if(window.I18N&&I18N.onChange) I18N.onChange(load);   // narasi mengikuti bahasa aktif
  })();
})();
</script>
</body>
</html>
